<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mallan Real Estate - Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18"></script>
    <style type="text/tailwindcss">
        @import "tailwindcss";
        @theme {
            --color-gold: #B8860B;
            --color-gold-light: #D4A843;
            --color-gold-dark: #8B6508;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="robots" content="noindex, nofollow">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center font-sans">

    <div class="w-full max-w-md px-6">
        <!-- Logo / Brand -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-900 rounded-xl mb-4">
                <span class="text-gold font-bold text-2xl">M</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Mallan Real Estate</h1>
            <p class="text-sm text-gray-500 mt-1">CRM Login</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-lg border border-gray-200 p-8">
            <form id="loginForm" class="space-y-5" autocomplete="on">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-700 mb-1.5">Email Address</label>
                    <input type="email" id="email" name="email" required autocomplete="email"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gold/50 focus:border-gold transition"
                        placeholder="you@mallan.nyc">
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-700 mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gold/50 focus:border-gold transition"
                        placeholder="Enter password">
                </div>

                <!-- Portal Type (hidden by default, for client portals) -->
                <input type="hidden" id="portalType" value="agent">

                <!-- Error Message -->
                <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg p-3"></div>

                <!-- Submit -->
                <button type="submit" id="submitBtn"
                    class="w-full py-2.5 bg-gray-900 text-white text-sm font-semibold rounded-lg hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gold/50 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Sign In
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-gray-400 mt-6">
            Mallan Real Estate Inc. &mdash; Licensed Broker #10991205323
        </p>
    </div>

    <!-- API Client -->
    <script src="js/core/api-client.js"></script>

    <script>
    (function () {
        'use strict';

        // ── Configure API base URL ──
        // If served from GitHub Pages or a non-mallan.nyc origin, point to the API
        var currentOrigin = window.location.origin;
        if (currentOrigin.indexOf('mallan.nyc') === -1) {
            MallanAPI.configure({ baseUrl: 'https://mallan.nyc' });
        }

        // ── Check if already logged in ──
        if (MallanAPI.hasToken) {
            MallanAPI.init().then(function (data) {
                if (data.authenticated) {
                    redirectAfterLogin();
                }
            });
        }

        // ── Determine redirect target ──
        function getRedirectTarget() {
            var params = new URLSearchParams(window.location.search);
            return params.get('redirect') || 'MALLAN-NYC-CRM-FINAL2.html';
        }

        function redirectAfterLogin() {
            window.location.href = getRedirectTarget();
        }

        // ── Portal type from URL (?portal=buyer) ──
        var params = new URLSearchParams(window.location.search);
        var portalParam = params.get('portal');
        if (portalParam) {
            document.getElementById('portalType').value = portalParam;
        }

        // ── Form submission ──
        var form = document.getElementById('loginForm');
        var errorMsg = document.getElementById('errorMsg');
        var submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            errorMsg.classList.add('hidden');

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var portalType = document.getElementById('portalType').value;

            if (!email || !password) {
                showError('Please enter email and password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            MallanAPI.auth.login(email, password, portalType).then(function (data) {
                if (data.success) {
                    redirectAfterLogin();
                } else {
                    showError(data.error || 'Login failed.');
                    resetButton();
                }
            }).catch(function (err) {
                showError(err.message === 'Unauthorized' ? 'Invalid email or password.' : 'Connection error. Please try again.');
                resetButton();
            });
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
        }

        function resetButton() {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    })();
    </script>
</body>
</html>
