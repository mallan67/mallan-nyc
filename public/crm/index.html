    <script>
    window.onerror = function(msg, url, line, col, error) {
        var errDiv = document.getElementById('jsErrorBanner');
        if (!errDiv) {
            errDiv = document.createElement('div');
            errDiv.id = 'jsErrorBanner';
            errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#fee;border-bottom:2px solid #f00;padding:8px 16px;font:12px monospace;max-height:200px;overflow-y:auto;';
            errDiv.innerHTML = '<strong style="color:red">JS Errors Detected:</strong><br>';
            document.body.appendChild(errDiv);
        }
        errDiv.innerHTML += 'Line ' + line + ': ' + msg + '<br>';
        return false;
    };
    </script>

<script>
function toggleSection(header) {
    var content = header.nextElementSibling;
    var icon = header.querySelector('i');
    if (content) content.classList.toggle('collapsed');
    if (icon) { icon.classList.toggle('fa-minus'); icon.classList.toggle('fa-plus'); }
}
</script>
