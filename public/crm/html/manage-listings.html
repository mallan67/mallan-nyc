<!-- SECTION: MANAGE MY LISTINGS -->
<div id="section-manage" class="p-6" style="display:none">

    <!-- Header: Title + Toggle (single row) -->
    <div class="flex items-center justify-between gap-3 mb-3">
        <div class="min-w-0">
            <h2 id="manageTitle" class="text-lg sm:text-xl font-bold text-gray-900 leading-tight truncate">Sale Exclusives</h2>
            <p id="manageSubtitle" class="text-gray-400 text-xs mt-0.5 hidden sm:block">Manage your exclusive sale listings &middot; REBNY RLS</p>
        </div>
        <div class="inline-flex rounded-lg border border-gray-300 overflow-hidden text-xs sm:text-sm font-semibold flex-shrink-0">
            <button id="manageToggleSales" onclick="toggleManageMode('sales')" class="px-3 sm:px-4 py-1.5 sm:py-2 bg-gray-900 text-white">SALES</button>
            <button id="manageToggleRentals" onclick="toggleManageMode('rentals')" class="px-3 sm:px-4 py-1.5 sm:py-2 bg-white text-gray-600 hover:bg-gray-50">RENTALS</button>
        </div>
    </div>

    <!-- Actions Bar -->
    <div class="flex items-center gap-2 mb-3">
        <select id="manageDealsFilter" onchange="filterManageDeals(this.value)" class="border rounded-lg px-2.5 py-2 text-sm flex-shrink-0" aria-label="Filter by deal type">
            <option value="all">All Deals</option>
            <option value="my">My Deals</option>
            <option value="co">Co-Listed</option>
        </select>
        <button id="manageOHToggleBtn" onclick="toggleOHOverview()" class="px-3 py-2 border rounded-lg hover:bg-gray-100 text-sm font-medium text-gray-700 flex items-center gap-2 min-h-[40px] flex-shrink-0" title="Open Houses" aria-label="Open Houses">
            <i class="fas fa-calendar-alt text-blue-500"></i>
            <span>Open Houses</span>
            <span id="manageOHBadge" class="min-w-[18px] h-[18px] bg-gray-800 text-white text-[10px] font-bold rounded-full flex items-center justify-center px-1" style="display:none"></span>
        </button>
        <div class="flex-1"></div>
        <button onclick="manageExportTable()" class="p-2 border rounded-lg hover:bg-gray-50 flex-shrink-0" title="Export" aria-label="Export"><i class="fas fa-file-export text-gray-400 text-sm"></i></button>
        <button id="manageCreateBtn" onclick="manageCreateListing()" class="px-3 py-2 bg-gray-900 text-white rounded-lg text-sm font-semibold hover:bg-gray-800 flex items-center gap-1.5 flex-shrink-0 min-h-[40px]">
            <i class="fas fa-plus text-xs"></i> <span class="hidden sm:inline">Create Sale Listing</span><span class="sm:hidden">New</span>
        </button>
    </div>

    <!-- ======== OPEN HOUSES DRAWER (slide-in from right) ======== -->
    <div id="ohOverviewPanel" class="fixed inset-0 z-[180]" style="display:none">
        <div class="absolute inset-0 bg-black/40" onclick="toggleOHOverview()"></div>
        <div class="absolute right-0 top-0 bottom-0 w-full sm:max-w-[440px] bg-white shadow-2xl flex flex-col">
            <!-- Drawer header -->
            <div class="px-5 py-4 border-b border-gray-200 flex items-center justify-between flex-shrink-0 bg-white">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gray-100 flex items-center justify-center">
                        <i class="fas fa-door-open text-gray-600"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-gray-900 text-base">Open Houses</h3>
                        <p id="ohOverviewCount" class="text-xs text-gray-500 mt-0.5"></p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="ohOverviewAddBtn" onclick="toggleOHOverviewForm()" class="px-3.5 py-2 bg-gray-900 text-white rounded-lg text-sm font-semibold hover:bg-gray-800 flex items-center gap-1.5 min-h-[36px]"><i class="fas fa-plus text-xs"></i> Schedule</button>
                    <button onclick="toggleOHOverview()" class="w-9 h-9 rounded-lg hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-600" aria-label="Close"><i class="fas fa-times"></i></button>
                </div>
            </div>

            <!-- Quick-add form -->
            <div id="ohOverviewForm" class="px-5 py-4 border-b border-gray-200 bg-gray-50/80" style="display:none">
                <div class="space-y-3 mb-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Listing</label>
                        <select id="ohOverviewListing" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white"></select>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Date</label>
                            <input id="ohOverviewDate" type="date" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Start</label>
                            <input id="ohOverviewStart" type="time" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base bg-white">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">End</label>
                            <input id="ohOverviewEnd" type="time" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base bg-white">
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-semibold text-gray-600 mb-1.5">Type</label>
                    <div class="flex flex-wrap gap-2">
                        <label class="flex items-center gap-2 px-3 py-2 border border-gray-200 rounded-lg cursor-pointer text-sm bg-white hover:bg-gray-100 has-[:checked]:bg-gray-100 has-[:checked]:border-gray-400 min-h-[40px] transition-colors"><input type="checkbox" id="ohOverviewType-public" class="accent-gray-700"> <span class="font-medium text-gray-700">Open House</span></label>
                        <label class="flex items-center gap-2 px-3 py-2 border border-gray-200 rounded-lg cursor-pointer text-sm bg-white hover:bg-gray-100 has-[:checked]:bg-gray-100 has-[:checked]:border-gray-400 min-h-[40px] transition-colors"><input type="checkbox" id="ohOverviewType-broker" class="accent-gray-700"> <span class="font-medium text-gray-700">Broker Open House</span></label>
                        <label class="flex items-center gap-2 px-3 py-2 border border-gray-200 rounded-lg cursor-pointer text-sm bg-white hover:bg-gray-100 has-[:checked]:bg-gray-100 has-[:checked]:border-gray-400 min-h-[40px] transition-colors"><input type="checkbox" id="ohOverviewType-appt" class="accent-gray-700"> <span class="font-medium text-gray-700">Open House By Appointment Only</span></label>
                        <label class="flex items-center gap-2 px-3 py-2 border border-gray-200 rounded-lg cursor-pointer text-sm bg-white hover:bg-gray-100 has-[:checked]:bg-gray-100 has-[:checked]:border-gray-400 min-h-[40px] transition-colors"><input type="checkbox" id="ohOverviewType-virtual" class="accent-gray-700" onchange="document.getElementById('ohOverviewLinkWrap').style.display=this.checked?'block':'none'"> <span class="font-medium text-gray-700">Virtual Tour</span></label>
                    </div>
                </div>
                <div id="ohOverviewLinkWrap" style="display:none" class="mb-3">
                    <input id="ohOverviewLink" type="url" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white" placeholder="Virtual tour link (Zoom, FaceTime...)">
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Repeat</label>
                    <select id="ohOverviewRepeat" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white">
                        <option value="none">No Repeat</option>
                        <option value="weekly">Weekly</option>
                        <option value="biweekly">Every 2 Weeks</option>
                    </select>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="ohOverviewSave()" class="flex-1 px-4 py-2.5 bg-gray-900 text-white rounded-lg text-sm font-semibold hover:bg-gray-800 min-h-[44px] flex items-center justify-center gap-2"><i class="fas fa-plus text-xs"></i> Schedule</button>
                    <button onclick="toggleOHOverviewForm()" class="px-4 py-2.5 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50 min-h-[44px]">Cancel</button>
                </div>
            </div>

            <!-- OH list (scrollable) -->
            <div class="flex-1 overflow-y-auto">
                <div id="ohOverviewList"></div>
                <div id="ohOverviewEmpty" class="px-5 py-12 text-center" style="display:none">
                    <div class="w-14 h-14 rounded-full bg-gray-100 flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-door-open text-2xl text-gray-300"></i>
                    </div>
                    <p class="text-gray-500 font-medium">No open houses scheduled</p>
                    <p class="text-gray-400 text-sm mt-1">Click "Schedule" to add one</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Status Filter Pills (horizontal scroll on mobile) + View Toggle -->
    <div class="flex items-center gap-3 mb-4">
        <div class="flex-1 overflow-x-auto">
            <div id="manageStatusPills" class="flex gap-1.5"></div>
        </div>
        <div id="manageViewToggle" class="hidden md:flex items-center gap-1 border rounded-lg p-0.5 flex-shrink-0">
            <button id="manageViewBtn-cards" onclick="toggleManageView('cards')" class="p-2 rounded-md bg-gray-900 text-white" title="Card View" aria-label="Card View"><i class="fas fa-th-large text-xs"></i></button>
            <button id="manageViewBtn-table" onclick="toggleManageView('table')" class="p-2 rounded-md text-gray-400 hover:text-gray-600" title="Table View" aria-label="Table View"><i class="fas fa-table text-xs"></i></button>
        </div>
    </div>

    <!-- ======== CARD VIEW (default, mobile-first) ======== -->
    <div id="manageCardView">
        <div id="manageCardList" class="flex flex-col gap-4"></div>
        <div id="manageCardEmpty" class="border border-gray-200 border-dashed rounded-lg p-12 text-center" style="display:none">
            <i class="fas fa-clipboard-list text-4xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 font-medium">No listings found</p>
            <p class="text-gray-400 text-sm mt-1">Adjust your filters or create a new listing</p>
        </div>
    </div>

    <!-- ======== TABLE VIEW (desktop toggle) ======== -->
    <div id="manageTableView" style="display:none">
        <div class="bg-white rounded-xl shadow-sm border overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-sm" id="manageTable">
                    <thead id="manageTableHead" class="bg-gray-50 text-xs text-gray-500 uppercase"></thead>
                    <tbody id="manageTableBody"></tbody>
                </table>
            </div>
            <div id="manageEmptyState" class="p-12 text-center" style="display:none">
                <i class="fas fa-clipboard-list text-4xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 font-medium">No listings found</p>
                <p class="text-gray-400 text-sm mt-1">Adjust your filters or create a new listing</p>
            </div>
        </div>
    </div>

    <!-- Compliance Dashboard removed — lives in Broker CRM dashboard only -->
</div>
