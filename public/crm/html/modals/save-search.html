<!-- SAVE SEARCH MODAL (extracted from section-main) -->
<div id="saveSearchModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
        <div class="p-4 border-b">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-gray-900">Save Search</h3>
                <button onclick="closeSaveSearchModal()" class="text-gray-400 hover:text-gray-600" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Search Name *</label>
                <input type="text" id="savedSearchName" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="e.g., UWS 2BR Under $1.5M">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                <textarea id="savedSearchNotes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Add notes..."></textarea>
            </div>
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
                <p class="text-xs text-blue-700"><i class="fas fa-info-circle mr-1"></i> This search will save: current filters, view mode, selected columns, and sort order.</p>
            </div>
        </div>
        <div class="p-4 border-t bg-gray-50 flex justify-end gap-3">
            <button onclick="closeSaveSearchModal()" class="px-4 py-2 border rounded-lg text-sm hover:bg-gray-100">Cancel</button>
            <button onclick="saveCurrentSearch()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">Save Search</button>
        </div>
    </div>
</div>
