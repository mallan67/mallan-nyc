<!-- SAVE SEARCH MODAL (extracted from section-main) -->
<div id="saveSearchModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="saveSearchModalTitle">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
        <div class="p-4 border-b">
            <div class="flex items-center justify-between">
                <h3 id="saveSearchModalTitle" class="font-bold text-gray-900">Save Search</h3>
                <button onclick="closeSaveSearchModal()" class="text-gray-400 hover:text-gray-600" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="p-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Search Name *</label>
                <input type="text" id="savedSearchName" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="e.g., UWS 2BR Under $1.5M">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Assign to Client</label>
                <select id="savedSearchClientId" class="w-full border rounded-lg px-3 py-2 text-sm">
                    <option value="">-- No client (agent only) --</option>
                </select>
                <p class="text-xs text-gray-400 mt-1">Matching listings will appear in the client's portal</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Alerts</label>
                <select id="savedSearchAlertFreq" class="w-full border rounded-lg px-3 py-2 text-sm disabled:bg-gray-100 disabled:cursor-not-allowed">
                    <option value="">Off</option>
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                </select>
                <p class="text-xs text-gray-400 mt-1">Requires client with TCPA consent on file</p>
                <!-- P0-3 alert-gate hint: populated by saved-searches.js
                     _refreshSaveState() when no executed search is available
                     contain keys the projection-backed alert engine does
                     not support. Hidden by default. -->
                <p id="savedSearchAlertGateHint" class="text-xs text-amber-700 mt-1 hidden" role="alert" aria-live="polite"></p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                <textarea id="savedSearchNotes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Add notes..."></textarea>
            </div>
            <div id="savedSearchCriteriaSummary" class="bg-blue-50 border border-blue-200 rounded-lg p-3">
                <p class="text-xs text-blue-700"><i class="fas fa-info-circle mr-1"></i> Current search criteria will be saved.</p>
            </div>
        </div>
        <div class="p-4 border-t bg-gray-50 flex justify-end gap-3">
            <button onclick="closeSaveSearchModal()" class="px-4 py-2 border rounded-lg text-sm hover:bg-gray-100">Cancel</button>
            <button onclick="saveCurrentSearch()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">Save Search</button>
        </div>
    </div>
</div>
