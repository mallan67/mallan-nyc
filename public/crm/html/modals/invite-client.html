<!-- INVITE CLIENT MODAL (extracted from section-client) -->
<div id="inviteClientModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="inviteClientModalTitle">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto">
        <div class="p-4 border-b flex items-center justify-between">
            <h3 id="inviteClientModalTitle" class="font-bold text-gray-900"><i class="fas fa-paper-plane text-blue-500 mr-2"></i>Invite to Client Portal</h3>
            <button onclick="closeInviteModal()" class="text-gray-400 hover:text-gray-600" aria-label="Close dialog"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-6 space-y-4">
            <div class="flex items-center gap-3">
                <div id="inviteClientAvatar" class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg"></div>
                <div><p id="inviteClientName" class="font-semibold text-gray-900"></p><p id="inviteClientEmail" class="text-sm text-gray-500"></p></div>
            </div>
            <div id="inviteTimeline" class="py-3"></div>
            <div id="inviteResendInfo" class="text-xs text-gray-500 hidden"></div>
            <label class="flex items-center gap-2 text-sm text-gray-700 bg-gray-50 rounded-lg p-3">
                <input type="checkbox" id="inviteIncludePortfolio" checked class="accent-blue-600 w-4 h-4">
                Include current portfolio (<span id="invitePortfolioCount">0</span> listings)
            </label>
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-blue-800">
                <p class="font-semibold mb-1">What the client will receive:</p>
                <ul class="space-y-0.5 list-disc ml-4">
                    <li>Email invitation with secure login link</li>
                    <li>Access to their curated property portfolio</li>
                    <li>Ability to like, pass, or comment on listings</li>
                    <li>Listing alerts based on your configured settings</li>
                </ul>
            </div>
        </div>
        <div class="p-4 border-t bg-gray-50 flex justify-end gap-3">
            <button onclick="closeInviteModal()" class="px-4 py-2 border rounded-lg text-sm hover:bg-gray-100">Cancel</button>
            <button onclick="sendInvite()" id="inviteSendBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700"><i class="fas fa-paper-plane mr-1"></i>Send Invite</button>
        </div>
    </div>
</div>
