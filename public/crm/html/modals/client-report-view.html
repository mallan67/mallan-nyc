<!-- CLIENT REPORT VIEW MODAL (extracted from section-main) -->
<div id="clientReportViewModal" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[95vh] overflow-hidden flex flex-col">
        <!-- Client View Header -->
        <div class="p-4 border-b bg-gradient-to-r from-gray-800 to-gray-900 flex items-center justify-between flex-shrink-0">
            <div>
                <h3 class="text-lg font-bold text-white" id="clientReportViewTitle">Property Report</h3>
                <p class="text-gray-300 text-sm">6 properties matching your criteria · Click properties to give feedback</p>
            </div>
            <button onclick="closeClientReportViewModal()" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white hover:bg-white/20" aria-label="Close">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Client View Body -->
        <div class="flex-1 overflow-y-auto bg-gray-100 p-6">
            <!-- Properties Grid with Feedback -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                <!-- Property Card 1 - With Client Feedback UI -->
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden group" data-building="432-park">
                    <div class="relative">
                        <div class="h-40 bg-gradient-to-br from-gray-900 via-gray-800 to-black flex items-center justify-center relative">
                            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-400 via-amber-300 to-amber-400"></div>
                            <div class="text-center z-10">
                                <i class="fas fa-crown text-3xl text-amber-400/70 mb-1"></i>
                                <p class="text-amber-200/80 text-xs tracking-widest">432 PARK AVENUE</p>
                            </div>
                        </div>
                        <!-- Property Identifier Badge -->
                        <div class="absolute top-3 left-3">
                            <span class="px-3 py-1.5 bg-white/95 backdrop-blur text-gray-900 text-sm font-bold rounded-lg shadow-lg">
                                432 Park · PH92
                            </span>
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xl font-bold text-gray-900">$85,000<span class="text-sm font-normal text-gray-500">/mo</span></span>
                            <span class="px-2 py-1 bg-green-100 text-green-700 text-xs rounded font-semibold">Active</span>
                        </div>
                        <div class="flex items-center gap-4 text-sm text-gray-600 mb-3">
                            <span><i class="fas fa-bed mr-1"></i> 6 BR</span>
                            <span><i class="fas fa-bath mr-1"></i> 7 BA</span>
                            <span><i class="fas fa-ruler-combined mr-1"></i> 8,255 SF</span>
                        </div>

                        <!-- CLIENT FEEDBACK BUTTONS -->
                        <div class="pt-3 border-t">
                            <p class="text-xs text-gray-500 mb-2">What do you think?</p>
                            <div class="flex items-center gap-2">
                                <button onclick="setClientFeedback('432-park', 'pass')" class="client-feedback-btn flex-1 px-3 py-2 border rounded-lg text-sm hover:bg-red-50 hover:border-red-200 hover:text-red-600 transition-all flex items-center justify-center gap-1" data-building="432-park" data-response="pass">
                                    <i class="fas fa-times"></i> Pass
                                </button>
                                <button onclick="setClientFeedback('432-park', 'save')" class="client-feedback-btn flex-1 px-3 py-2 border rounded-lg text-sm hover:bg-yellow-50 hover:border-yellow-200 hover:text-yellow-600 transition-all flex items-center justify-center gap-1" data-building="432-park" data-response="save">
                                    <i class="fas fa-bookmark"></i> Save
                                </button>
                                <button onclick="setClientFeedback('432-park', 'love')" class="client-feedback-btn flex-1 px-3 py-2 border rounded-lg text-sm hover:bg-green-50 hover:border-green-200 hover:text-green-600 transition-all flex items-center justify-center gap-1" data-building="432-park" data-response="love">
                                    <i class="fas fa-heart"></i> Love
                                </button>
                                <button onclick="setClientFeedback('432-park', 'tour')" class="client-feedback-btn px-3 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 transition-all flex items-center justify-center gap-1" data-building="432-park" data-response="tour">
                                    <i class="fas fa-calendar"></i> Tour
                                </button>
                            </div>
                            <!-- Note field that appears after selection -->
                            <div class="mt-2 hidden feedback-note-field" data-building="432-park">
                                <input type="text" placeholder="Add a note about this property (optional)" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Property Card 2 -->
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden group" data-building="one57">
                    <div class="relative">
                        <div class="h-40 bg-gradient-to-br from-indigo-900 via-purple-900 to-slate-900 flex items-center justify-center relative">
                            <div class="text-center z-10">
                                <i class="fas fa-gem text-3xl text-purple-300/70 mb-1"></i>
                                <p class="text-purple-200/80 text-xs tracking-widest">ONE57</p>
                            </div>
                        </div>
                        <div class="absolute top-3 left-3">
                            <span class="px-3 py-1.5 bg-white/95 backdrop-blur text-gray-900 text-sm font-bold rounded-lg shadow-lg">
                                One57 · 75B
                            </span>
                        </div>
                    </div>
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xl font-bold text-gray-900">$32,500<span class="text-sm font-normal text-gray-500">/mo</span></span>
                            <span class="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded font-semibold">Withdrawn</span>
                        </div>
                        <div class="flex items-center gap-4 text-sm text-gray-600 mb-3">
                            <span><i class="fas fa-bed mr-1"></i> 4 BR</span>
                            <span><i class="fas fa-bath mr-1"></i> 5 BA</span>
                            <span><i class="fas fa-ruler-combined mr-1"></i> 4,483 SF</span>
                        </div>
                        <div class="pt-3 border-t">
                            <p class="text-xs text-gray-500 mb-2">What do you think?</p>
                            <div class="flex items-center gap-2">
                                <button onclick="setClientFeedback('one57', 'pass')" class="client-feedback-btn flex-1 px-3 py-2 border rounded-lg text-sm hover:bg-red-50 hover:border-red-200 hover:text-red-600 transition-all flex items-center justify-center gap-1">
                                    <i class="fas fa-times"></i> Pass
                                </button>
                                <button onclick="setClientFeedback('one57', 'save')" class="client-feedback-btn flex-1 px-3 py-2 border rounded-lg text-sm hover:bg-yellow-50 hover:border-yellow-200 hover:text-yellow-600 transition-all flex items-center justify-center gap-1">
                                    <i class="fas fa-bookmark"></i> Save
                                </button>
                                <button onclick="setClientFeedback('one57', 'love')" class="client-feedback-btn flex-1 px-3 py-2 border rounded-lg text-sm hover:bg-green-50 hover:border-green-200 hover:text-green-600 transition-all flex items-center justify-center gap-1">
                                    <i class="fas fa-heart"></i> Love
                                </button>
                                <button onclick="setClientFeedback('one57', 'tour')" class="client-feedback-btn px-3 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 transition-all flex items-center justify-center gap-1">
                                    <i class="fas fa-calendar"></i> Tour
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Client View Footer - Submit Feedback -->
        <div class="p-4 border-t bg-white flex-shrink-0">
            <div class="flex items-center justify-between">
                <div class="text-sm text-gray-600">
                    <span class="font-semibold text-gray-900">4 of 6</span> properties reviewed
                </div>
                <div class="flex items-center gap-3">
                    <button class="px-4 py-2 border rounded-lg text-sm hover:bg-gray-50">
                        Add Message to Agent
                    </button>
                    <button onclick="submitClientFeedback()" class="px-6 py-2 bg-green-600 text-white rounded-lg text-sm font-semibold hover:bg-green-700 flex items-center gap-2">
                        <i class="fas fa-paper-plane"></i> Send Feedback to Agent
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
