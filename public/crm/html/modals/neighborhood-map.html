<!-- NEIGHBORHOOD MAP MODAL — MapLibre GL + OpenFreeMap -->
<style>
  /* Neighborhood Map Modal — clean reference design */
  .nb-modal-panel { background: rgba(255,255,255,0.96); }
  .nb-sidebar-header {
    padding: 14px 14px 10px 14px;
    border-bottom: 1px solid rgba(17,24,39,0.10);
    background: linear-gradient(to bottom, rgba(255,255,255,0.98), rgba(255,255,255,0.93));
  }
  .nb-title { font-weight: 700; font-size: 13px; letter-spacing: 0.02em; color: #111827; }
  .nb-pill { font-size: 11px; color: #111827; border: 1px solid rgba(17,24,39,0.10); padding: 5px 8px; border-radius: 999px; background: rgba(255,255,255,0.9); }
  .nb-search-input {
    flex: 1; border: 1px solid rgba(17,24,39,0.10); border-radius: 12px;
    padding: 10px 12px; font-size: 12px; outline: none; width: 100%;
  }
  .nb-search-input:focus { border-color: rgba(37,99,235,0.4); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
  .nb-clear-btn {
    border: 1px solid rgba(239,68,68,0.25); color: #b91c1c; background: rgba(254,242,242,0.9);
    border-radius: 12px; padding: 9px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .nb-clear-btn:hover { background: rgba(254,226,226,0.9); }
  #nbMapList { overflow: auto; padding: 10px 10px 14px 10px; }
  #nbMapList details {
    border: 1px solid rgba(17,24,39,0.08); border-radius: 14px;
    background: rgba(255,255,255,0.92); margin: 8px 4px; overflow: hidden;
  }
  #nbMapList summary {
    cursor: pointer; padding: 10px 10px; font-weight: 700; font-size: 12px; color: #111827;
    display: flex; align-items: center; justify-content: space-between; list-style: none;
  }
  #nbMapList summary::-webkit-details-marker { display: none; }
  .nb-borough-meta { font-weight: 600; font-size: 11px; color: rgba(17,24,39,0.55); }
  .nb-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px;
    border-top: 1px solid rgba(17,24,39,0.06); font-size: 12px; color: #111827; cursor: pointer;
  }
  .nb-item:hover { background: rgba(37,99,235,0.06); }
  .nb-item input[type="checkbox"] { width: 14px; height: 14px; accent-color: #B8860B; cursor: pointer; flex-shrink: 0; }
  .nb-item-name { flex: 1; line-height: 1.2; font-weight: 500; }
  .nb-item-borough { font-size: 10px; color: rgba(17,24,39,0.55); margin-top: 1px; }
  .nb-item-chevron { font-size: 11px; color: rgba(17,24,39,0.55); flex-shrink: 0; }
  /* Style switcher on map */
  .nb-style-select {
    border-radius: 14px; border: 1px solid rgba(255,255,255,0.26);
    background: rgba(17,24,39,0.40); backdrop-filter: blur(10px); color: white;
    padding: 10px 12px; font-size: 12px; outline: none; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    cursor: pointer;
  }
  .nb-style-select option { color: #111827; }
  /* Confirm bar */
  .nb-confirm-bar {
    padding: 10px 14px; border-top: 1px solid rgba(17,24,39,0.10);
    background: linear-gradient(to top, rgba(255,255,255,0.98), rgba(255,255,255,0.93));
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .nb-confirm-btn {
    padding: 10px 18px; border-radius: 12px; font-size: 12px; font-weight: 700;
    background: #B8860B; color: white; border: none; cursor: pointer;
    box-shadow: 0 4px 12px rgba(184,134,11,0.25);
  }
  .nb-confirm-btn:hover { background: #9a7209; }
  .nb-cancel-btn {
    padding: 10px 14px; border-radius: 12px; font-size: 12px; font-weight: 500;
    background: transparent; color: rgba(17,24,39,0.55); border: 1px solid rgba(17,24,39,0.10); cursor: pointer;
  }
  .nb-cancel-btn:hover { background: rgba(17,24,39,0.04); }
</style>
<div id="neighborhoodMapModal" class="fixed inset-0 bg-black/50 hidden" style="display:none; z-index:100000;">
    <div class="absolute inset-0 flex" style="padding: 0;">
        <!-- Sidebar -->
        <aside id="nbMapSidebarWrap" class="nb-modal-panel flex flex-col flex-shrink-0" style="width: 320px; border-right: 1px solid rgba(17,24,39,0.10); z-index: 5;">
            <!-- Header -->
            <div class="nb-sidebar-header">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;">
                    <span class="nb-title">NYC Neighborhoods</span>
                    <span id="nbMapSelectedCount" class="nb-pill">0 selected</span>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <input type="text" id="nbMapSearch" placeholder="Filter neighborhoods (e.g., SoHo, Williamsburg)"
                           class="nb-search-input" oninput="filterNeighborhoodMapSidebar(this.value)">
                    <button id="nbMapClearBtn" onclick="clearNeighborhoodMapSelection()" class="nb-clear-btn" style="display:none;">Clear</button>
                </div>
            </div>
            <!-- List -->
            <div id="nbMapList" class="flex-1 min-h-0">
                <div style="padding:20px; text-align:center;">
                    <div style="color:rgba(17,24,39,0.3); font-size:14px; margin-bottom:6px;">&#9696;</div>
                    <div style="font-size:11px; color:rgba(17,24,39,0.4);">Loading neighborhoods...</div>
                </div>
            </div>
            <!-- Confirm bar -->
            <div class="nb-confirm-bar">
                <button onclick="closeNeighborhoodMap()" class="nb-cancel-btn">Cancel</button>
                <button onclick="confirmNeighborhoodMapSelection()" class="nb-confirm-btn">Select Neighborhoods</button>
            </div>
        </aside>

        <!-- Map -->
        <div style="position:relative; flex:1; min-width:0;">
            <div id="nbMapContainer" style="position:absolute; inset:0;"></div>
            <!-- Error state -->
            <div id="nbMapError" style="position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:#f3f4f6;">
                <div style="text-align:center; padding:24px;">
                    <div style="font-size:32px; color:#f87171; margin-bottom:12px;">&#9888;</div>
                    <p style="font-size:13px; font-weight:600; color:#374151;">Could not load neighborhood map</p>
                    <p style="font-size:11px; color:#6b7280; margin-top:4px;">Check that geo files are built: <code style="background:#e5e7eb; padding:2px 4px; border-radius:4px;">npm run geo:all</code></p>
                </div>
            </div>
            <!-- Style switcher -->
            <div style="position:absolute; top:12px; right:12px; z-index:10;">
                <select id="nbMapStyleSelect" onchange="switchNeighborhoodMapStyle(this.value)" class="nb-style-select">
                    <option value="positron">Positron</option>
                    <option value="bright" selected>Bright</option>
                    <option value="liberty">Liberty</option>
                </select>
            </div>
            <!-- Close button on map -->
            <div style="position:absolute; top:12px; left:12px; z-index:10;">
                <button onclick="closeNeighborhoodMap()" style="width:40px; height:40px; border-radius:14px; border:1px solid rgba(255,255,255,0.26); background:rgba(17,24,39,0.40); backdrop-filter:blur(10px); color:white; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,0.18); font-size:16px;" aria-label="Close">&times;</button>
            </div>
        </div>
    </div>
</div>
