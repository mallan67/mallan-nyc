<!-- GRID LAYOUTS MODAL (extracted from section-main) -->
<div id="gridLayoutsModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center" onclick="if(event.target===this)closeGridLayoutsModal()" role="dialog" aria-modal="true" aria-labelledby="gridLayoutsModalTitle">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] overflow-hidden flex flex-col sm:flex-row">
        <!-- Left Panel - Field Selection -->
        <div class="flex-1 border-r sm:border-r border-b sm:border-b-0 flex flex-col">
            <div class="p-4 border-b bg-gray-50 flex items-center justify-between flex-shrink-0">
                <div>
                    <h3 id="gridLayoutsModalTitle" class="text-lg font-bold text-gray-900">Grid Layouts</h3>
                    <p class="text-xs text-gray-500 mt-0.5">Choose which columns appear in search results. <span id="selectedFieldCount" class="font-semibold text-blue-600">0</span> selected</p>
                </div>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="selectAllFields" class="w-4 h-4 rounded" onchange="toggleAllFields()">
                    <span class="text-xs font-semibold text-gray-600">Select All</span>
                </label>
            </div>
            <div class="flex-1 overflow-y-auto p-4" id="fieldSelectionGrid">
                <!-- Fields populated by JS in categorized groups -->
            </div>
            <div class="p-4 border-t bg-gray-50 flex items-center gap-3 flex-shrink-0">
                <button onclick="resetGridLayoutDefaults()" class="px-4 py-2 border border-gray-300 text-gray-600 rounded-lg text-sm font-semibold hover:bg-gray-100">Reset Defaults</button>
                <button onclick="applyGridLayout()" class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">Apply</button>
            </div>
        </div>
        <!-- Right Panel - Favorite Layouts -->
        <div class="w-full sm:w-72 bg-gray-50 flex flex-col">
            <div class="p-4 border-b flex items-center justify-between flex-shrink-0">
                <h4 class="font-semibold text-gray-900">Saved Layouts</h4>
                <button onclick="closeGridLayoutsModal()" class="text-gray-400 hover:text-gray-600" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="p-4 flex-1 overflow-y-auto">
                <p class="text-xs text-gray-500 mb-4">Save your most useful grid layouts to quickly switch between them.</p>
                <button onclick="createNewLayout()" class="flex items-center gap-2 text-blue-600 text-sm font-medium hover:underline mb-4">
                    <i class="fas fa-plus"></i> Create New Layout
                </button>
                <div id="savedLayoutsList" class="space-y-2">
                    <!-- Saved layouts populated by JS -->
                </div>
            </div>
        </div>
    </div>
</div>
