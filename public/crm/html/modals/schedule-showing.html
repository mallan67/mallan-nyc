<!-- SCHEDULE SHOWING MODAL (extracted from section-client) -->
    <div id="scheduleShowingModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
            <div class="p-4 border-b flex items-center justify-between">
                <h3 class="font-bold text-gray-900">Schedule Showing</h3>
                <button onclick="closeScheduleShowing()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Listing Address *</label>
                    <input type="text" id="showingAddress" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Enter listing address">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Date *</label>
                        <input type="date" id="showingDate" class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Time *</label>
                        <input type="time" id="showingTime" class="w-full border rounded-lg px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Type</label>
                    <div class="flex gap-3">
                        <label class="flex items-center gap-2 text-sm"><input type="radio" name="showingType" value="In-Person" checked class="accent-blue-600"> In-Person</label>
                        <label class="flex items-center gap-2 text-sm"><input type="radio" name="showingType" value="Virtual" class="accent-blue-600"> Virtual</label>
                        <label class="flex items-center gap-2 text-sm"><input type="radio" name="showingType" value="Open House" class="accent-blue-600"> Open House</label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Notes</label>
                    <textarea id="showingNotes" rows="2" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Add showing notes..."></textarea>
                </div>
            </div>
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-3">
                <button onclick="closeScheduleShowing()" class="px-4 py-2 border rounded-lg text-sm hover:bg-gray-100">Cancel</button>
                <button onclick="saveShowing(currentWorkspaceClientId)" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">Schedule</button>
            </div>
        </div>
    </div>
