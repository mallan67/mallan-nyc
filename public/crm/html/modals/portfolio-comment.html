<!-- PORTFOLIO COMMENT MODAL (extracted from section-client) -->
    <div id="portfolioCommentModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="portfolioCommentTitle">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm">
            <div class="p-4 border-b flex items-center justify-between">
                <h3 id="portfolioCommentTitle" class="font-bold text-gray-900">Add Comment</h3>
                <button onclick="closePortfolioComment()" class="text-gray-400 hover:text-gray-600" aria-label="Close dialog"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-4">
                <p id="commentListingAddress" class="text-sm text-gray-500 mb-2"></p>
                <textarea id="portfolioCommentText" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Add your comment..."></textarea>
            </div>
            <div class="p-4 border-t bg-gray-50 flex justify-end gap-3">
                <button onclick="closePortfolioComment()" class="px-4 py-2 border rounded-lg text-sm hover:bg-gray-100">Cancel</button>
                <button onclick="submitPortfolioComment()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">Save Comment</button>
            </div>
        </div>
    </div>
