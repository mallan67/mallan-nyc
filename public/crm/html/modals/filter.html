<!-- FILTER MODAL (extracted from section-main) -->
<div id="filterModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="filterModalTitle">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-hidden">
        <!-- Modal Header -->
        <div class="p-4 border-b bg-gray-800 flex items-center justify-between">
            <div>
                <h3 id="filterModalTitle" class="text-lg font-bold text-white">Filter Results</h3>
                <p class="text-xs text-gray-400">Apply status and action filters to narrow your results</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="resetAllFilters()" class="text-sm text-gray-300 hover:text-white flex items-center gap-1">
                    <i class="fas fa-undo"></i> Reset All
                </button>
                <button onclick="closeFilterModal()" class="text-gray-400 hover:text-white" aria-label="Close">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Modal Body -->
        <div class="p-6 overflow-y-auto max-h-[65vh]">
            <!-- Status/Action Toggles Section -->
            <div class="mb-6">
                <h4 class="text-xs font-semibold text-gray-700 mb-2 flex items-center gap-2">
                    <i class="fas fa-tags text-blue-600"></i> Customer Status Filters
                </h4>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <!-- Picked Toggle -->
                    <label class="filter-toggle-label flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50" data-filter="picked">
                        <input type="checkbox" id="filterPicked" class="sr-only filter-checkbox" data-filter="picked">
                        <div class="w-10 h-6 bg-gray-200 rounded-full relative filter-toggle-bg">
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform filter-toggle-dot"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-plus-square text-green-600"></i>
                            <span class="text-sm font-medium">Picked</span>
                        </div>
                    </label>
                    <!-- Liked Toggle -->
                    <label class="filter-toggle-label flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50" data-filter="liked">
                        <input type="checkbox" id="filterLiked" class="sr-only filter-checkbox" data-filter="liked">
                        <div class="w-10 h-6 bg-gray-200 rounded-full relative filter-toggle-bg">
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform filter-toggle-dot"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-thumbs-up text-blue-600"></i>
                            <span class="text-sm font-medium">Liked</span>
                        </div>
                    </label>
                    <!-- Shown Toggle -->
                    <label class="filter-toggle-label flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50" data-filter="shown">
                        <input type="checkbox" id="filterShown" class="sr-only filter-checkbox" data-filter="shown">
                        <div class="w-10 h-6 bg-gray-200 rounded-full relative filter-toggle-bg">
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform filter-toggle-dot"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-eye text-orange-500"></i>
                            <span class="text-sm font-medium">Shown</span>
                        </div>
                    </label>
                    <!-- Disliked Toggle -->
                    <label class="filter-toggle-label flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50" data-filter="disliked">
                        <input type="checkbox" id="filterDisliked" class="sr-only filter-checkbox" data-filter="disliked">
                        <div class="w-10 h-6 bg-gray-200 rounded-full relative filter-toggle-bg">
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform filter-toggle-dot"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-thumbs-down text-red-500"></i>
                            <span class="text-sm font-medium">Disliked</span>
                        </div>
                    </label>
                    <!-- New Matches Toggle -->
                    <label class="filter-toggle-label flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50" data-filter="newMatches">
                        <input type="checkbox" id="filterNewMatches" class="sr-only filter-checkbox" data-filter="newMatches">
                        <div class="w-10 h-6 bg-gray-200 rounded-full relative filter-toggle-bg">
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform filter-toggle-dot"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-star text-yellow-500"></i>
                            <span class="text-sm font-medium">New Matches</span>
                        </div>
                    </label>
                    <!-- Emailed Toggle -->
                    <label class="filter-toggle-label flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50" data-filter="emailed">
                        <input type="checkbox" id="filterEmailed" class="sr-only filter-checkbox" data-filter="emailed">
                        <div class="w-10 h-6 bg-gray-200 rounded-full relative filter-toggle-bg">
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform filter-toggle-dot"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-envelope text-purple-600"></i>
                            <span class="text-sm font-medium">Emailed</span>
                        </div>
                    </label>
                    <!-- Open Houses Toggle -->
                    <label class="filter-toggle-label flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50" data-filter="openHouses">
                        <input type="checkbox" id="filterOpenHouses" class="sr-only filter-checkbox" data-filter="openHouses">
                        <div class="w-10 h-6 bg-gray-200 rounded-full relative filter-toggle-bg">
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform filter-toggle-dot"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-door-open text-gray-600"></i>
                            <span class="text-sm font-medium">Open Houses</span>
                        </div>
                    </label>
                    <!-- Not Selected Toggle -->
                    <label class="filter-toggle-label flex items-center gap-3 p-3 border rounded-lg cursor-pointer hover:bg-gray-50" data-filter="notSelected">
                        <input type="checkbox" id="filterNotSelected" class="sr-only filter-checkbox" data-filter="notSelected">
                        <div class="w-10 h-6 bg-gray-200 rounded-full relative filter-toggle-bg">
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform filter-toggle-dot"></div>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="fas fa-minus-circle text-gray-500"></i>
                            <span class="text-sm font-medium">Not Selected</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Range Sliders Section -->
            <div class="mb-6">
                <h4 class="text-xs font-semibold text-gray-700 mb-2 flex items-center gap-2">
                    <i class="fas fa-sliders-h text-blue-600"></i> Range Filters
                </h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Price Range -->
                    <div class="p-4 border rounded-lg bg-gray-50">
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-sm font-medium text-gray-700">Price Range</label>
                            <span class="text-xs text-gray-500" id="filterPriceDisplay">$0 - $50M+</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="range" id="filterPriceMin" min="0" max="50000000" step="100000" value="0" class="flex-1" oninput="updateFilterPriceDisplay()">
                            <input type="range" id="filterPriceMax" min="0" max="50000000" step="100000" value="50000000" class="flex-1" oninput="updateFilterPriceDisplay()">
                        </div>
                        <div class="flex justify-between text-xs text-gray-400 mt-1">
                            <span>$0</span>
                            <span>$50M+</span>
                        </div>
                    </div>

                    <!-- Rooms Range -->
                    <div class="p-4 border rounded-lg bg-gray-50">
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-sm font-medium text-gray-700">Total Rooms</label>
                            <span class="text-xs text-gray-500" id="filterRoomsDisplay">Any - Any</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="range" id="filterRoomsMin" min="0" max="20" step="1" value="0" class="flex-1" oninput="updateFilterRoomsDisplay()">
                            <input type="range" id="filterRoomsMax" min="0" max="20" step="1" value="20" class="flex-1" oninput="updateFilterRoomsDisplay()">
                        </div>
                        <div class="flex justify-between text-xs text-gray-400 mt-1">
                            <span>Any</span>
                            <span>20+</span>
                        </div>
                    </div>

                    <!-- Bedrooms Range -->
                    <div class="p-4 border rounded-lg bg-gray-50">
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-sm font-medium text-gray-700">Bedrooms</label>
                            <span class="text-xs text-gray-500" id="filterBedsDisplay">Any - Any</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="range" id="filterBedsMin" min="0" max="10" step="1" value="0" class="flex-1" oninput="updateFilterBedsDisplay()">
                            <input type="range" id="filterBedsMax" min="0" max="10" step="1" value="10" class="flex-1" oninput="updateFilterBedsDisplay()">
                        </div>
                        <div class="flex justify-between text-xs text-gray-400 mt-1">
                            <span>Any</span>
                            <span>10+</span>
                        </div>
                    </div>

                    <!-- Bathrooms Range -->
                    <div class="p-4 border rounded-lg bg-gray-50">
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-sm font-medium text-gray-700">Bathrooms</label>
                            <span class="text-xs text-gray-500" id="filterBathsDisplay">Any - Any</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <input type="range" id="filterBathsMin" min="0" max="10" step="0.5" value="0" class="flex-1" oninput="updateFilterBathsDisplay()">
                            <input type="range" id="filterBathsMax" min="0" max="10" step="0.5" value="10" class="flex-1" oninput="updateFilterBathsDisplay()">
                        </div>
                        <div class="flex justify-between text-xs text-gray-400 mt-1">
                            <span>Any</span>
                            <span>10+</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Active Filter Summary -->
            <div id="activeFilterSummary" class="hidden p-4 border rounded-lg bg-blue-50 border-blue-200">
                <h4 class="text-sm font-bold text-blue-700 mb-2 flex items-center gap-2">
                    <i class="fas fa-filter"></i> Active Filters
                </h4>
                <div id="activeFilterTags" class="flex flex-wrap gap-2">
                    <!-- Active filter tags will be populated by JS -->
                </div>
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="p-4 border-t bg-gray-50 flex justify-between items-center">
            <span class="text-sm text-gray-600" id="filterResultCount">400 Results Match</span>
            <div class="flex gap-3">
                <button onclick="closeFilterModal()" class="px-4 py-2 border rounded-lg text-sm hover:bg-gray-100">Cancel</button>
                <button onclick="applyFilters()" class="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-semibold hover:bg-blue-700">Apply Filters</button>
            </div>
        </div>
    </div>
</div>
