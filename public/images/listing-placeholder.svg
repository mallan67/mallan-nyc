    <!-- Main building -->
    <rect x="30" y="40" width="140" height="200" rx="4"/>
    <!-- Windows row 1 -->
    <rect x="55" y="65" width="25" height="25" rx="2"/>
    <rect x="120" y="65" width="25" height="25" rx="2"/>
    <!-- Windows row 2 -->
