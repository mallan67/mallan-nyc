name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Model + effort for the GitHub reviewer.
          #
          # Both flags are passed through to the Claude Code CLI; `claude_args`
          # is not validated by the action itself, so they are verified against
          # the CLI reference rather than the action's docs:
          #   --model  accepts a full model name (code.claude.com/docs/en/cli-reference)
          #   --effort accepts low | medium | high | xhigh | max | ultracode
          #
          # `ultracode` starts the session at xhigh effort with ultracode
          # enabled, and REQUIRES Claude Code v2.1.203 or later. The CLI version
          # is supplied by claude-code-action@v1, which is a floating major tag;
          # if a pinned older runner ever ships a CLI below that floor, --effort
          # is the flag that will fail, not --model.
          #
          # Permissions above stay read-only (contents/pull-requests/issues:
          # read). Do not widen them here — GitHub write access for Claude is a
          # separate governance decision and requires Maya's explicit approval.
          claude_args: |
            --model claude-opus-5
            --effort ultracode
