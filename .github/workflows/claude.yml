name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # WRITE-CAPABLE IMPLEMENTATION AGENT. This is the @claude mention bot and it
    # is intended to push commits and open/update PRs, so it holds repository
    # write. It is deliberately a DIFFERENT job from claude-code-review.yml,
    # which stays read-only so the reviewer cannot edit what it reviews.
    #
    # SCOPE IS INTENTIONALLY NARROW. Not granted, and must not be added without
    # Maya's explicit approval: `workflows: write` (would let the agent rewrite
    # its own permissions), `administration`, `deployments`, `environments`,
    # `secrets`, `packages`, `security-events`.
    permissions:
      contents: write # commit and push code
      pull-requests: write # open, update, comment on PRs
      issues: write # comment on and update issues
      id-token: write # mint the GitHub OIDC token for federation (NOT repo write)
      actions: read # read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # ── Workload Identity Federation ──────────────────────────────────
          # No static credential. `claude_code_oauth_token` is deliberately
          # ABSENT: per the action's setup docs a static credential TAKES
          # PRECEDENCE over federation, so leaving it here would silently
          # disable WIF while appearing to work.
          #
          # These four values are IDENTIFIERS, not secrets, so they are read
          # from repository variables rather than secrets. They must exist
          # before this merges or the job cannot authenticate at all.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Verified against code.claude.com/docs/en/cli-reference, not the
          # action docs: claude_args is passed through to the CLI unvalidated.
          # --effort accepts low|medium|high|xhigh|max|ultracode. `max` carries
          # no minimum-CLI-version requirement (only `ultracode` does).
          claude_args: |
            --model claude-opus-5
            --effort max
