name: PR checks

on:
  pull_request:
    paths:
      - '**/*'

jobs:
  pr-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: mallan
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dev_user -d mallan -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql://dev_user:dev_password@127.0.0.1:5432/mallan?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if pg_isready -h postgres -U dev_user -d mallan; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Create round(double,int) shim in DB
        env:
          PGPASSWORD: dev_password
        run: |
          psql -h postgres -U dev_user -d mallan -v ON_ERROR_STOP=1 <<'SQL'
          CREATE OR REPLACE FUNCTION public.round(x double precision, s integer)
            RETURNS numeric
            LANGUAGE SQL IMMUTABLE
          AS $$
            SELECT ROUND(CAST(x AS numeric), s);
          $$;
          SQL

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma schema (db push)
        run: npx prisma db push --accept-data-loss

      - name: Apply SQL views / constraints (if present)
        run: |
          if [ -f tools/apply_sql.js ]; then
            node tools/apply_sql.js
          else
            echo "tools/apply_sql.js not found; skipped"
          fi

      - name: Seed the DB
        run: |
          if [ -f prisma/seed.js ]; then
            node prisma/seed.js
          else
            echo "prisma/seed.js not found; skipped"
          fi

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
