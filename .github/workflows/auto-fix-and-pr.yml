name: Auto Fix Schema / Seed / Test / PR

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, run tests but do not commit/push or create PR. Useful for testing.'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Safety check - DEV_DATABASE_URL present
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DEV_DATABASE_URL secret is not set. Add it in Settings → Secrets and rerun."
            exit 1
          fi
          echo "DEV_DATABASE_URL is set."

      - name: Safety check - do not run against obvious production
        run: |
          if echo "$DATABASE_URL" | grep -Ei 'prod|production|live|live-' >/dev/null; then
            echo "::error::DEV_DATABASE_URL looks like a production DB. Aborting."
            exit 1
          fi
          echo "DB target appears non-production."

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Write corrected files
        run: |
          echo "Writing corrected files..."

          mkdir -p prisma sql app/api/debug app/api/ai/nyc

          # prisma/schema.prisma
          cat > prisma/schema.prisma <<'PRISMA'
generator client {
  provider = "prisma-client-js"
}

datasource db {
  provider = "postgresql"
  url      = env("DATABASE_URL")
}

// --------------------------------------------------
// AGENT (natural key = email)
// --------------------------------------------------
model Agent {
  email            String   @id
  fullName         String   @unique @map("full_name")
  firstName        String   @map("first_name")
  lastName         String   @map("last_name")
  secondEmail      String?  @map("second_email")
  licenseNo        String   @unique @map("license_no")
  licenseExpiry    DateTime @map("license_expiry")
  saleSplit        Int      @map("sale_split")
  rentalSplit      Int      @map("rental_split")
  saleDeals        Int      @default(0) @map("sale_deals")
  rentalDeals      Int      @default(0) @map("rental_deals")
  role             Role     @default(AGENT)
  createdAt        DateTime @default(now()) @map("created_at")
  updatedAt        DateTime @updatedAt @map("updated_at")

  listings    Listing[]
  leads       Lead[]
  deals       Deal[]
  commissions Commission[]
  splits      Split[]
  profile     AgentProfile?

  @@map("agents")
}

// --------------------------------------------------
// AGENT PROFILE (same natural key)
// --------------------------------------------------
model AgentProfile {
  email            String   @id                      // same as Agent
  agent            Agent    @relation(fields: [email], references: [email], onDelete: Cascade)
  secondEmail      String?  @map("second_email")
  saleSplit        Int      @map("sale_split")
  rentalSplit      Int      @map("rental_split")
  saleDeals        Int      @default(0) @map("sale_deals")
  rentalDeals      Int      @default(0) @map("rental_deals")
  createdAt        DateTime @default(now()) @map("created_at")
  updatedAt        DateTime @updatedAt @map("updated_at")

  @@map("agent_profiles")
}

// --------------------------------------------------
// DEAL (natural key = address + agentEmail + contractSigned)
// --------------------------------------------------
model Deal {
  address          String
  agentEmail       String   @map("agent_email")
  agent            Agent    @relation(fields: [agentEmail], references: [email], onDelete: Cascade)
  type             String   // SALE or RENTAL
  status           DealStatus @default(LEAD)
  price            Int
  closingDate      DateTime? @map("closing_date")
  contractSigned   DateTime  @map("contract_signed")
  createdAt        DateTime  @default(now()) @map("created_at")
  updatedAt        DateTime  @updatedAt @map("updated_at")

  commissions      Commission[]
  dealDetails      DealDetail?

  @@id([address, agentEmail, contractSigned])
  @@map("deals")
}

// --------------------------------------------------
// DEAL DETAIL (same natural key)
// --------------------------------------------------
model DealDetail {
  address            String
  agentEmail         String   @map("agent_email")
  contractSigned     DateTime @map("contract_signed")
  deal               Deal     @relation(fields: [address, agentEmail, contractSigned], references: [address, agentEmail, contractSigned], onDelete: Cascade)
  agentFirstName     String   @map("agent_first_name")
  agentLastName      String   @map("agent_last_name")
  agentLicense       String   @map("agent_license")
  type               String   // SALE or RENTAL
  price              Int
  agentCommissionPct Int      @map("agent_commission_pct") // basis points (300 = 3 %)
  agentCommissionUsd Int      @map("agent_commission_usd")
  split              Int
  contractClosed     DateTime? @map("contract_closed")
  createdAt          DateTime  @default(now()) @map("created_at")
  updatedAt          DateTime  @updatedAt @map("updated_at")

  @@id([address, agentEmail, contractSigned])
  @@map("deal_details")
}

// --------------------------------------------------
// COMMISSION (natural key = same composite key)
// --------------------------------------------------
model Commission {
  address          String
  agentEmail       String   @map("agent_email")
  contractSigned   DateTime @map("contract_signed")
  deal             Deal     @relation(fields: [address, agentEmail, contractSigned], references: [address, agentEmail, contractSigned], onDelete: Cascade)
  gross            Int
  companyFee       Int      @map("company_fee")
  agentFee         Int      @map("agent_fee")
  paid             Boolean  @default(false)
  createdAt        DateTime @default(now()) @map("created_at")
  updatedAt        DateTime @updatedAt @map("updated_at")

  @@id([address, agentEmail, contractSigned])
  @@map("commissions")
}

// --------------------------------------------------
// SPLIT (natural key = agentEmail + year)
// --------------------------------------------------
model Split {
  agentEmail       String   @map("agent_email")
  year             Int      // 2025, 2026, …
  agent            Agent    @relation(fields: [agentEmail], references: [email], onDelete: Cascade)
  saleSplit        Int      @map("sale_split")
  rentalSplit      Int      @map("rental_split")
  saleSplitPct     Float?   @map("sale_split_pct")
  rentalSplitPct   Float?   @map("rental_split_pct")
  createdAt        DateTime @default(now()) @map("created_at")
  updatedAt        DateTime @updatedAt @map("updated_at")

  @@id([agentEmail, year])
  @@map("splits")
}

// --------------------------------------------------
// SUPPORTING TABLES (no id)
// --------------------------------------------------
model SplitPlan {
  name         String @id   // natural key: "80-20", "70-30"
  companySplit Int    @map("company_split")
  agentSplit   Int    @map("agent_split")
  agents       Agent[]

  @@map("split_plans")
}

model Lead {
  email        String   @id   // natural key
  name         String
  phone        String?
  consentSms   Boolean  @default(false) @map("consent_sms")
  consentEmail Boolean  @default(false) @map("consent_email")
  note         String?
  assignedToId String?  @map("assigned_to_id")
  assignedTo   Agent?   @relation(fields: [assignedToId], references: [email])
  createdAt    DateTime @default(now()) @map("created_at")

  @@map("leads")
}

model Listing {
  address   String        @id   // natural key
  price     Int
  beds      Float?
  baths     Float?
  sqft      Int?
  status    ListingStatus @default(DRAFT)
  agentId   String        @map("agent_id") // agent email
  agent     Agent         @relation(fields: [agentId], references: [email])
  createdAt DateTime      @default(now()) @map("created_at")
  updatedAt DateTime      @updatedAt @map("updated_at")

  @@map("listings")
}

model Document {
  filename    String    @id   // natural key (unique per folder)
  category    DocCategory
  url         String
  uploadedBy  String    @map("uploaded_by")
  createdAt   DateTime  @default(now()) @map("created_at")

  @@map("documents")
}

// --------------------------------------------------
// ENUMS (unchanged)
// --------------------------------------------------
enum Role            { ADMIN AGENT }
enum ListingStatus   { DRAFT ACTIVE PENDING CLOSED }
enum DealSide        { BUY SELL RENT }
enum DealStatus      { LEAD SHOWING OFFER CONTRACT_NEGOTIATION CLOSED }
enum DocCategory     { OFFERING_PLAN AGENCY_DISCLOSURE LEAD_PAINT WINDOW_GUARD 1099 MISC }
PRISMA

          # prisma/seed.js
          cat > prisma/seed.js <<'SEED'
/* prisma/seed.js — robust seeding that handles existing rows (by email or fullName) */
const { PrismaClient } = require("@prisma/client");
const prisma = new PrismaClient();

async function ensureAgent(agentData) {
  // 1) Try find by email
  let a = await prisma.agent.findUnique({ where: { email: agentData.email } });
  if (a) {
    // update everything for the email-holder
    await prisma.agent.update({
      where: { email: agentData.email },
      data: {
        fullName: agentData.fullName,
        firstName: agentData.firstName,
        lastName: agentData.lastName,
        secondEmail: agentData.secondEmail,
        licenseNo: agentData.licenseNo,
        licenseExpiry: agentData.licenseExpiry,
        saleSplit: agentData.saleSplit,
        rentalSplit: agentData.rentalSplit,
      },
    });
    return await prisma.agent.findUnique({ where: { email: agentData.email } });
  }

  // 2) If not found by email, try find by fullName (unique in schema)
  a = await prisma.agent.findUnique({ where: { fullName: agentData.fullName } });
  if (a) {
    // update fields except email to avoid clobbering someone else's email
    await prisma.agent.update({
      where: { fullName: agentData.fullName },
      data: {
        firstName: agentData.firstName,
        lastName: agentData.lastName,
        secondEmail: agentData.secondEmail,
        licenseNo: agentData.licenseNo,
        licenseExpiry: agentData.licenseExpiry,
        saleSplit: agentData.saleSplit,
        rentalSplit: agentData.rentalSplit,
      },
    });
    return await prisma.agent.findUnique({ where: { fullName: agentData.fullName } });
  }

  // 3) Else create new agent
  return await prisma.agent.create({ data: agentData });
}

async function main() {
  // Agent we want to ensure exists; adjust as needed
  const agentPayload = {
    email: "maya@mallannyhomes.com",
    fullName: "Maya Allan",
    firstName: "Maya",
    lastName: "Allan",
    secondEmail: null,
    licenseNo: "NY123456",
    licenseExpiry: new Date("2026-12-31"),
    saleSplit: 60,
    rentalSplit: 60,
  };

  const maya = await ensureAgent(agentPayload);
  console.log("Agent ensured:", maya.email, maya.fullName);

  // Create deals for that agent (use agentEmail for joins)
  await prisma.deal.createMany({
    data: [
      {
        address: "300 E 90th St, New York, NY",
        agentEmail: maya.email,
        type: "SALE",
        status: "CLOSED",
        price: 1200000,
        contractSigned: new Date("2025-06-01"),
        closingDate: new Date("2025-09-01"),
      },
      {
        address: "1600 Fulton St, Brooklyn, NY",
        agentEmail: maya.email,
        type: "RENTAL",
        status: "CLOSED",
        price: 3500,
        contractSigned: new Date("2025-05-10"),
        closingDate: new Date("2025-05-25"),
      },
    ],
    skipDuplicates: true,
  });

  // Deal details
  await prisma.dealDetail.createMany({
    data: [
      {
        address: "300 E 90th St, New York, NY",
        agentEmail: maya.email,
        contractSigned: new Date("2025-06-01"),
        agentFirstName: "Maya",
        agentLastName: "Allan",
        agentLicense: "NY123456",
        type: "SALE",
        price: 1200000,
        agentCommissionPct: 3,
        agentCommissionUsd: 36000,
        split: 60,
        contractClosed: new Date("2025-09-01"),
      },
      {
        address: "1600 Fulton St, Brooklyn, NY",
        agentEmail: maya.email,
        contractSigned: new Date("2025-05-10"),
        agentFirstName: "Maya",
        agentLastName: "Allan",
        agentLicense: "NY123456",
        type: "RENTAL",
        price: 3500,
        agentCommissionPct: 15,
        agentCommissionUsd: 6300,
        split: 60,
        contractClosed: new Date("2025-05-25"),
      },
    ],
    skipDuplicates: true,
  });

  // Commissions
  await prisma.commission.createMany({
    data: [
      {
        address: "300 E 90th St, New York, NY",
        agentEmail: maya.email,
        contractSigned: new Date("2025-06-01"),
        gross: 36000,
        companyFee: Math.round(36000 * 0.2),
        agentFee: Math.round(36000 * 0.8),
        paid: false,
      },
      {
        address: "1600 Fulton St, Brooklyn, NY",
        agentEmail: maya.email,
        contractSigned: new Date("2025-05-10"),
        gross: 6300,
        companyFee: Math.round(6300 * 0.4),
        agentFee: Math.round(6300 * 0.6),
        paid: false,
      },
    ],
    skipDuplicates: true,
  });

  console.log("Seed complete");
}

main()
  .catch((e) => {
    console.error(e);
    process.exit(1);
  })
  .finally(async () => {
    await prisma.$disconnect();
  });
