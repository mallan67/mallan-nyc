name: Rotate Neon DB Credentials

on:
  schedule:
    - cron: "0 5 1,15 * *"  # Every 1st and 15th at 5AM UTC
  workflow_dispatch:  # allows manual run

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Rotate Neon password
        id: rotate
        run: |
          echo "Rotating Neon DB password..."
          USER="assistant_user"
          PROJECT_ID="royal-dawn-ad6eh8t2"

          # Generate new password
          NEW_PASS=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"role_name": "'"$USER"'"}' \
            https://console.neon.tech/api/v2/projects/$PROJECT_ID/roles/$USER/reset_password \
            | jq -r '.password')

          if [ -z "$NEW_PASS" ]; then
            echo "Rotation failed!"
            exit 1
          fi

          NEW_CONN="postgresql://$USER:$NEW_PASS@ep-royal-dawn-ad6eh8t2-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require"

          echo "Updating GitHub secret..."
          gh secret set ASSISTANT_DATABASE_URL --body "$NEW_CONN"
          gh secret set DATABASE_URL --body "$NEW_CONN"

          echo "Updating Vercel..."
          curl -X PATCH "https://api.vercel.com/v10/projects/mallan-nyc/env/ASSISTANT_DATABASE_URL" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"value": "'"$NEW_CONN"'", "target":["production","preview"]}'

          echo "Rotation complete."

      - name: Trigger redeploy
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
