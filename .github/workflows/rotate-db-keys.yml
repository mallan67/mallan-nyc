name: Rotate Neon DB Credentials

on:
  schedule:
    - cron: "0 5 1,15 * *"  # Every 1st and 15th at 5AM UTC
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
      secrets: write

    env:
      GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Rotate Neon password
        id: rotate
        run: |
          echo "🔄 Rotating Neon DB password..."
          USER="assistant_user"
          PROJECT_ID="royal-dawn-ad6eh8t2"

          echo "Generating new Neon password..."
          NEW_PASS=$(curl -s -X POST \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"role_name\": \"$USER\"}" \
            https://console.neon.tech/api/v2/projects/$PROJECT_ID/roles/$USER/reset_password \
            | jq -r '.password')

          if [ -z "$NEW_PASS" ] || [ "$NEW_PASS" = "null" ]; then
            echo "❌ Neon password rotation failed."
            exit 1
          fi

          NEW_CONN="postgresql://$USER:$NEW_PASS@ep-royal-dawn-ad6eh8t2-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require"

          echo "✅ New password generated."

          echo "🔐 Updating GitHub secrets..."
          gh secret set ASSISTANT_DATABASE_URL --body "$NEW_CONN" --repo $GITHUB_REPOSITORY
          gh secret set DATABASE_URL --body "$NEW_CONN" --repo $GITHUB_REPOSITORY

          if [ $? -ne 0 ]; then
            echo "❌ Failed to update GitHub secrets."
            exit 1
          fi

          echo "🚀 Updating Vercel environment variables..."
          curl -s -X PATCH "https://api.vercel.com/v10/projects/mallan-nyc/env/ASSISTANT_DATABASE_URL" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"value\": \"$NEW_CONN\", \"target\": [\"production\", \"preview\"]}" \
            | jq

          if [ $? -ne 0 ]; then
            echo "⚠️ Failed to update Vercel."
            exit 1
          fi

          echo "✅ Rotation complete."

      - name: Trigger redeploy
        if: ${{ success() }}
        run: |
          echo "🔁 Triggering redeploy on Vercel..."
          npx vercel --prod --token=$VERCEL_TOKEN
