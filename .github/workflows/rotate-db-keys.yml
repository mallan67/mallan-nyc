name: Weekly Neon Rotation Summary

on:
  schedule:
    - cron: "0 14 * * 0"   # Every Sunday @ 14:00 UTC
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      REPO: "mallan67/mallan-nyc"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build summary
        id: build
        run: |
          echo "📋 Building weekly rotation summary..."

          LAST_LINE="$(tail -n 1 rotation-history.log 2>/dev/null || true)"
          if [ -z "$LAST_LINE" ]; then
            LAST_STATUS="No prior rotations found in rotation-history.log"
          else
            LAST_STATUS="$LAST_LINE"
          fi

          # Compute next scheduled run for cron: 0 5 1,15 * *
          NEXT_RUN=$(python - <<'PY'
from datetime import datetime, timezone
from calendar import monthrange

now = datetime.now(timezone.utc)

def candidates(start):
    y, m = start.year, start.month
    out = []
    for k in range(3):  # this month + next two (safe buffer)
        yy = y + (m + k - 1)//12
        mm = (m + k - 1)%12 + 1
        for d in (1, 15):
            if d <= monthrange(yy, mm)[1]:
                out.append(datetime(yy, mm, d, 5, 0, 0, tzinfo=timezone.utc))
    return sorted(out)

for dt in candidates(now):
    if dt > now:
        print(dt.isoformat())
        break
PY
)
          echo "next_run=$NEXT_RUN" >> $GITHUB_OUTPUT
          echo "last_status=$LAST_STATUS" >> $GITHUB_OUTPUT

      - name: Send Slack summary (optional)
        if: always()
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            STATUS="${{ steps.build.outputs.last_status }}"
            NEXT="${{ steps.build.outputs.next_run }}"
            MSG="📬 *Weekly Neon Rotation Summary* for *${REPO}*\n• Last: ${STATUS}\n• Next scheduled: ${NEXT}"
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\": \"$MSG\"}" "$SLACK_WEBHOOK_URL"
          else
            echo "No SLACK_WEBHOOK_URL secret set; skipping Slack."
          fi

      - name: Email summary
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "Weekly Neon Rotation Summary — ${{ job.status }}"
          to: "maya@mallannyhomes.com"
          from: "Neon Rotation Bot <${{ secrets.SMTP_USER }}>"
          body: |
            Hi Maya,

            Here’s your weekly Neon rotation summary for ${REPO}:

            • Last status: ${{ steps.build.outputs.last_status }}
            • Next scheduled rotation (UTC): ${{ steps.build.outputs.next_run }}

            View runs & logs:
            https://github.com/mallan67/mallan-nyc/actions

            — Rotation Bot
