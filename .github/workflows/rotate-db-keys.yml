name: Rotate Neon DB Credentials

on:
  # ⛔ DISABLED 2026-06-02 — the scheduled rotation targets morning-bread/royal-dawn and
  #    can overwrite production DATABASE_URL away from cold-waterfall. Production was
  #    repointed to hidden-mountain/cold-waterfall on 2026-06-02 (cross-project DB rescue);
  #    a scheduled run would re-break it. Re-enable ONLY after retarget to
  #    hidden-mountain/cold-waterfall + a fail-closed host guard — see
  #    docs/rotate-db-keys-host-guard-patch-2026-06-02.md.
  # schedule:
  #   - cron: "0 5 1,15 * *" # Every 1st and 15th at 5AM UTC
  workflow_dispatch: # manual-only until retarget + host guard land

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    env:
      GH_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      PROJECT_ID: ${{ secrets.NEON_PROJECT_ID || vars.NEON_PROJECT_ID }}
      BRANCH_ID: ${{ secrets.NEON_BRANCH_ID || vars.NEON_BRANCH_ID }}
      ROLE: ${{ secrets.NEON_ROLE || vars.NEON_ROLE || 'neondb_owner' }}
      DATABASE_NAME: ${{ secrets.NEON_DATABASE_NAME || vars.NEON_DATABASE_NAME || 'neondb' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID || 'prj_gcdTm2kBRm7oPdGScHZpnHRPc2gW' }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID || vars.VERCEL_TEAM_ID || 'team_kZQh5NYLyrOKqffK0r9EXf4E' }}
      VERCEL_TEAM_SLUG: ${{ secrets.VERCEL_TEAM_SLUG || vars.VERCEL_TEAM_SLUG }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # 2026-05-15: GitHub Actions' "Add secret" UI preserves whatever bytes
      # are pasted into the textarea — including a trailing newline, which is
      # easy to introduce accidentally when copy-pasting a secret from a
      # terminal, password manager, or another browser tab. Downstream auth
      # libraries reject Authorization header values containing `\r` or `\n`
      # with these cryptic errors:
      #   gh   (Go net/http):  `net/http: invalid header field value for "Authorization"`
      #   curl (libcurl):      `curl: (43) Failed sending HTTP request` (CURLE_BAD_FUNCTION_ARGUMENT)
      #
      # Observed regressions:
      #   - 25903348530 (06:11 UTC) and 25905817923 (07:22 UTC) — gh api
      #     preflight failed against `repos/$REPO` because MY_GITHUB_PAT had a
      #     trailing newline. PR #133 normalized MY_GITHUB_PAT only.
      #   - 25908079420 (08:26 UTC) — Vercel curl preflight failed at exit 43
      #     because VERCEL_TOKEN had the same kind of contamination. Proof
      #     that normalizing one secret is not enough.
      #
      # This step strips CR/LF from every secret used in an Authorization
      # header or auth/login context and writes the cleaned values to
      # $GITHUB_ENV, overriding the job-level env entries for all subsequent
      # steps. Trimming is restricted to `\r\n` only — real secret bytes are
      # never affected because tokens are restricted to `[A-Za-z0-9_./=+~-]`
      # charsets. If a secret was contaminated by a different invisible byte
      # (BOM, zero-width space, etc.) the subsequent gh/curl call will
      # surface the same error so the operator knows to re-paste.
      #
      # Required vs. optional:
      #   - MY_GITHUB_PAT / VERCEL_TOKEN / NEON_API_KEY are REQUIRED — they are
      #     on the rotation critical path. Missing or whitespace-only =
      #     fail-closed exit 1.
      #   - SMTP_USER / SMTP_PASS are OPTIONAL — they only feed the email
      #     notification step. Missing/empty must NOT block Neon rotation. If
      #     blank, this step simply leaves the env value blank and the email
      #     step's `if:` guard self-skips downstream.
      - name: Normalize auth secrets (strip CR/LF that breaks Authorization header validation)
        env:
          GH_TOKEN_RAW: ${{ secrets.MY_GITHUB_PAT }}
          VERCEL_TOKEN_RAW: ${{ secrets.VERCEL_TOKEN }}
          NEON_API_KEY_RAW: ${{ secrets.NEON_API_KEY }}
          SMTP_USER_RAW: ${{ secrets.SMTP_USER }}
          SMTP_PASS_RAW: ${{ secrets.SMTP_PASS }}
        run: |
          set -euo pipefail

          # clean_required <human-label> <raw-value> <output-env-name>
          # - Strips CR/LF only.
          # - Errors if missing or empty after strip — rotation cannot proceed.
          # - Registers ::add-mask:: for the cleaned value so it cannot leak.
          # - Writes the cleaned value to $GITHUB_ENV under <output-env-name>,
          #   overriding the job-level env entry for subsequent steps.
          clean_required() {
            local label="$1"
            local raw="$2"
            local out_name="$3"
            local cleaned

            if [ -z "${raw:-}" ]; then
              echo "::error::$label secret is missing."
              exit 1
            fi
            cleaned="$(printf '%s' "$raw" | tr -d '\r\n')"
            if [ -z "$cleaned" ]; then
              echo "::error::$label contained only whitespace after CR/LF strip."
              exit 1
            fi
            echo "::add-mask::$cleaned"
            echo "$out_name=$cleaned" >> "$GITHUB_ENV"
          }

          # clean_optional <human-label> <raw-value> <output-env-name>
          # - Same byte-cleaning behavior as clean_required.
          # - If raw is empty OR empty after strip, EXPLICITLY clear the env
          #   var by writing `<output-env-name>=` to $GITHUB_ENV. This is
          #   important when the job-level env entry holds a non-empty but
          #   semantically-empty value (e.g. a whitespace-only paste that
          #   sanitizes to nothing). Without the explicit clear, the email
          #   step's `if: env.SMTP_USER != ''` guard would evaluate true on
          #   the whitespace string and the step would run with garbage
          #   credentials. The explicit clear normalizes env.<name> to the
          #   strict empty string `""` so the guard self-skips correctly.
          # - No ::add-mask:: for empty values (would be a no-op anyway).
          # - Does NOT echo the raw or cleaned value at any point.
          clean_optional() {
            local label="$1"
            local raw="$2"
            local out_name="$3"
            local cleaned

            if [ -z "${raw:-}" ]; then
              echo "$label is not configured — clearing env, downstream step will self-skip."
              echo "$out_name=" >> "$GITHUB_ENV"
              return 0
            fi
            cleaned="$(printf '%s' "$raw" | tr -d '\r\n')"
            if [ -z "$cleaned" ]; then
              echo "$label was whitespace-only after CR/LF strip — clearing env, treating as not configured."
              echo "$out_name=" >> "$GITHUB_ENV"
              return 0
            fi
            echo "::add-mask::$cleaned"
            echo "$out_name=$cleaned" >> "$GITHUB_ENV"
          }

          clean_required "MY_GITHUB_PAT" "$GH_TOKEN_RAW"     "GH_TOKEN"
          clean_required "VERCEL_TOKEN"  "$VERCEL_TOKEN_RAW" "VERCEL_TOKEN"
          clean_required "NEON_API_KEY"  "$NEON_API_KEY_RAW" "NEON_API_KEY"
          clean_optional "SMTP_USER"     "$SMTP_USER_RAW"    "SMTP_USER"
          clean_optional "SMTP_PASS"     "$SMTP_PASS_RAW"    "SMTP_PASS"

      - name: Preflight required credentials
        run: |
          set -euo pipefail

          missing=0
          for name in GH_TOKEN NEON_API_KEY VERCEL_TOKEN PROJECT_ID ROLE DATABASE_NAME VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          gh api "repos/$REPO" >/dev/null

          vercel_scope=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then
            vercel_scope="&teamId=$VERCEL_TEAM_ID"
          elif [ -n "${VERCEL_TEAM_SLUG:-}" ]; then
            vercel_scope="&slug=$VERCEL_TEAM_SLUG"
          fi

          vercel_status=$(
            curl -sS -o /tmp/vercel-preflight.json -w "%{http_code}" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=1$vercel_scope"
          )
          if [ "$vercel_status" -lt 200 ] || [ "$vercel_status" -ge 300 ]; then
            message=$(jq -r '.error.message // .message // "Vercel token cannot access project deployments."' /tmp/vercel-preflight.json 2>/dev/null)
            echo "::error::Vercel preflight failed with HTTP $vercel_status: $message"
            exit 1
          fi

          echo "Preflight OK."

      # Phase 0.5 guardrail — fail-closed BEFORE the first Neon mutation
      # (reset_password). Refuses to proceed unless PROJECT_ID is the canonical
      # production project (hidden-mountain-87248164). This is code, not a comment:
      # a dispatch against the stale morning-bread project aborts here, untouched.
      - name: Guard — refuse non-canonical Neon project (fail-closed)
        run: node scripts/ci/assert-canonical-neon-target.mjs --project "$PROJECT_ID"

      - name: Rotate Neon password and update consumers
        id: rotate
        run: |
          set -euo pipefail

          neon_api="https://console.neon.tech/api/v2"
          vercel_api="https://api.vercel.com"

          vercel_scope_query() {
            local separator="$1"
            local encoded

            if [ -n "${VERCEL_TEAM_ID:-}" ]; then
              encoded=$(jq -rn --arg v "$VERCEL_TEAM_ID" '$v|@uri')
              printf '%steamId=%s' "$separator" "$encoded"
            elif [ -n "${VERCEL_TEAM_SLUG:-}" ]; then
              encoded=$(jq -rn --arg v "$VERCEL_TEAM_SLUG" '$v|@uri')
              printf '%sslug=%s' "$separator" "$encoded"
            fi
          }

          request_json() {
            local method="$1"
            local url="$2"
            local body="${3:-}"
            local out="$4"

            if [ -n "$body" ]; then
              curl -sS -X "$method" -o "$out" -w "%{http_code}" \
                -H "Authorization: Bearer $NEON_API_KEY" \
                -H "Accept: application/json" \
                -H "Content-Type: application/json" \
                --data "$body" \
                "$url"
            else
              curl -sS -X "$method" -o "$out" -w "%{http_code}" \
                -H "Authorization: Bearer $NEON_API_KEY" \
                -H "Accept: application/json" \
                "$url"
            fi
          }

          require_status() {
            local status="$1"
            local body_file="$2"
            local label="$3"

            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              message=$(jq -r '.message // .error.message // .error // "unrecognized API error"' "$body_file" 2>/dev/null)
              echo "::error::$label failed with HTTP $status: $message"
              echo "$(date -u) Rotation failed at $label." >> rotation-history.log
              exit 1
            fi
          }

          if [ -z "${BRANCH_ID:-}" ]; then
            status=$(request_json GET "$neon_api/projects/$PROJECT_ID/branches" "" /tmp/neon-branches.json)
            require_status "$status" /tmp/neon-branches.json "Resolve Neon branches"
            BRANCH_ID=$(jq -r '.branches[] | select(.primary == true) | .id' /tmp/neon-branches.json | head -n 1)
            if [ -z "$BRANCH_ID" ]; then
              echo "::error::Could not resolve a primary Neon branch. Set NEON_BRANCH_ID as a GitHub secret or variable."
              echo "$(date -u) Rotation failed while resolving primary branch." >> rotation-history.log
              exit 1
            fi
          fi

          status=$(request_json GET "$neon_api/projects/$PROJECT_ID/branches/$BRANCH_ID/roles/$ROLE" "" /tmp/neon-role.json)
          require_status "$status" /tmp/neon-role.json "Validate Neon role"

          status=$(request_json POST "$neon_api/projects/$PROJECT_ID/branches/$BRANCH_ID/roles/$ROLE/reset_password" "" /tmp/neon-reset.json)
          require_status "$status" /tmp/neon-reset.json "Reset Neon role password"

          new_pass=$(jq -r '.role.password // empty' /tmp/neon-reset.json)
          if [ -z "$new_pass" ]; then
            echo "::error::Neon reset response did not include a role password."
            echo "$(date -u) Rotation failed: reset response did not include password." >> rotation-history.log
            exit 1
          fi
          echo "::add-mask::$new_pass"

          op_ids=$(jq -r '.operations[]?.id // empty' /tmp/neon-reset.json)
          for op_id in $op_ids; do
            terminal=""
            for _ in $(seq 1 30); do
              status=$(request_json GET "$neon_api/projects/$PROJECT_ID/operations/$op_id" "" /tmp/neon-operation.json)
              require_status "$status" /tmp/neon-operation.json "Poll Neon operation"
              op_status=$(jq -r '.operation.status // empty' /tmp/neon-operation.json)

              if [ "$op_status" = "finished" ] || [ "$op_status" = "skipped" ]; then
                terminal="$op_status"
                break
              fi
              if [ "$op_status" = "failed" ] || [ "$op_status" = "cancelled" ]; then
                echo "::error::Neon operation ended with status $op_status."
                echo "$(date -u) Rotation failed: Neon operation $op_status." >> rotation-history.log
                exit 1
              fi
              sleep 2
            done

            if [ -z "$terminal" ]; then
              echo "::error::Timed out waiting for Neon operation to finish."
              echo "$(date -u) Rotation failed: Neon operation timeout." >> rotation-history.log
              exit 1
            fi
          done

          get_connection_uri() {
            local pooled="$1"
            local out="$2"
            local encoded_database encoded_role encoded_branch status

            encoded_database=$(jq -rn --arg v "$DATABASE_NAME" '$v|@uri')
            encoded_role=$(jq -rn --arg v "$ROLE" '$v|@uri')
            encoded_branch=$(jq -rn --arg v "$BRANCH_ID" '$v|@uri')

            status=$(request_json GET "$neon_api/projects/$PROJECT_ID/connection_uri?branch_id=$encoded_branch&database_name=$encoded_database&role_name=$encoded_role&pooled=$pooled" "" "$out")
            require_status "$status" "$out" "Retrieve Neon connection URI"
            jq -r '.uri // .connection_uri // empty' "$out"
          }

          pooled_uri=$(get_connection_uri true /tmp/neon-pooled-uri.json)
          direct_uri=$(get_connection_uri false /tmp/neon-direct-uri.json)

          if [ -z "$pooled_uri" ] || [ -z "$direct_uri" ]; then
            echo "::error::Neon connection URI response was empty."
            echo "$(date -u) Rotation failed: connection URI response was empty." >> rotation-history.log
            exit 1
          fi
          echo "::add-mask::$pooled_uri"
          echo "::add-mask::$direct_uri"

          # Phase 0.5 guardrail — fail-closed host guard BEFORE any gh-secret /
          # Vercel-env write. Refuses a URI whose host is not the canonical
          # production host (ep-cold-waterfall-adno3ao2) or is the stale royal-dawn.
          # The guard never echoes the URI (it carries credentials).
          node "$GITHUB_WORKSPACE/scripts/ci/assert-canonical-neon-target.mjs" --host "$pooled_uri"
          node "$GITHUB_WORKSPACE/scripts/ci/assert-canonical-neon-target.mjs" --host "$direct_uri"

          printf '%s' "$pooled_uri" | gh secret set DATABASE_URL --repo "$REPO" --app actions
          printf '%s' "$pooled_uri" | gh secret set ASSISTANT_DATABASE_URL --repo "$REPO" --app actions
          printf '%s' "$direct_uri" | gh secret set DATABASE_URL_UNPOOLED --repo "$REPO" --app actions

          upsert_vercel_env() {
            local key="$1"
            local value="$2"
            local payload status

            payload=$(jq -n \
              --arg key "$key" \
              --arg value "$value" \
              '{key:$key,value:$value,type:"encrypted",target:["production"],comment:"Rotated by GitHub Actions Neon credential workflow"}')

            status=$(
              curl -sS -X POST -o "/tmp/vercel-env-$key.json" -w "%{http_code}" \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$payload" \
                "$vercel_api/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true$(vercel_scope_query '&')"
            )
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              message=$(jq -r '.error.message // .message // "Vercel environment update failed."' "/tmp/vercel-env-$key.json" 2>/dev/null)
              echo "::error::Vercel env update for $key failed with HTTP $status: $message"
              echo "$(date -u) Rotation failed while updating Vercel $key." >> rotation-history.log
              exit 1
            fi
          }

          upsert_vercel_env DATABASE_URL "$pooled_uri"
          upsert_vercel_env ASSISTANT_DATABASE_URL "$pooled_uri"
          upsert_vercel_env DATABASE_URL_UNPOOLED "$direct_uri"

          status=$(
            curl -sS -o /tmp/vercel-deployments.json -w "%{http_code}" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$vercel_api/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=1$(vercel_scope_query '&')"
          )
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            message=$(jq -r '.error.message // .message // "Could not list Vercel deployments."' /tmp/vercel-deployments.json 2>/dev/null)
            echo "::error::Vercel deployment lookup failed with HTTP $status: $message"
            echo "$(date -u) Rotation failed while looking up latest Vercel deployment." >> rotation-history.log
            exit 1
          fi

          latest_deployment=$(jq -r '.deployments[0].uid // .deployments[0].id // empty' /tmp/vercel-deployments.json)
          if [ -z "$latest_deployment" ]; then
            echo "::error::No production Vercel deployment found to redeploy."
            echo "$(date -u) Rotation failed: no Vercel deployment found." >> rotation-history.log
            exit 1
          fi

          # `name` is required by Vercel `POST /v13/deployments`. Run
          # 25910701936 (2026-05-15) failed here with:
          #   HTTP 400: Invalid request: missing required property `name`.
          # The project name `mallan-nyc` matches the Vercel project slug for
          # `VERCEL_PROJECT_ID prj_gcdTm2kBRm7oPdGScHZpnHRPc2gW` (see the
          # Vercel deployment URL https://vercel.com/mallan/mallan-nyc/...).
          # Passed via `--arg` so the value never appears inline in a jq filter
          # string (consistent with how `deploymentId` is passed).
          redeploy_payload=$(jq -n \
            --arg deploymentId "$latest_deployment" \
            --arg name "mallan-nyc" \
            '{deploymentId:$deploymentId,name:$name,target:"production"}')
          status=$(
            curl -sS -X POST -o /tmp/vercel-redeploy.json -w "%{http_code}" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$redeploy_payload" \
              "$vercel_api/v13/deployments?forceNew=1$(vercel_scope_query '&')"
          )
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            message=$(jq -r '.error.message // .message // "Vercel redeploy failed."' /tmp/vercel-redeploy.json 2>/dev/null)
            echo "::error::Vercel redeploy failed with HTTP $status: $message"
            echo "$(date -u) Rotation failed during Vercel redeploy." >> rotation-history.log
            exit 1
          fi

          echo "$(date -u) Rotation successful." >> rotation-history.log
          echo "Rotation completed and production redeploy was triggered."

      - name: Send Slack notification
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            status="${{ job.status }}"
            msg="Neon credential rotation ($REPO) completed with status: $status"
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "$(jq -n --arg text "$msg" '{text:$text}')" \
              "$SLACK_WEBHOOK_URL" >/dev/null
          else
            echo "No Slack webhook configured."
          fi

      - name: Send email notification
        # `env.SMTP_USER` / `env.SMTP_PASS` here read the CLEANED values written
        # to $GITHUB_ENV by the "Normalize auth secrets" step above, NOT the
        # raw `secrets.*` values. Using `secrets.SMTP_*` directly would
        # reintroduce any CR/LF contamination at the SMTP AUTH login step.
        #
        # `continue-on-error: true` ensures that an SMTP failure (auth
        # rejection, network blip, Gmail rate-limit, account locked, etc.)
        # does NOT mark the job as failed. Email is notification-only;
        # Neon rotation is the critical path. Observability of email
        # failures stays via the step's own log + the Slack notification.
        if: ${{ always() && env.SMTP_USER != '' && env.SMTP_PASS != '' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ env.SMTP_USER }}
          password: ${{ env.SMTP_PASS }}
          subject: "Neon DB Rotation (${{ job.status }})"
          to: "maya@mallannyhomes.com"
          from: "Neon Rotation Bot <${{ env.SMTP_USER }}>"
          body: |
            Hi Maya,

            The Neon database credential rotation workflow for mallan-nyc completed with status: ${{ job.status }}.

            View logs:
            https://github.com/${{ github.repository }}/actions

      - name: Commit audit log
        if: always()
        run: |
          set -euo pipefail

          git config --global user.name "Rotation Bot"
          git config --global user.email "bot@users.noreply.github.com"

          if [ ! -f rotation-history.log ]; then
            echo "$(date -u) Rotation workflow ended before the rotation step wrote an audit entry." >> rotation-history.log
          fi

          git add -f rotation-history.log
          git commit -m "chore(neon): update rotation audit log ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "No changes to commit"
          git push || echo "No push needed"
