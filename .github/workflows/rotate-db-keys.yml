name: QUARANTINED - direct Neon credential rotation

# QUARANTINED_DIRECT_NEON_CONTROL
# The former workflow called the Neon API directly, reset a database role password,
# and rewrote GitHub/Vercel database variables. That path conflicts with Mallan's
# Vercel-managed Neon authority and can recreate retired database identities.
# No secrets are loaded and no provider mutation is reachable from this workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse direct Neon credential rotation
        run: |
          echo "::error::QUARANTINED_DIRECT_NEON_CONTROL: direct Neon rotation is disabled."
          echo "Credential/resource mutation requires a separately authorized Git-controlled Vercel-managed packet."
          exit 1
