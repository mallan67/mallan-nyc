name: Rotate Neon DB Credentials

on:
  schedule:
    - cron: "0 5 1,15 * *" # Every 1st and 15th at 5AM UTC
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write

    env:
      GH_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      PROJECT_ID: "morning-bread-68708332"
      BRANCH_ID: "br-old-tree-admdlb9z"
      ROLE: "authenticator"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Rotate Neon password
        id: rotate
        run: |
          echo "🔄 Rotating Neon DB password..."
          echo "Generating new Neon password..."

          NEW_PASS=$(curl -s -X POST \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID/roles/$ROLE/reset_password" \
            | jq -r '.role.password')

          if [ -z "$NEW_PASS" ] || [ "$NEW_PASS" = "null" ]; then
            echo "❌ Neon password rotation failed."
            exit 1
          fi

          echo "✅ New password generated."

          NEW_CONN="postgresql://$ROLE:$NEW_PASS@ep-royal-dawn-ad6eh8t2-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require"
          echo "🔗 New connection string created."

          echo "🔐 Updating GitHub secrets..."
          echo "$NEW_CONN" | gh secret set DATABASE_URL --repo mallan67/mallan-nyc --app actions
          echo "$NEW_CONN" | gh secret set ASSISTANT_DATABASE_URL --repo mallan67/mallan-nyc --app actions

      - name: Trigger Vercel redeploy
        run: |
          echo "🚀 Triggering Vercel redeploy..."
          curl -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name": "mallan-nyc"}'

      - name: Confirm rotation complete
        run: echo "✅ Rotation and redeploy complete."
