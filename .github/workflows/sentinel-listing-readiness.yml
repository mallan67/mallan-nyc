name: Sentinel-L — Listing Workflow Readiness (report-only)

# Sentinel-L is a PR-scoped companion to the daily Sentinel-D repo audit.
# Where Sentinel-D answers "does the codebase still pass compliance gates",
# Sentinel-L answers "if a broker tried to use the listing workflow on
# this PR's preview deployment, would the end-to-end path actually work?"
#
# Absolute restrictions (REPORT-ONLY — same as the repo-audit-bot agent):
#   - Do not patch code. Do not auto-fix anything.
#   - Do not edit any file except the per-PR audit report under
#     memory/audits/listing-readiness/.
#   - Do not open / merge / close / reopen PRs. The workflow posts ONE
#     PR comment on the PR being audited; Claude does not call gh pr
#     comment directly.
#   - Do not trigger production crons. Do not run prisma migrate.
#   - Do not change Neon / Vercel / Cloudflare / REBNY / Trestle settings.
#   - Do not start JSON-drop work. Do not alter production data.
#   - Do not merge any PR — verdict GREEN / YELLOW / RED is informational.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    # Mandatory trigger surfaces per Maya's Sentinel-L spec (Codex P0 #5
    # added the media + syndication + public-listing-filter + search-reader
    # + idx/** + app/listing/** + listing display components + self-paths).
    paths:
      # ── CRM forms + dashboard ──────────────────────────────────────────
      - 'public/crm/SALE-FORM-REDESIGN.html'
      - 'public/crm/RENTAL-FORM-REDESIGN.html'
      - 'public/crm/js/dashboard/**'
      # ── API surfaces ───────────────────────────────────────────────────
      - 'app/api/buildings/**'
      - 'app/api/crm/listings/**'
      - 'app/api/crm/documents/upload/**'
      - 'app/api/media/**'
      - 'app/api/cron/media-sync/**'
      - 'app/api/cron/media-backfill/**'
      # ── Listing detail page + listing display components ───────────────
      - 'app/listing/**'
      - 'app/components/Listing*.tsx'
      - 'app/components/FeaturedListings.tsx'
      - 'app/components/IDX*.tsx'
      - 'app/components/FareAct*.tsx'
      - 'app/components/SearchMap.tsx'
      - 'app/components/AgencyDisclosure.tsx'
      - 'app/components/AntiDiscriminationNotice.tsx'
      # ── lib/idx (Trestle/Cotality mapping, sync, media-sync) ───────────
      - 'lib/idx/**'
      # ── lib/media (media resolver, fallback chain) ─────────────────────
      - 'lib/media/**'
      # ── lib/syndication (Mallan exclusives, partner export) ────────────
      - 'lib/syndication/**'
      # ── lib/compliance (display gates, DTOs, public-listing filter) ────
      - 'lib/compliance/gates.ts'
      - 'lib/compliance/idx-display-gate.ts'
      - 'lib/compliance/dto.ts'
      - 'lib/compliance/public-listing-filter.ts'
      # ── lib/search (public readers + projection) ───────────────────────
      - 'lib/search/public-listing-db.ts'
      - 'lib/search/public-listing-trestle.ts'
      - 'lib/search/listing-search-projection.ts'
      # ── Sentinel-L self-paths (any change to L infra must re-run L) ────
      - '.github/workflows/sentinel-listing-readiness.yml'
      - 'scripts/sentinel-write-listing-audit.mjs'
      - 'scripts/__tests__/sentinel-listing-readiness-workflow.test.js'
      - 'scripts/__tests__/sentinel-write-listing-audit.test.js'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to audit'
        required: true
        type: string

permissions:
  contents: read
  # Codex P0 #6 — `gh pr comment` posts via the issues-comments REST
  # endpoint, so `issues: write` is required alongside `pull-requests: write`
  # for the comment-posting step to succeed across all GitHub-token
  # variants. Both stay scoped to commenting only; neither permits merging,
  # closing, reopening, or assigning.
  pull-requests: write
  issues: write
  id-token: write         # required by anthropics/claude-code-action

concurrency:
  group: sentinel-l-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_INPUT: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="${PR_FROM_EVENT:-$PR_FROM_INPUT}"
          if [ -z "$pr_number" ]; then
            echo "::error::No PR number resolvable from event or workflow_dispatch input."
            exit 1
          fi
          # Validate digits-only — defensive guard against any unexpected
          # string that could slip into a downstream path.
          if ! echo "$pr_number" | grep -Eq '^[0-9]+$'; then
            echo "::error::PR number '$pr_number' is not numeric."
            exit 1
          fi
          # Pull head SHA from the GitHub API (works for both trigger types).
          pr_head_sha=$(gh api "repos/${REPO}/pulls/${pr_number}" --jq '.head.sha')
          if ! echo "$pr_head_sha" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "::error::PR head SHA '$pr_head_sha' is not a valid 40-char lowercase hex."
            exit 1
          fi
          pr_head_ref=$(gh api "repos/${REPO}/pulls/${pr_number}" --jq '.head.ref')
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_head_ref=$pr_head_ref" >> "$GITHUB_OUTPUT"
          echo "short_sha=${pr_head_sha:0:8}" >> "$GITHUB_OUTPUT"
          echo "report_path=memory/audits/listing-readiness/PR-${pr_number}-${pr_head_sha:0:8}.md" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #${pr_number} head ${pr_head_sha:0:8} (ref: ${pr_head_ref})"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.pr_head_sha }}
          fetch-depth: 0    # fetch main too so Claude can diff against it

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (read-only validators only)
        run: npm ci

      # ----------------------------------------------------------------------
      # PRE-CREATE the audit skeleton (same pattern as Sentinel-D).
      # Claude updates this file by invoking
      # `node scripts/sentinel-write-listing-audit.mjs` via Bash. The script
      # enforces the 6 KB cap, the 5 required sections (A–E), the verdict
      # marker, and the closing line. No Write/Edit tool needed.
      # ----------------------------------------------------------------------
      # ----------------------------------------------------------------------
      # Sentinel-L.2 — run the 3 deterministic JSON-producing audit scripts
      # BEFORE Claude. The scripts inspect the PR diff and emit structured
      # signals about field-contract coverage, compliance-language risk, and
      # listing-flow surfaces touched. Claude then consumes these JSONs via
      # the Read tool and uses them to populate the Finding matrix + the
      # 12-lens A–L audit body. The scripts ship signals, not verdicts;
      # Claude's judgment plus the writer's GREEN-blocker rules produce the
      # final verdict.
      # ----------------------------------------------------------------------
      - name: Run Sentinel-L.2 deterministic audit scripts
        id: deterministic
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pr_head_sha }}
          SHORT_SHA: ${{ steps.pr.outputs.short_sha }}
        run: |
          set -euo pipefail

          # Find the merge-base with main so we diff against the PR's actual
          # changes, not the whole branch history.
          git fetch origin main --depth=100 >/dev/null 2>&1 || true
          base_ref=$(git merge-base origin/main HEAD 2>/dev/null || true)
          if [ -z "$base_ref" ]; then
            echo "::warning::No merge-base with origin/main; falling back to HEAD~1"
            base_ref="HEAD~1"
          fi

          changed_files=$(git diff --name-only "$base_ref" HEAD || true)
          changed_files_numstat=$(git diff --numstat "$base_ref" HEAD || true)

          inputs_dir="memory/audits/listing-readiness/inputs"
          mkdir -p "$inputs_dir"
          field_path="$inputs_dir/PR-${PR_NUMBER}-${SHORT_SHA}-field-contract.json"
          language_path="$inputs_dir/PR-${PR_NUMBER}-${SHORT_SHA}-compliance-language.json"
          flow_path="$inputs_dir/PR-${PR_NUMBER}-${SHORT_SHA}-listing-flow.json"

          echo "Running sentinel-field-contract-audit.mjs..."
          CHANGED_FILES="$changed_files" \
            node scripts/sentinel-field-contract-audit.mjs > "$field_path"
          echo "Running sentinel-compliance-language-audit.mjs..."
          CHANGED_FILES="$changed_files" \
            node scripts/sentinel-compliance-language-audit.mjs > "$language_path"
          echo "Running sentinel-listing-flow-static-audit.mjs..."
          CHANGED_FILES="$changed_files" \
          CHANGED_FILES_NUMSTAT="$changed_files_numstat" \
            node scripts/sentinel-listing-flow-static-audit.mjs > "$flow_path"

          # One-line rollup per JSON to make the workflow log self-auditable.
          field_touched=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).summary.touched_count)" "$field_path")
          language_total=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).summary.total_violations)" "$language_path")
          language_max=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).summary.highest_severity)" "$language_path")
          flow_count=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).summary.workflows_touched)" "$flow_path")
          flow_max=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).summary.highest_risk)" "$flow_path")

          echo "Sentinel-L.2 deterministic rollup:"
          echo "  field-contract:        $field_touched touched fields"
          echo "  compliance-language:   $language_total violations (highest: $language_max)"
          echo "  listing-flow:          $flow_count workflows touched (highest: $flow_max)"

          echo "inputs_dir=$inputs_dir" >> "$GITHUB_OUTPUT"
          echo "field_contract_path=$field_path" >> "$GITHUB_OUTPUT"
          echo "compliance_language_path=$language_path" >> "$GITHUB_OUTPUT"
          echo "listing_flow_path=$flow_path" >> "$GITHUB_OUTPUT"
          echo "field_touched_count=$field_touched" >> "$GITHUB_OUTPUT"
          echo "language_total_violations=$language_total" >> "$GITHUB_OUTPUT"
          echo "language_highest_severity=$language_max" >> "$GITHUB_OUTPUT"
          echo "flow_workflows_touched=$flow_count" >> "$GITHUB_OUTPUT"
          echo "flow_highest_risk=$flow_max" >> "$GITHUB_OUTPUT"

      - name: Create listing-readiness audit skeleton
        id: skeleton
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pr_head_sha }}
          REPORT_PATH: ${{ steps.pr.outputs.report_path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REPORT_PATH")"
          ny_iso=$(TZ=America/New_York date +"%Y-%m-%dT%H:%M:%S%z")
          utc_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > "$REPORT_PATH" <<EOF
          # Sentinel-L — Listing Workflow Readiness PR #${PR_NUMBER}

          commit: ${PR_HEAD_SHA}
          ref:    ${{ steps.pr.outputs.pr_head_ref }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          timestamp_eastern: $ny_iso
          timestamp_utc:     $utc_iso
          status: IN PROGRESS

          ---

          ## Finding matrix

          _TODO_

          ## A. Syntax / structural correctness

          _TODO_

          ## B. Field contract correctness

          _TODO_

          ## C. Business logic correctness

          _TODO_

          ## D. Broker / agent usability

          _TODO_

          ## E. Client-facing usability

          _TODO_

          ## F. REBNY / RLS / RESO / IDX Plus compliance

          _TODO_

          ## G. Trestle / Cotality Web API contract

          _TODO_

          ## H. NYC / NYS real estate advertising law

          _TODO_

          ## I. Fair Housing / advertising language

          _TODO_

          ## J. Data persistence and media integrity

          _TODO_

          ## K. Security / privacy / role access

          _TODO_

          ## L. Evidence quality: live proof vs code-only inference

          _TODO_
          EOF
          skeleton_bytes=$(wc -c < "$REPORT_PATH")
          skeleton_sha=$(sha256sum "$REPORT_PATH" | awk '{print $1}')
          echo "skeleton_bytes=$skeleton_bytes" >> "$GITHUB_OUTPUT"
          echo "skeleton_sha=$skeleton_sha" >> "$GITHUB_OUTPUT"
          echo "Skeleton: ${skeleton_bytes} bytes, sha256=${skeleton_sha:0:12}…"

      - name: Invoke Claude — Sentinel-L listing-readiness audit
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # show_full_output: surfaces permission_denials + script ERROR codes
          # in the workflow log for forensic debugging (same as Sentinel-D).
          show_full_output: true
          # Allow-list shape mirrors Sentinel-D.1.1's. NO Write tool. NO Edit.
          # NO Bash for write/exec operations outside the writer script.
          # Codex P0 #7 — narrowed the Bash entry from the broad
          # `Bash(node scripts/*)` (which would permit invoking ANY script
          # under scripts/) to the exact writer command prefix. The trailing
          # ` *` allows the heredoc-redirect tail (`<<'AUDIT_EOF' …`) the
          # writer needs, but nothing else; any `node scripts/<other>` call
          # is denied.
          claude_args: >-
            --allowed-tools "Read,Glob,Grep,WebFetch,WebSearch,Bash(npm run type-check),Bash(npm run lint),Bash(npm run compliance-check),Bash(npm run idx:validate),Bash(npm run rls:validate),Bash(npm run ucba:audit),Bash(npm run crm:check-build),Bash(curl -fsSL *),Bash(curl -sS *),Bash(node scripts/sentinel-write-listing-audit.mjs *),Bash(git status),Bash(git diff *),Bash(git log *),Bash(gh pr view *),Bash(gh pr diff *)"
          prompt: |
            STRICT REPORT-ONLY MODE.

            You are running Sentinel-L: Listing Workflow Readiness audit on
            PR #${{ steps.pr.outputs.pr_number }} at commit ${{ steps.pr.outputs.pr_head_sha }}.

            ### ABSOLUTE RESTRICTIONS

              - You may NOT patch code, auto-fix anything, push, commit,
                merge, open/close/reopen PRs, run `prisma migrate`, trigger
                crons, delete media, change Neon/Vercel/Cloudflare/REBNY/
                Trestle settings, release the external-inventory hold,
                start JSON-drop work, or alter production data.
              - You may NOT use the Write tool. You may NOT use the Edit
                tool. You may NOT use filesystem-write Bash workarounds
                (no `cat >`, no `tee`, no `sed -i`, no `python -c`/`node -e`
                with fs writes). The Write and Edit tools are NOT in your
                allow-list — calls will be denied.
              - You may produce EXACTLY ONE output file:
                ${{ steps.pr.outputs.report_path }}
              - The ONLY supported way to produce this file is to invoke
                `node scripts/sentinel-write-listing-audit.mjs` via Bash
                with the full audit content on stdin (heredoc). The script
                reads PR_NUMBER and PR_HEAD_SHA from env, computes the
                output path internally, and rejects any positional args.
              - The workflow handles the PR comment after you finish. Do
                NOT attempt `gh pr comment` yourself — it is not allowed.

            ### PAYLOAD BUDGET RULE (Sentinel-D.1.1 parser cap applies)

            Each `node scripts/sentinel-write-listing-audit.mjs` call's
            heredoc payload MUST stay under 6 KB (6,144 bytes total). The
            Claude SDK tool-input parser aborts with
            `Parser aborted (timeout, resource limit, or over-length)`
            on larger payloads. Compact-report rules:

              - One concise paragraph per A–E section. Bullets only when
                listing 3+ items.
              - No giant evidence dumps. Use `file:line` references, not
                pasted source. No full command output. No multi-line log
                paste.
              - No new tables anywhere in the report.
              - No repeated command outputs. Cite a finding once.
              - No verbose raw logs. Stack traces → "TypeError at file:42".

            ### FIRST-CALL = COMPACT COMPLETE AUDIT

            **The first successful script invocation must already produce
            a compact complete audit.** That call is the safety net — if
            a later refinement parser-aborts or the job times out, the
            artifact + PR comment still contain a real audit. Required
            ordered procedure:

              1. Read the skeleton at ${{ steps.pr.outputs.report_path }}.
              2. Read the THREE Sentinel-L.2 deterministic JSON inputs the
                 workflow already produced (read each with the Read tool):
                   - ${{ steps.deterministic.outputs.field_contract_path }}
                   - ${{ steps.deterministic.outputs.compliance_language_path }}
                   - ${{ steps.deterministic.outputs.listing_flow_path }}
                 These are deterministic signals. Use them to populate the
                 Finding matrix and to assign per-section verdicts.
              3. Read the PR diff:
                 `gh pr diff ${{ steps.pr.outputs.pr_number }} --patch`
                 to know exactly which lines changed.
              4. Investigate the 12 A–L lenses below at compact resolution.
                 For each lens, assign a verdict (`PASS / FAIL / LIMITED /
                 NOT VERIFIED / BLOCKED`) + at least one `file:line`
                 citation. Aggregate per-file findings into the Finding
                 matrix table.
              5. First script call: submit a STRUCTURALLY COMPLETE report
                 (Finding matrix + all 12 sections filled, one explicit
                 `Final verdict: GREEN`/`YELLOW`/`RED` line, closing line).
                 Stay under 10 KB.

            ### LIMITED FALLBACK RULE

            When detail does not fit under 10 KB, do NOT expand the heredoc.
            Instead, summarize that section in one sentence with the
            evidence gap explicitly stated (e.g. "Coop/Condop logic: code
            present at `SALE-FORM-REDESIGN.html:8421` but live form behavior
            not probed — preview-auth required."). A clearly-marked
            evidence gap is a valid Sentinel-L outcome; a parser-aborted
            heredoc is not.

            ### STOP-EXPAND + POST-ABORT RECOVERY RULE

              1. Once the first script call succeeds (writer prints JSON to
                 stdout), the run already has a usable audit. Continuing to
                 grow the heredoc is risk-for-no-reward.
              2. Never retry with larger content after a parser abort.
              3. If you must retry after a parser abort, the next payload
                 MUST be at least 40% smaller. Drop an evidence block, mark
                 a section LIMITED, collapse paragraphs to bullets.

            ### FINDING MATRIX (REQUIRED — Sentinel-L.2)

            Before the A–L sections, emit a `## Finding matrix` heading
            followed by a pipe-table with these 10 columns:

              | file | changed lines | affected workflow | field contracts touched | user role affected | compliance surface | risk | proof level | finding | required action |

            One row per touched file (deduplicate where multiple workflows
            apply to the same file). Use the deterministic JSON inputs to
            populate `affected workflow`, `field contracts touched`,
            `compliance surface`, `risk`, and `proof level`. The writer
            REJECTS any report missing this matrix or with zero data rows.

            ### 12-LENS A–L CHECKLIST (Sentinel-L.2 multi-lens spec)

            For each lens below, write one concise paragraph (no bullets
            unless 3+ items). Assign a verdict and at least one
            `file:line` citation per lens.

            **A. Syntax / structural correctness** — does the change parse,
            type-check, and follow the project's structural conventions?
            Lint + tsc results; not "tests pass" alone.

            **B. Field contract correctness** — for each touched listing
            field (see field-contract JSON), is the source → form → API →
            DB → reload/display path complete? Missing coverage on
            display gates / address atoms / status / display flags is P0.

            **C. Business logic correctness** — does the changed code
            preserve REBNY UCBA invariants (Coop/Condop, Web Only vs
            Internal Only, Coming Soon rules, status transitions)?

            **D. Broker / agent usability** — can a broker complete the
            workflow end-to-end without manual workarounds, hidden state,
            or surprising failure modes?

            **E. Client-facing usability** — does the public listing page,
            search result, or portal flow render correctly without exposing
            internal-only data or stale state?

            **F. REBNY / RLS / RESO / IDX Plus compliance** — display
            gates (InternetEntireListingDisplayYN, InternetAddressDisplayYN)
            honored, attribution present, RESO field names canonical, no
            phantom fields (IDXEntireListingDisplayYN, ParticipantOnlyYN,
            VOW* gates).

            **G. Trestle / Cotality Web API contract** — ResourceRecordKey
            (not ResourceRecordID) for Media, OData $filter syntax safe,
            no `$filter=InternetEntireListingDisplayYN eq true` (HTTP 400),
            idxPlusPreFiltered semantics preserved.

            **H. NYC / NYS real estate advertising law** — 19 NYCRR §175.25
            brokerage attribution + EHO logo + AgencyDisclosure + Anti-
            DiscriminationNotice; FARE Act (NYC LL 119/2024) disclosure on
            rentals; no misleading availability claims.

            **I. Fair Housing / advertising language** — protected-class
            steering, source-of-income exclusion, criminal-history rules
            (NYC Fair Chance LL 24/2023), disability exclusion, national-
            origin preference. Use the compliance-language JSON's
            violations as P0/P1 signals.

            **J. Data persistence and media integrity** — Save Draft → DB
            record, Edit → reload from DB, media upload → R2 → public
            display chain, listing_media parity, ResourceRecordKey
            usage. Missing media persistence is P0.

            **K. Security / privacy / role access** — agent PII masking in
            portal/public DTOs, broker-vs-agent role checks, audit-event
            logging, no internal-only data exposed publicly.

            **L. Evidence quality: live proof vs code-only inference** —
            explicitly state per finding whether evidence is `live proof`
            (preview-deploy probe) / `deterministic test` / `static code`
            / `limited`. The writer rejects GREEN if any P0/P1 lens
            shows LIMITED, BLOCKED, NOT VERIFIED, evidence gap, or
            cannot verify markers.

            ### HARD RULE — "code exists" is not proof

            "Tests pass" is not proof. "CI green" is not proof. "Code
            exists" is not proof. A check is only PASS when the live user
            path is proven. If you cannot prove a step end-to-end (e.g.
            you cannot live-probe an authed endpoint), the check is
            `LIMITED` with the evidence gap stated, not `PASS`.

            ### VERDICT SEMANTICS

            Emit exactly one line of the form:
              `Final verdict: GREEN`  — broker can use flow end-to-end
              `Final verdict: YELLOW` — usable with named caveats / manual steps
              `Final verdict: RED`    — do not use (illegal, misleading,
                                        data-losing, nonfunctional, unsafe,
                                        or unverified core workflows)

            The writer rejects GREEN if any P0/P1 finding shows LIMITED,
            BLOCKED, NOT VERIFIED, "evidence gap", or "cannot verify"
            markers. Use YELLOW when the workflow is usable but requires
            manual steps or has named limitations. RED is the correct
            verdict when any of the L.2 GREEN-blocker conditions apply.

            ### FINISH STATE

            Before your final script call:
              - `## Finding matrix` section present with ≥ 1 data row.
              - All 12 A–L sections filled (no `_TODO_` remaining).
              - Exactly one `Final verdict: GREEN|YELLOW|RED` line.
              - Last non-blank line is:
                `Sentinel-L: report-only — no changes made.`
              - Payload < 10 KB.

            Never auto-fix anything. Never invent commands not in your
            allow-list. Report-only.
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pr_head_sha }}

      # ----------------------------------------------------------------------
      # Codex P0 #1 + #2 — Post-Claude verification runs UNCONDITIONALLY
      # (`if: always()`) so that a Claude failure / timeout / cancellation
      # still surfaces a RED report on the PR. If Claude did not write a
      # valid audit (file missing, SHA unchanged, verdict missing,
      # duplicate verdict, closing line missing), the workflow writes its
      # own independent fallback RED report so the PR-comment + artifact-
      # upload steps still have content to publish. This is the "Sentinel-L
      # must still produce a RED/LIMITED report even when Claude never
      # invokes the writer" rule.
      # ----------------------------------------------------------------------
      - name: Verify Claude audit OR write fallback report (always runs)
        id: postclaude
        if: always()
        env:
          REPORT_PATH: ${{ steps.pr.outputs.report_path }}
          SKELETON_SHA: ${{ steps.skeleton.outputs.skeleton_sha }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.pr_head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          write_fallback_report() {
            local reason="$1"
            mkdir -p "$(dirname "$REPORT_PATH")"
            ny_iso=$(TZ=America/New_York date +"%Y-%m-%dT%H:%M:%S%z")
            utc_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            cat > "$REPORT_PATH" <<EOF
          # Sentinel-L — Listing Workflow Readiness PR #${PR_NUMBER}

          commit: ${PR_HEAD_SHA}
          status: FAILED
          run_url: ${RUN_URL}
          timestamp_eastern: $ny_iso
          timestamp_utc:     $utc_iso

          ---

          ## Finding matrix

          | file | changed lines | affected workflow | field contracts touched | user role affected | compliance surface | risk | proof level | finding | required action |
          |------|---------------|-------------------|-------------------------|--------------------|--------------------|------|-------------|---------|-----------------|
          | (Sentinel-L workflow itself) | n/a | sentinel-l audit production | n/a | broker | n/a | P0 | limited | Sentinel-L audit did not complete | Manual broker workflow verification required |

          ## A. Syntax / structural correctness

          LIMITED — Sentinel-L could not complete its investigation; static + live verification was not performed.

          ## B. Field contract correctness

