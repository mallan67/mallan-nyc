          ## L. Evidence quality: live proof vs code-only inference

          Reason: ${reason}. Manual broker workflow verification is required before this PR is merged. See workflow run for forensic detail.

          Final verdict: RED

          Sentinel-L: report-only — no changes made.
          EOF
            echo "Wrote fallback RED report (reason: $reason)"
          }

          # ── Case 1: report file missing entirely (Claude never ran or
          #   was cancelled before the writer was invoked) ───────────────
          if [ ! -f "$REPORT_PATH" ]; then
            echo "::warning::Audit file missing (Claude outcome=$CLAUDE_OUTCOME). Writing fallback RED report."
            write_fallback_report "Claude did not produce an audit file (outcome=$CLAUDE_OUTCOME)"
            echo "verdict=RED" >> "$GITHUB_OUTPUT"
            echo "audit_written=fallback" >> "$GITHUB_OUTPUT"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Case 2: file exists but equals the skeleton (zero-Write
          #   class failure — script was never invoked, OR every script
          #   call was rejected/parser-aborted) ──────────────────────────
          current_sha=$(sha256sum "$REPORT_PATH" | awk '{print $1}')
          if [ "$current_sha" = "$SKELETON_SHA" ]; then
            echo "::warning::Audit file SHA == skeleton SHA (zero-Write, outcome=$CLAUDE_OUTCOME). Writing fallback RED report."
            write_fallback_report "Claude did not update the skeleton (zero-Write; SHA unchanged from baseline)"
            echo "verdict=RED" >> "$GITHUB_OUTPUT"
            echo "audit_written=fallback" >> "$GITHUB_OUTPUT"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Case 3: file was modified; enforce exactly-one verdict ───
          # Codex P0 #3: count ALL Final-verdict lines and reject if !=1.
          verdict_count=$(grep -cE '^Final verdict:\s+(GREEN|YELLOW|RED)\s*$' "$REPORT_PATH" || true)
          if [ "$verdict_count" -ne 1 ]; then
            echo "::warning::Found $verdict_count Final verdict lines (expected exactly 1). Writing fallback RED report."
            write_fallback_report "Sentinel-L audit contained $verdict_count verdict lines (expected exactly 1)"
            echo "verdict=RED" >> "$GITHUB_OUTPUT"
            echo "audit_written=fallback" >> "$GITHUB_OUTPUT"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          verdict=$(grep -oE '^Final verdict:\s+(GREEN|YELLOW|RED)\s*$' "$REPORT_PATH" | head -1 | sed -E 's/^Final verdict:\s+(GREEN|YELLOW|RED).*/\1/')

          # ── Case 4: closing line check (defensive — script already
          #   validates, but a fallback path here means the workflow
          #   matches the script's contract regardless of source) ───────
          if ! grep -Fq 'Sentinel-L: report-only — no changes made.' "$REPORT_PATH"; then
            echo "::warning::Closing line missing from audit. Writing fallback RED report."
            write_fallback_report "Sentinel-L audit was missing the literal closing line"
            echo "verdict=RED" >> "$GITHUB_OUTPUT"
            echo "audit_written=fallback" >> "$GITHUB_OUTPUT"
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Audit verified. verdict=$verdict"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "audit_written=true" >> "$GITHUB_OUTPUT"
          echo "fallback=false" >> "$GITHUB_OUTPUT"

      - name: Post audit summary as PR comment
        if: always() && steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          REPORT_PATH: ${{ steps.pr.outputs.report_path }}
          VERDICT: ${{ steps.postclaude.outputs.verdict }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Build a header that prepends a clear verdict + run link, then
          # the full audit body underneath.
          {
            echo "## Sentinel-L — Listing Workflow Readiness"
            echo ""
            echo "**Final verdict: ${VERDICT}**"
            echo ""
            echo "[Run details](${{ github.server_url }}/${REPO}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "---"
            echo ""
            cat "$REPORT_PATH"
          } > /tmp/sentinel-l-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/sentinel-l-comment.md

      - name: Upload audit artifact (always, when audit exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-l-pr-${{ steps.pr.outputs.pr_number }}-${{ steps.pr.outputs.short_sha }}
          path: ${{ steps.pr.outputs.report_path }}
          retention-days: 30
          if-no-files-found: warn
