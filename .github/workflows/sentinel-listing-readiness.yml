name: Sentinel-L - Platform Actionable Error Scanner

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths:
      - 'public/crm/**'
      - 'app/api/listings/**'
      - 'app/api/buildings/**'
      - 'app/api/crm/**'
      - 'app/api/email/**'
      - 'app/api/reports/**'
      - 'app/listing/**'
      - 'app/sitemap.ts'
      - 'app/components/FeaturedListings.tsx'
      - 'app/components/SearchListingCard.tsx'
      - 'app/components/IDXImage.tsx'
      - 'lib/search/**'
      - 'lib/idx/**'
      - 'lib/crm/**'
      - 'lib/media/**'
      - 'lib/compliance/**'
      - 'lib/address/**'
      - 'lib/email/**'
      - 'lib/reports/**'
      - 'lib/market-report/**'
      - 'lib/cma/**'
      - 'lib/listing-slug.ts'
      - 'lib/listing-canonical-url.ts'
      - 'tools/sentinel-l/**'
      - '.github/workflows/sentinel-listing-readiness.yml'
      - 'tests/runtime/sentinel-l-platform-scanner.test.ts'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to scan'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: sentinel-l-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          PR_FROM_INPUT: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_number="${PR_FROM_EVENT:-$PR_FROM_INPUT}"
          if [ -z "$pr_number" ]; then
            echo "::error::No PR number resolvable from event or workflow_dispatch input."
            exit 1
          fi
          if ! echo "$pr_number" | grep -Eq '^[0-9]+$'; then
            echo "::error::PR number '$pr_number' is not numeric."
            exit 1
          fi
          pr_head_sha=$(gh api "repos/${REPO}/pulls/${pr_number}" --jq '.head.sha')
          if ! echo "$pr_head_sha" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "::error::PR head SHA '$pr_head_sha' is not a valid 40-char lowercase hex."
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${pr_head_sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.pr_head_sha }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sentinel-L actionable scanner
        id: scanner
        run: |
          set -euo pipefail
          npm run sentinel:l
          latest_json=$(ls -t ops/audit/sentinel-l/*-errors.json | head -1)
          latest_md="${latest_json%.json}.md"
          status=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).status)" "$latest_json")
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).actionable_errors)" "$latest_json")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "json_path=$latest_json" >> "$GITHUB_OUTPUT"
          echo "markdown_path=$latest_md" >> "$GITHUB_OUTPUT"
          echo "Sentinel-L status: $status"
          echo "Actionable errors: $count"

      - name: Upload Sentinel-L artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-l-actionable-errors-${{ steps.pr.outputs.short_sha }}
          path: ops/audit/sentinel-l/*-errors.*
          if-no-files-found: error

      # Build the actionable summary as TOP-5 P0/P1 ONLY (no green/yellow
      # essays, no P2/P3 noise). Written to /tmp for the (disabled) comment
      # step and echoed to the GitHub Step Summary so the findings are visible
      # in the Actions UI WITHOUT generating a PR comment / email notification.
      - name: Build short actionable summary (top 5 P0/P1)
        if: steps.scanner.outputs.count != '0'
        env:
          JSON_PATH: ${{ steps.scanner.outputs.json_path }}
        run: |
          set -euo pipefail
          node <<'NODE' > /tmp/sentinel-l-comment.md
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync(process.env.JSON_PATH, 'utf8'));
          const all = data.errors || [];
          const blocking = all.filter((e) => e.severity === 'P0' || e.severity === 'P1');
          const top = blocking.slice(0, 5);
          console.log(`Sentinel-L: ${blocking.length} P0/P1 actionable errors (${all.length} total).`);
          console.log('');
          for (const error of top) {
            console.log(`${error.severity} ${error.code} ${error.file}:${error.line}`);
            if (error.searchSystem) console.log(`Search system: ${error.searchSystem}`);
            console.log(`Actual failure: ${error.actualFailure}`);
            console.log(`Impact: ${error.impact}`);
            console.log(`Fix: ${error['required fix']}`);
            console.log(`Proof required: ${error['proof required']}`);
            console.log('');
          }
          if (blocking.length > top.length) {
            console.log(`... ${blocking.length - top.length} more P0/P1 in the Sentinel-L artifact.`);
          }
          NODE
          {
            echo "## Sentinel-L — top 5 P0/P1"
            echo ''
            echo '```'
            cat /tmp/sentinel-l-comment.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # PR-comment posting is INTENTIONALLY DISABLED (if: false).
      # Rationale: PR #266 hard-disabled Sentinel-L PR comments because they
      # fired an email notification on every PR synchronize (mailbox spam).
      # The actionable findings are surfaced via (a) the CI red check below,
      # (b) the uploaded artifact, and (c) the Step Summary above — none of
      # which generate email. To re-enable PR comments (already trimmed to
      # top-5 P0/P1), flip the `if:` below to `steps.scanner.outputs.count != '0'`.
      - name: Post actionable PR comment (disabled — anti-spam per PR 266)
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: gh pr comment "$PR_NUMBER" --body-file /tmp/sentinel-l-comment.md

      - name: Fail on actionable errors
        if: steps.scanner.outputs.count != '0'
        run: |
          echo "::error::Sentinel-L found ${{ steps.scanner.outputs.count }} actionable errors."
          exit 1
