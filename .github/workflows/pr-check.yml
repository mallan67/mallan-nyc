name: PR checks

on:
  pull_request:
    paths:
      - '**/*'

jobs:
  pr-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: mallan
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dev_user -d mallan -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Pooled + direct URLs point at the same scratch Postgres service above.
      # CI doesn't use pgbouncer; both are the same connection string. Prisma
      # requires directUrl to be set because schema.prisma declares it.
      DATABASE_URL: postgresql://dev_user:dev_password@127.0.0.1:5432/mallan?schema=public
      DATABASE_URL_UNPOOLED: postgresql://dev_user:dev_password@127.0.0.1:5432/mallan?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          # Wait for the postgres service to be ready (retry up to ~60s)
          for i in {1..30}; do
            pg_isready -U dev_user -d mallan -h 127.0.0.1 && break
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Create round(double,int) shim in DB
        env:
          PGPASSWORD: dev_password
        run: |
          set -euo pipefail

          cat > /tmp/round_shim.sql <<'SQL'
          CREATE OR REPLACE FUNCTION public.round(x double precision, s integer)
            RETURNS numeric
            LANGUAGE sql
            IMMUTABLE
          AS $$
            SELECT ROUND(CAST(x AS numeric), s);
          $$;
          SQL

          echo "Checking connectivity:"
          psql -h 127.0.0.1 -U dev_user -d mallan -c "SELECT current_database(), inet_server_addr(), inet_server_port();" -v ON_ERROR_STOP=1

          echo "Applying round() shim..."
          psql -h 127.0.0.1 -U dev_user -d mallan -v ON_ERROR_STOP=1 -f /tmp/round_shim.sql

          echo "Verify function exists:"
          psql -h 127.0.0.1 -U dev_user -d mallan -c "\df+ public.round" -v ON_ERROR_STOP=1

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma schema (db push)
        run: npx prisma db push --accept-data-loss

      - name: Apply SQL views / constraints (if present)
        continue-on-error: true
        run: |
          if [ -f tools/apply_sql.js ]; then
            node tools/apply_sql.js || echo "⚠️ SQL views/constraints failed (non-blocking in CI)"
          else
            echo "tools/apply_sql.js not found; skipped"
          fi

      - name: Seed the DB
        continue-on-error: true
        run: |
          if [ -f prisma/seed.js ]; then
            node prisma/seed.js || echo "⚠️ Seed failed (non-blocking in CI)"
          else
            echo "prisma/seed.js not found; skipped"
          fi

      - name: Type-check
        run: npm run type-check

      - name: Jest tests
        run: npx jest --ci --forceExit

      - name: RLS compliance validator
        run: npm run rls:validate

      - name: UCBA compliance audit
        run: npm run ucba:audit

      - name: Form-to-RLS field mapping validation
        run: npm run validate:form-rls

      - name: CI compliance check
        run: node scripts/ci-compliance-check.js

      - name: Build
        run: npm run build
