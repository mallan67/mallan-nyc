name: PR checks

on:
  pull_request:
    paths:
      - '**/*'

jobs:
  pr-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dev_user
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: mallan
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U dev_user -d mallan -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # Pooled + direct URLs point at the same scratch Postgres service above.
      # CI doesn't use pgbouncer; both are the same connection string. Prisma
      # requires directUrl to be set because schema.prisma declares it.
      DATABASE_URL: postgresql://dev_user:dev_password@127.0.0.1:5432/mallan?schema=public
      DATABASE_URL_UNPOOLED: postgresql://dev_user:dev_password@127.0.0.1:5432/mallan?schema=public
      # Enables tests/runtime/lead-upsert.integration.test.ts to run against the
      # ephemeral postgres service (schema created by `prisma db push` below).
      # CI configures CONTACT_DB_INTEGRATION_URL to use the ephemeral PostgreSQL
      # service. Local runs must use a throwaway database.
      CONTACT_DB_INTEGRATION_URL: postgresql://dev_user:dev_password@127.0.0.1:5432/mallan?schema=public
      # Enables tests/runtime/one-cycle-claim.integration.test.ts to run the real
      # claimCycle (advisory lock + JSON-path run_id query) against the ephemeral
      # postgres service. Never points at a real/production database.
      ONE_CYCLE_DB_INTEGRATION_URL: postgresql://dev_user:dev_password@127.0.0.1:5432/mallan?schema=public
      # Enables tests/runtime/external-media-convergence.integration.test.ts to run
      # against the ephemeral postgres service. That suite fails closed unless this
      # host is loopback, so it can never be aimed at Neon.
      EXTERNAL_MEDIA_DB_INTEGRATION_URL: postgresql://dev_user:dev_password@127.0.0.1:5432/mallan?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Cache node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres
        run: |
          # Wait for the postgres service to be ready (retry up to ~60s)
          for i in {1..30}; do
            pg_isready -U dev_user -d mallan -h 127.0.0.1 && break
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Create round(double,int) shim in DB
        env:
          PGPASSWORD: dev_password
        run: |
          set -euo pipefail

          cat > /tmp/round_shim.sql <<'SQL'
          CREATE OR REPLACE FUNCTION public.round(x double precision, s integer)
            RETURNS numeric
            LANGUAGE sql
            IMMUTABLE
          AS $$
            SELECT ROUND(CAST(x AS numeric), s);
          $$;
          SQL

          echo "Checking connectivity:"
          psql -h 127.0.0.1 -U dev_user -d mallan -c "SELECT current_database(), inet_server_addr(), inet_server_port();" -v ON_ERROR_STOP=1

          echo "Applying round() shim..."
          psql -h 127.0.0.1 -U dev_user -d mallan -v ON_ERROR_STOP=1 -f /tmp/round_shim.sql

          echo "Verify function exists:"
          psql -h 127.0.0.1 -U dev_user -d mallan -c "\df+ public.round" -v ON_ERROR_STOP=1

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema (non-destructive)
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply Prisma schema to the ephemeral CI Postgres (NON-DESTRUCTIVE, no data-loss flag)
        # Phase D safety (Codex #429): the CI Postgres is a FRESH, EMPTY, localhost-only service
        # container (env DATABASE_URL = 127.0.0.1:5432), so this CREATES the schema with ZERO data
        # loss. The destructive data-loss flag is intentionally OMITTED so this push can NEVER
        # silently drop a column: it refuses a data-loss op rather than sync-away the physical
        # agent_info column ahead of the gated, snapshot-approved DB DROP. Do NOT add that flag here.
        run: npx prisma db push

      - name: Apply the hand-written external-media migration (proves the SHIPPED DDL)
        # `prisma db push` builds the table from the datamodel but does NOT recreate the
        # CHECK constraints written by hand in the migration. Drop what push made and
        # apply the real migration file, so the integration test asserts the DDL that
        # will actually be applied to production. Never `prisma migrate deploy`, and
        # only ever against the loopback CI service.
        env:
          PGPASSWORD: dev_password
        run: |
          psql -h 127.0.0.1 -U dev_user -d mallan -v ON_ERROR_STOP=1 -c 'DROP TABLE IF EXISTS "listing_external_media" CASCADE;'
          psql -h 127.0.0.1 -U dev_user -d mallan -v ON_ERROR_STOP=1 -f prisma/migrations/20260812150000_add_listing_external_media/migration.sql

      - name: Apply SQL views / constraints (if present)
        continue-on-error: true
        run: |
          if [ -f tools/apply_sql.js ]; then
            node tools/apply_sql.js || echo "⚠️ SQL views/constraints failed (non-blocking in CI)"
          else
            echo "tools/apply_sql.js not found; skipped"
          fi

      - name: Seed the DB
        continue-on-error: true
        run: |
          if [ -f prisma/seed.js ]; then
            node prisma/seed.js || echo "⚠️ Seed failed (non-blocking in CI)"
          else
            echo "prisma/seed.js not found; skipped"
          fi

      - name: Type-check
        run: npm run type-check

      - name: Jest tests
        run: npx jest --ci --forceExit

      - name: RLS compliance validator
        run: npm run rls:validate

      - name: UCBA compliance audit
        run: npm run ucba:audit

      - name: CRM tests
        run: npm run crm:test

      - name: Form-to-RLS field mapping validation
        run: npm run validate:form-rls

      - name: CI compliance check
        run: node scripts/ci-compliance-check.js

      # Display-compliance gates — block merge on any UCBA / Fair Housing /
      # PII regression. These six audits do NOT require Trestle credentials
      # (they parse local files only), so they are safe to run in PR CI.
      # The Trestle-credential audits run on a schedule via trestle-live-audit.yml.
      - name: REBNY display compliance audit
        run: npm run audit:display-compliance

      - name: Build
        run: npm run build
