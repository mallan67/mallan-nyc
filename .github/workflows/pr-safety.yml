name: PR safety

# Guards database, provider, destructive-infrastructure and safety-root changes on every pull
# request, whatever the branch is called. Both jobs run from the PR BASE and read the proposed
# change only through the GitHub API: the pull request's own code is never checked out or run
# here, so a pull request cannot weaken the check that judges it.
#
# Rules, labels and the security model: scripts/ci/pr-safety-check.mjs (Master §27.15-§27.18).
# `labeled`, `unlabeled` and `edited` re-run the check when Maya adds an authorization label or
# when the database chain in the description changes.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]

permissions: {}

jobs:
  # A label authorizes the commit it was given on. A new push, or a change of base branch, removes
  # the authorized:* labels the pull request carried at that moment (a label added afterwards is
  # not in the event and is kept). The check below also ignores labels on that event and any label
  # older than the new commit. No code is checked out here.
  revoke-authorizations:
    if: github.event.action == 'synchronize' || (github.event.action == 'edited' && github.event.changes.base.ref.from)
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove the authorization labels given before this change
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          jq -r '.[] | select(startswith("authorized:"))' <<< "$LABELS" | while IFS= read -r label; do
            gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$(jq -rn --arg l "$label" '$l | @uri')" --silent
            echo "revoked $label"
          done

  pr-safety:
    name: pr-safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - name: Checkout the PR base (never the proposed head)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run the base copy of the PR safety check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_ACTION: ${{ github.event.action }}
          PR_BASE_CHANGED: ${{ github.event.changes.base.ref.from }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MALLAN_SAFETY_AUTHORIZERS: ${{ vars.MALLAN_SAFETY_AUTHORIZERS || 'mallan67' }}
        run: node scripts/ci/pr-safety-check.mjs
