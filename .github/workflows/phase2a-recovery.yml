name: Phase 2A Recovery

# One-time branch recovery. The implementation script removes this workflow
# and its payload files before creating the final implementation commit.
on:
  push:
    branches:
      - fix/neon-write-amp-phase2a-media-reconcile-2026-07-26

permissions:
  contents: write

concurrency:
  group: phase2a-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/neon-write-amp-phase2a-media-reconcile-2026-07-26

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Phase 2A implementation
        shell: bash
        run: python3 .github/phase2a-recovery-v2.py

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate implementation
        env:
          DATABASE_URL: postgresql://x:x@localhost:5432/x
          DATABASE_URL_UNPOOLED: postgresql://x:x@localhost:5432/x
        run: |
          npm run type-check
          npx prisma validate
          npx jest --config lib/idx/jest.config.js --runInBand \
            lib/idx/__tests__/media-set-hash.test.ts \
            lib/idx/__tests__/media-reconcile-guard.test.ts \
            lib/idx/__tests__/listing-media-sync-state.test.ts \
            lib/idx/__tests__/media-sync-orchestration.test.ts \
            lib/idx/__tests__/media-sync-crm-guard.test.ts
          npm run compliance-check
          npm run rls:validate
          npm run ucba:audit
          npm run lint -- --no-warn-ignored lib/idx/media-sync.ts lib/idx/listing-media-sync-state.ts
          git diff --check

      - name: Commit and push implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          cat > /tmp/commit-message <<'MSG'
          fix(idx): finish Phase 2A media reconciliation [neon-preflight: OK]

          - add capability-gated per-listing media reconciliation state
          - require two distinct complete observations before implicit removal
          - preserve legacy behavior when the new table is unavailable
          - remove the obsolete ops-health marker gate

          No database, environment, R2, migration-application, deployment, or production mutation occurred.
          MSG
          git commit -F /tmp/commit-message
          git push origin HEAD:fix/neon-write-amp-phase2a-media-reconcile-2026-07-26
