name: Guardrails (Repo + Compliance)

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Run guardrails check
        run: node scripts/ci/guardrails.mjs

      - name: CRM static shell drift guard
        run: node scripts/ci/check-crm-build.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint
