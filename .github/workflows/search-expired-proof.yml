name: Search Expired live proof

on:
  push:
    branches:
      - fix/neon-p0-event-driven-wake-2026-08-16
    paths:
      - '.github/workflows/search-expired-proof.yml'

permissions:
  contents: read
  issues: write

jobs:
  expired-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IDX_CLIENT_ID: ${{ secrets.IDX_CLIENT_ID }}
      IDX_CLIENT_SECRET: ${{ secrets.IDX_CLIENT_SECRET }}
      TRESTLE_API_URL: ${{ vars.TRESTLE_API_URL || 'https://api.cotality.com/trestle' }}

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v5

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Verify read-only Cotality credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IDX_CLIENT_ID"
          test -n "$IDX_CLIENT_SECRET"
          echo "Cotality credentials present"

      - name: Query Expired and Active control from live Cotality
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cotality/query-live.mjs query \
            --resource=Property \
            --select=StandardStatus,MlsStatus \
            --filter="StandardStatus eq 'Expired'" \
            --top=5 \
            --count=true > /tmp/expired.json

          node scripts/cotality/query-live.mjs query \
            --resource=Property \
            --select=StandardStatus,MlsStatus \
            --filter="StandardStatus eq 'Active'" \
            --top=5 \
            --count=true > /tmp/active.json

      - name: Build durable proof comment
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lines = [
            '### Live Cotality Expired Search Proof',
            '',
            `Commit: \`${process.env.GITHUB_SHA}\``,
            '',
            'Read-only provider queries executed through `scripts/cotality/query-live.mjs` using the repository IDX Plus credentials. No listing identifiers or addresses are published here.',
            '',
          ];

          for (const [label, file] of [['Expired', '/tmp/expired.json'], ['Active control', '/tmp/active.json']]) {
            const payload = JSON.parse(fs.readFileSync(file, 'utf8'));
            const result = payload.result || {};
            const rows = Array.isArray(result.value) ? result.value : [];
            const statuses = [...new Set(rows.map((row) => String(row.StandardStatus ?? 'null')))];
            const mlsStatuses = [...new Set(rows.map((row) => String(row.MlsStatus ?? 'null')))];
            lines.push(`**${label}** — @odata.count: **${result['@odata.count'] ?? 'null'}**; returned sample rows: **${rows.length}**; StandardStatus sample: \`${statuses.join(', ') || 'none'}\`; MlsStatus sample: \`${mlsStatuses.join(', ') || 'none'}\``);
            lines.push('');
          }
          fs.writeFileSync('/tmp/proof.md', lines.join('\n'));
          console.log(lines.join('\n'));
          NODE

      - name: Publish proof on PR 618
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment 618 --repo "$GITHUB_REPOSITORY" --body-file /tmp/proof.md
