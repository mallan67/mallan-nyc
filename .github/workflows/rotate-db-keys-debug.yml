name: Debug Neon Reset

on:
  workflow_dispatch:

jobs:
  debug-reset:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      PROJECT_ID: "morning-bread-68708332"
      BRANCH_ID: "br-old-tree-admdlb9z"
      ROLE: "authenticator"
    steps:
      - name: Debug: Call Neon reset_password and print raw response
        run: |
          set -euo pipefail
          echo "Calling Neon reset for role: $ROLE ..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID/roles/$ROLE/reset_password" || true)

          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d'  || true)

          echo "HTTP_STATUS: $STATUS"
          echo "RESPONSE_BODY:"
          if [ -n "$BODY" ]; then
            echo "$BODY"
          else
            echo "<empty body>"
          fi

          echo "JQ EXTRACT (.role.password):"
          echo "$BODY" | jq -r '.role.password // empty' || echo "<jq failed or empty>"
