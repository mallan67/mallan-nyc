name: Trestle live audit

# Daily audit + on-demand dispatch that cross-references the codebase against
# live Trestle $metadata. Catches drift the moment Cotality renames, retires,
# or adds a field — before that drift breaks production.
#
# This workflow is SEPARATE from pr-check.yml because it needs Trestle API
# credentials. PR CI cannot have those secrets (forks, etc.), so the live-data
# checks run here on a schedule + manual dispatch.

on:
  schedule:
    # Daily at 13:30 UTC = 09:30 ET (after Trestle's overnight metadata refresh).
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Optional commit SHA to audit (defaults to current main HEAD)'
        required: false
        type: string

permissions:
  contents: read
  issues: write           # Open an issue if drift is detected
  pull-requests: write

jobs:
  trestle-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Live Trestle/Cotality credentials — read-only IDX Plus license.
      IDX_CLIENT_ID: ${{ secrets.IDX_CLIENT_ID }}
      IDX_CLIENT_SECRET: ${{ secrets.IDX_CLIENT_SECRET }}
      TRESTLE_API_URL: ${{ vars.TRESTLE_API_URL || 'https://api.cotality.com/trestle' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || 'main' }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Verify Trestle secrets are configured
        id: secrets
        run: |
          # Without IDX_CLIENT_ID + IDX_CLIENT_SECRET in repo secrets, every
          # downstream audit fails with "Missing IDX_CLIENT_ID..." in 0.5s and
          # produces noise instead of signal. Detect once up front and skip
          # cleanly so the workflow exits 0 (no daily false-alarm pages) and
          # is_configured is false (downstream steps gate on it).
          if [ -z "${IDX_CLIENT_ID}" ] || [ -z "${IDX_CLIENT_SECRET}" ]; then
            echo "is_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Trestle audit skipped — IDX_CLIENT_ID and/or IDX_CLIENT_SECRET secrets are not set on this repo. Add them via 'gh secret set IDX_CLIENT_ID' and 'gh secret set IDX_CLIENT_SECRET' to enable the daily live-audit."
            {
              echo "## Trestle live audit — SKIPPED"
              echo ""
              echo "Repo secrets \`IDX_CLIENT_ID\` and/or \`IDX_CLIENT_SECRET\` are not configured."
              echo ""
              echo "To enable the audit, run locally:"
              echo ""
              echo '```sh'
              echo 'gh secret set IDX_CLIENT_ID --repo ${{ github.repository }}'
              echo 'gh secret set IDX_CLIENT_SECRET --repo ${{ github.repository }}'
              echo '```'
              echo ""
              echo "These are the same Trestle/Cotality credentials present in your local \`.env.local\` and Vercel env."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "is_configured=true" >> "$GITHUB_OUTPUT"
            echo "✓ Trestle credentials present"
          fi

      - name: Install dependencies
        if: steps.secrets.outputs.is_configured == 'true'
        run: npm ci

      - name: Audit server-side field references
        id: audit-server
        if: steps.secrets.outputs.is_configured == 'true'
        continue-on-error: true
        run: npm run trestle:audit-server

      - name: Audit non-Property resource $select usage
        id: audit-resources
        if: steps.secrets.outputs.is_configured == 'true'
        continue-on-error: true
        run: npm run trestle:audit-resources

      - name: CSV vs live diff
        id: csv-diff
        if: steps.secrets.outputs.is_configured == 'true'
        continue-on-error: true
        run: |
          # trestle:diff exits non-zero on migration residue — CSV (field,resource)
          # rows whose field no longer exists on live for that resource (e.g. a
          # field migrated to another resource and the old row survived). The
          # aggregate step below flags/opens an issue when this outcome != success.
          # (Read-only: trestle:diff never writes the CSV; use refresh-csv --prune
          # locally to fix residue once reviewed.)
          npm run trestle:diff

      - name: Aggregate result
        id: aggregate
        if: steps.secrets.outputs.is_configured == 'true'
        run: |
          fail=0
          [ "${{ steps.audit-forms.outcome }}" != "success" ] && fail=$((fail+1))
          [ "${{ steps.audit-server.outcome }}" != "success" ] && fail=$((fail+1))
          [ "${{ steps.audit-resources.outcome }}" != "success" ] && fail=$((fail+1))
          [ "${{ steps.csv-diff.outcome }}" != "success" ] && fail=$((fail+1))
          echo "failed_audits=$fail" >> "$GITHUB_OUTPUT"
          if [ "$fail" -gt 0 ]; then
            echo "::error::Trestle live audit detected drift in $fail audit(s)"
          fi

      - name: Ensure tracking labels exist
        if: ${{ steps.secrets.outputs.is_configured == 'true' && github.event_name == 'schedule' && steps.aggregate.outputs.failed_audits != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Older runs failed the entire workflow because the issue-create step
          # tried to attach a `compliance` label that didn't exist in the repo.
          # Pre-create both labels (idempotent: ignore "already exists" error).
          gh label create trestle-drift --color B60205 \
            --description "Auto-opened by trestle-live-audit cron" 2>/dev/null || true
          gh label create compliance --color FBCA04 \
            --description "Compliance / regulatory follow-up" 2>/dev/null || true

      - name: Open drift issue (scheduled runs only)
        if: ${{ steps.secrets.outputs.is_configured == 'true' && github.event_name == 'schedule' && steps.aggregate.outputs.failed_audits != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date +%Y-%m-%d)
          gh issue create \
            --title "Trestle live drift detected — $today" \
            --label "compliance,trestle-drift" \
            --body "$(cat <<EOF
          The daily Trestle live audit detected $((${{ steps.aggregate.outputs.failed_audits }})) audit(s) failing against live \`api.cotality.com/trestle\` \$metadata.

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **Failed audits:**
          - audit-forms: \`${{ steps.audit-forms.outcome }}\`
          - audit-server: \`${{ steps.audit-server.outcome }}\`
          - audit-resources: \`${{ steps.audit-resources.outcome }}\`
          - csv-diff: \`${{ steps.csv-diff.outcome }}\`

          Triage steps:
          1. Pull latest \`main\`
          2. Run the failed audit locally with \`.env.local\` populated
          3. If it's a vendor-side schema change, update the affected code or CSV
          4. If it's a regression (a field name was changed in our code), fix the code

          See \`scripts/audit-server-trestle-coverage.ts\`, \`scripts/audit-form-trestle-coverage.ts\`,
          \`scripts/audit-trestle-non-property-resources.ts\`, and \`scripts/refresh-trestle-csv.ts\` for details.
          EOF
          )"

      - name: Fail the workflow if any audit failed
        if: ${{ steps.secrets.outputs.is_configured == 'true' && steps.aggregate.outputs.failed_audits != '0' }}
        run: exit 1
