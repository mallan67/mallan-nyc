name: Geocode NYC addresses

on:
  schedule:
    - cron: '0 14 * * *' # Every day at 2pm UTC (10am EST)
  workflow_dispatch:

jobs:
  geocode:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Run PowerShell Geocode Script
        run: .\scripts\geocode.ps1 -In data\addresses.csv -Out data\geoclient_addresses_out.csv
        env:
          NYC_GEOCLIENT_KEY: ${{ secrets.NYC_GEOCLIENT_KEY }}

      - name: Check if geocoded file changed
        id: check_diff
        run: |
          git fetch origin main
          git diff --quiet origin/main -- data\geoclient_addresses_out.csv
          if ($LASTEXITCODE -eq 0) {
            echo "No changes to geocoded file."
            echo "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "Geocoded file has changed."
            echo "changed=true" >> $env:GITHUB_OUTPUT
          }

      - name: Commit and Push geocoded data
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data\geoclient_addresses_out.csv
          git commit -m "Auto-update geocoded CSV"
          git push

      - name: Send email with updated CSV
        if: steps.check_diff.outputs.changed == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "✅ NYC Geocoded CSV Updated"
          to: mallangithub@gmail.com
          from: mallangithub@gmail.com
          body: |
            ✅ Your NYC geocoded CSV has been updated and is attached.
            Triggered by GitHub Actions automation.
          attachments: data/geoclient_addresses_out.csv
