name: Geocode NYC addresses

on:
  workflow_dispatch: {}         # allow manual run
  push:
    paths:
      - addresses.csv
      - geocode.ps1
      - .github/workflows/geocode.yml

jobs:
  geocode:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expose secret to script
        shell: pwsh
        run: echo "NYC_GEOCLIENT_KEY=${{ secrets.NYC_GEOCLIENT_KEY }}" >> $Env:GITHUB_ENV

      - name: Run geocoder
        shell: pwsh
        run: pwsh -File geocode.ps1 -In addresses.csv -Out geoclient_addresses_out.csv

      - name: Commit results back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Geoclient: refresh results"
          file_pattern: geoclient_addresses_out.csv
