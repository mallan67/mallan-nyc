name: Geocode NYC addresses

on:
  workflow_dispatch:
  push:
    paths:
      - "addresses.csv"
      - "geocode.ps1"
      - ".github/workflows/geocode.yml"

jobs:
  geocode:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImportExcel module
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module ImportExcel -Scope CurrentUser -Force -AllowClobber

      - name: Run geocoder
        shell: pwsh
        env:
          NYC_GEOCLIENT_KEY: ${{ secrets.NYC_GEOCLIENT_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./geocode.ps1 -Key $env:NYC_GEOCLIENT_KEY -In ./addresses.csv -Out ./geoclient_addresses_out.xlsx

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: geoclient_addresses_out
          path: geoclient_addresses_out.xlsx
