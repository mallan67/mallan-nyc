name: Geocode NYC addresses

on:
  push:
    paths:
      - 'addresses.csv'
  workflow_dispatch:

jobs:
  geocode:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run PowerShell Geocode Script
        env:
          NYC_GEOCLIENT_KEY: ${{ secrets.NYC_GEOCLIENT_KEY }}  # <-- THIS IS WHAT YOU MISSED
        run: |
          ./geocode.ps1 -In addresses.csv -Out geoclient_addresses_out.csv

      - name: Commit and push geocoded data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "mallan-ci-bot"
          git config user.email "ci@mallanrealestate.com"
          git add geoclient_addresses_out.csv || echo "Nothing to commit."
          git diff --cached --quiet || git commit -m "Automated geocode update"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
