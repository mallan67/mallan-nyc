name: Geocode NYC addresses

on:
  workflow_dispatch:  # allow manual runs
  push:
    paths:
      - 'addresses.csv'
      - 'geocode.ps1'
      - '.github/workflows/geocode.yml'

jobs:
  geocode:
    runs-on: windows-latest
    env:
      NYC_GEOCLIENT_KEY: ${{ secrets.NYC_GEOCLIENT_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanity check (files & key)
        shell: pwsh
        run: |
          if (-not (Test-Path .\addresses.csv)) { throw "addresses.csv not found in repo root" }
          if (-not $env:NYC_GEOCLIENT_KEY) { throw "NYC_GEOCLIENT_KEY secret is missing" }
          "addresses.csv exists: $((Test-Path .\addresses.csv))"
          "Key length: $($env:NYC_GEOCLIENT_KEY.Length)"

      - name: Run geocode
        shell: pwsh
        run: .\geocode.ps1 -In .\addresses.csv -Out .\geoclient_addresses_out.csv

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: geoclient_addresses_out
          path: geoclient_addresses_out.csv
