name: Geocode NYC addresses

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # ⏰ Runs daily at 5:00 AM UTC

jobs:
  geocode:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run PowerShell Geocode Script
        run: ./geocode.ps1 -In addresses.csv -Out geoclient_addresses_out.csv
        env:
          NYC_GEOCLIENT_KEY: ${{ secrets.NYC_GEOCLIENT_KEY }}

      - name: Commit and Push geocoded data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add geoclient_addresses_out.csv
          
          # Commit only if there are changes
          git diff --cached --quiet || git commit -m "Update geocoded data"
          
          # Push only if committed
          git diff --cached --quiet || git push
