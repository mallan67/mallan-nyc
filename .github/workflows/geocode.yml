name: Geocode NYC addresses

on:
  schedule:
    - cron: '0 14 * * *'  # 9am ET daily
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  geocode:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Run PowerShell Geocode Script
        shell: pwsh
        run: |
          ./geocode.ps1 -In addresses.csv -Out geoclient_addresses_out.csv
        env:
          NYC_GEOCLIENT_KEY: ${{ secrets.NYC_GEOCLIENT_KEY }}

      - name: Commit and push geocoded data
        run: |
          git config user.name "mallan-ci-bot"
          git config user.email "ci@mallanrealestate.com"
          git add geoclient_addresses_out.csv || echo "Nothing to commit."
          git diff --cached --quiet || git commit -m "Automated geocode run on $(date '+%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
