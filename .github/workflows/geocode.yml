# .github/workflows/geocode.yml

name: Geocode NYC addresses

on:
  workflow_dispatch:

jobs:
  geocode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run geocode script
        run: |
          python scripts/geocode_nyc.py
        env:
          NYC_API_KEY: ${{ secrets.NYC_API_KEY }}
          MAPBOX_API_KEY: ${{ secrets.MAPBOX_API_KEY }}

      - name: Commit and push geocoded data
        run: |
          git config user.name "mallan-ci-bot"
          git config user.email "ci@mallanrealestate.com"
          git add output/*.csv
          git commit -m "Automated geocode run on $(date '+%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
