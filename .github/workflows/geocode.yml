name: Geocode NYC addresses

on:
  schedule:
    - cron: '0 14 * * *' # Every day at 2pm UTC (10am EST)
  workflow_dispatch:

jobs:
  geocode:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run PowerShell Geocode Script
        run: ./geocode.ps1 -In addresses.csv -Out geoclient_addresses_out.csv
        env:
          NYC_GEOCLIENT_KEY: ${{ secrets.NYC_GEOCLIENT_KEY }}

      - name: Check if geocoded file changed
        id: check_diff
        run: |
          git fetch origin main
          if (git diff --quiet origin/main -- geoclient_addresses_out.csv) {
            echo "No changes to geocoded file."
            echo "changed=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "Geocoded file has changed."
            echo "changed=true" >> $env:GITHUB_OUTPUT
          }

      - name: Send Email if geocoded file updated
        if: steps.check_diff.outputs.changed == 'true'
        run: |
          curl --url 'smtps://smtp.gmail.com:465' \
               --ssl-reqd \
               --mail-from "${{ secrets.SMTP_USER }}" \
               --mail-rcpt "mallangithub@gmail.com" \
               --user "${{ secrets.SMTP_USER }}:${{ secrets.SMTP_PASS }}" \
               --upload-file geoclient_addresses_out.csv \
               --header "Subject: 🗽 NYC Geocode CSV Update" \
               --header "From: GitHub Bot <${{ secrets.SMTP_USER }}>" \
               --header "To: mallangithub@gmail.com" \
               --header "Content-Type: text/plain"
