name: Geocode NYC addresses

on:
  workflow_dispatch:
  push:
    paths:
      - 'addresses.csv'
      - 'geocode.ps1'
      - '.github/workflows/geocode.yml'

permissions:
  contents: write

jobs:
  geocode:
    runs-on: windows-latest
    env:
      NYC_GEOCLIENT_KEY: ${{ secrets.NYC_GEOCLIENT_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Sanity check
        shell: pwsh
        run: |
          if (-not (Test-Path .\addresses.csv)) { throw "addresses.csv not found in repo root" }
          if (-not $env:NYC_GEOCLIENT_KEY) { throw "NYC_GEOCLIENT_KEY is missing" }

      - name: Run geocode
        shell: pwsh
        run: .\geocode.ps1 -In .\addresses.csv -Out .\geoclient_addresses_out.csv

      - name: Commit output to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update geoclient_addresses_out.csv (auto)"
          file_pattern: geoclient_addresses_out.csv

      - name: Upload result artifact
        uses: actions/upload-artifact@v4
        with:
          name: geoclient_addresses_out
          path: geoclient_addresses_out.csv
