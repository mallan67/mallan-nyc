name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Provide safe defaults so the build won't explode if env vars are missing
      - name: Create CI .env (safe defaults)
        run: |
          cat > .env << 'EOF'
          NEXT_PUBLIC_SITE_URL=https://example.com
          ADMIN_PROTECT=0
          EOF

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Lint (non-blocking)
        run: npm run lint || true

      - name: Typecheck (non-blocking)
        run: npm run type-check || true

      - name: Build
        run: npm run build

      - name: Lighthouse (non-blocking)
        run: npx @lhci/cli autorun --upload.target=temporary-public-storage || true
