name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create safe .env for CI
        run: |
          cat > .env << 'EOF'
          NEXT_PUBLIC_SITE_URL=https://mallan.nyc
          ADMIN_PROTECT=0
          EOF

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Lint (non-blocking)
        run: npm run -s lint
        continue-on-error: true

      - name: Typecheck (non-blocking)
        run: npm run -s type-check
        continue-on-error: true

      - name: Build (non-blocking)
        run: |
          npm run -s build || npm run -s next:build || echo "No build script found"
        continue-on-error: true
