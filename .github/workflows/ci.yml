name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - run: npm run lint --if-present
      - run: npm run typecheck --if-present || npm run type-check --if-present || true
      - run: npm run build

      - name: Lighthouse CI (smoke)
        run: npx @lhci/cli autorun --upload.target=temporary-public-storage || true
