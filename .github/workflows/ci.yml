name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Keep CI safe even if .env isn't configured yet
      - name: Create safe .env for CI
        run: |
          cat > .env << 'EOF'
          NEXT_PUBLIC_SITE_URL=https://mallan.nyc
          ADMIN_PROTECT=0
          EOF

      # ✅ This is the missing piece — actually install dependencies
      - name: Install deps
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      # Non-blocking checks (won't fail the job)
      - name: Lint
        run: npm run -s lint
        continue-on-error: true

      - name: Typecheck
        run: npm run -s type-check
        continue-on-error: true

      # Build must pass
      - name: Build
        run: npm run -s build
