name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # remove cache to avoid "lock file not found" noise when there is no lockfile
          # cache: 'npm'

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-fund --no-audit
          fi

      - name: Lint (non-blocking)
        run: npm run lint || true

      - name: Typecheck (non-blocking)
        run: npm run type-check || true

      - name: Build
        run: npm run build

      - name: Lighthouse CI (smoke, non-blocking)
        run: npx @lhci/cli autorun --upload.target=temporary-public-storage || true
