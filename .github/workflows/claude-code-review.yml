name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    # INDEPENDENT READ-ONLY REVIEWER. This job must never be able to change the
    # repository it is reviewing — a reviewer that can edit the code it reviews
    # is not an independent check. `id-token: write` is NOT repository write: it
    # only mints the GitHub OIDC token that federation exchanges for an
    # Anthropic credential.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # read CI results on the PR under review

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # ── Workload Identity Federation ──────────────────────────────────
          # No static credential. `claude_code_oauth_token` is deliberately
          # ABSENT: per the action's setup docs a static credential TAKES
          # PRECEDENCE over federation, so leaving it here would silently
          # disable WIF while appearing to work.
          #
          # These four values are IDENTIFIERS, not secrets, so they are read
          # from repository variables rather than secrets. They must exist
          # before this merges or the job cannot authenticate at all.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}

          additional_permissions: |
            actions: read

          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'

          # Verified against code.claude.com/docs/en/cli-reference, not the
          # action docs: claude_args is passed through to the CLI unvalidated.
          # --effort accepts low|medium|high|xhigh|max|ultracode. `max` carries
          # no minimum-CLI-version requirement (only `ultracode` does).
          claude_args: |
            --model claude-opus-5
            --effort max
