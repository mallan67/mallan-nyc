name: QUARANTINED - direct Neon preview branch cleanup

# QUARANTINED_DIRECT_NEON_CONTROL
# Mallan Neon control is Vercel-managed. The former PR-close workflow called
# the Neon API directly and carried an obsolete production/preview project model.
# It must not delete provider branches. Retained as an explicit fail-closed tombstone
# until the Vercel-managed branch lifecycle is reconciled and separately authorized.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarantined:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse direct Neon branch cleanup
        run: |
          echo "::error::QUARANTINED_DIRECT_NEON_CONTROL: direct Neon branch deletion is not an authorized Mallan path."
          echo "Use the Vercel-managed neon-green-school resource contract after an authorized control packet."
          exit 1
