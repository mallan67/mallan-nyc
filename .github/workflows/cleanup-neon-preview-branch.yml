name: Cleanup Neon preview branch on PR close

# =========================================================================
# PRODUCTION ISOLATION — read this before editing.
# -------------------------------------------------------------------------
# When a PR closes (merged or not), delete the ONE Neon preview branch that
# the Vercel-Managed integration created for that PR's preview deploys.
# This is hygiene only — it complements the daily `neon-branch-prune` cron
# (24h retention) by cleaning a PR's branch immediately at close.
#
# It operates EXCLUSIVELY on the PREVIEW Neon project
#   hidden-mountain-87248164  (Vercel label "neon-green-school")
# via DEDICATED, PREVIEW-ONLY credentials:
#   vars.NEON_PREVIEW_PROJECT_ID    -> must equal hidden-mountain-87248164
#   secrets.NEON_PREVIEW_API_KEY    -> a Neon key scoped to the preview project
#
# It MUST NEVER touch production:
#   - Neon project  morning-bread-68708332  (mallandb / legacy do-not-serve — refuse here)
#   - vars.NEON_PROJECT_ID   -> legacy morning-bread project (do NOT use here)
#   - secrets.NEON_API_KEY   -> production credential-rotation key (do NOT use here)
#
# Refs:
#   docs/support/vercel-neon-false-branch-limit-status-2026-06-03.md  (canonical Neon/Vercel status)
#   docs/architecture/NEON-VERCEL-OWNERSHIP-MAP.md  (§7 env-var ownership)
# =========================================================================

on:
  pull_request:
    types: [closed]

# Least privilege: no repo contents access is needed (no checkout; Neon API only).
permissions:
  contents: read

concurrency:
  group: neon-preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete-preview-branch:
    runs-on: ubuntu-latest
    # Skip fork PRs: they cannot access secrets, and we never act on external refs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Accept the preview project id whether it was stored as a repo VARIABLE
      # or a repo SECRET (project ids are not sensitive; either placement works).
      PREVIEW_PROJECT_ID: ${{ vars.NEON_PREVIEW_PROJECT_ID || secrets.NEON_PREVIEW_PROJECT_ID }}
      EXPECTED_PREVIEW_PROJECT_ID: hidden-mountain-87248164
      PROD_PROJECT_ID: morning-bread-68708332
      HEAD_REF: ${{ github.head_ref }}
    steps:
      # ---------------------------------------------------------------------
      # Guard — fail CLOSED before the delete action runs. Reads $HEAD_REF via
      # env (NOT inline ${{ }}) so a crafted branch name cannot inject shell.
      # ---------------------------------------------------------------------
      - name: Guard — production isolation + branch-name safety
        run: |
          set -euo pipefail

          # 0. Trim stray whitespace/newlines. A value pasted into a GitHub
          #    secret/variable box often carries a trailing newline, which
          #    silently breaks the exact-match guards below (seen in PR #316 smoke test).
          PREVIEW_PROJECT_ID="$(printf '%s' "${PREVIEW_PROJECT_ID:-}" | tr -d '[:space:]')"
          HEAD_REF="$(printf '%s' "${HEAD_REF:-}" | tr -d '\r\n')"

          # 1. Preview project id must be present, must be the EXPECTED preview
          #    project, and must NEVER equal the production project.
          if [ -z "${PREVIEW_PROJECT_ID}" ]; then
            echo "::error::NEON_PREVIEW_PROJECT_ID is not set — refusing to run."; exit 1
          fi
          if [ "${PREVIEW_PROJECT_ID}" = "${PROD_PROJECT_ID}" ]; then
            echo "::error::Preview project id equals PRODUCTION (${PROD_PROJECT_ID}) — aborting."; exit 1
          fi
          if [ "${PREVIEW_PROJECT_ID}" != "${EXPECTED_PREVIEW_PROJECT_ID}" ]; then
            echo "::error::Preview project id '${PREVIEW_PROJECT_ID}' != expected '${EXPECTED_PREVIEW_PROJECT_ID}' — aborting."; exit 1
          fi

          # 2. head_ref must be present.
          if [ -z "${HEAD_REF}" ]; then
            echo "::error::Empty head_ref — aborting."; exit 1
          fi

          # 3. Never act on a protected branch name.
          case "${HEAD_REF}" in
            main|master|production|preview/main)
              echo "::error::Refusing to act on protected branch '${HEAD_REF}'."; exit 1 ;;
          esac

          # 4. Reject path-traversal / shell / glob metacharacters and whitespace:
          #    ..  ~  ^  :  \  [  ]  {  }  and spaces.
          case "${HEAD_REF}" in
            *..*|*"~"*|*"^"*|*":"*|*"\\"*|*"["*|*"]"*|*"{"*|*"}"*|*" "*)
              echo "::error::Suspicious character in head_ref '${HEAD_REF}' — aborting."; exit 1 ;;
          esac

          echo "Guard passed. Cleanup target (if it exists): preview/${HEAD_REF}"

      # ---------------------------------------------------------------------
      # Delete via a CONTROLLED Neon API call (not the official action) so we can
      # distinguish failure modes instead of masking them (Codex review, PR #315):
      #   - missing API key / auth / list error  -> HARD FAIL (never silent)
      #   - branch genuinely not found            -> success (the ONLY tolerated no-op)
      #   - delete error                          -> HARD FAIL
      # No blanket `continue-on-error`. Secrets are passed via env and never printed
      # (no `set -x`, no `curl -v`); GitHub also masks them in logs.
      # ---------------------------------------------------------------------
      - name: Delete the PR's Neon preview branch (preview project only)
        env:
          # PREVIEW ONLY — never secrets.NEON_API_KEY (that is the production rotation key).
          NEON_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
        run: |
          set -uo pipefail   # NOT -e: we inspect HTTP codes and decide explicitly

          # Re-trim here: job-level env reaches this step raw (the guard trimmed
          # only its own shell copy).
          PID="$(printf '%s' "${PREVIEW_PROJECT_ID:-}" | tr -d '[:space:]')"
          REF="$(printf '%s' "${HEAD_REF:-}" | tr -d '\r\n')"
          KEY="$(printf '%s' "${NEON_API_KEY:-}" | tr -d '[:space:]')"

          # Codex review: fail HARD when the preview API key is absent/misnamed,
          # rather than letting the delete silently no-op.
          if [ -z "${KEY}" ]; then
            echo "::error::NEON_PREVIEW_API_KEY is not set — cannot manage preview branches. Failing."; exit 1
          fi
          # Defense in depth: re-assert the preview project (guard already checked).
          if [ "${PID}" != "hidden-mountain-87248164" ] || [ "${PID}" = "morning-bread-68708332" ]; then
            echo "::error::Refusing: project id '${PID}' is not the expected preview project."; exit 1
          fi

          TARGET="preview/${REF}"
          API="https://console.neon.tech/api/v2/projects/${PID}/branches"

          # 1) List branches. Any non-200 (401/403/etc.) = auth/permission/API problem = HARD FAIL.
          HTTP=$(curl -sS -o /tmp/neon-branches.json -w "%{http_code}" \
                   -H "Authorization: Bearer ${KEY}" -H "Accept: application/json" "${API}" || echo "000")
          if [ "${HTTP}" != "200" ]; then
            echo "::error::Neon list-branches returned HTTP ${HTTP} (auth/permission/API failure). Failing — not masking."; exit 1
          fi

          # 2) Find the EXACT target, non-primary + non-protected (defense in depth).
          BRANCH_ID=$(jq -r --arg n "${TARGET}" \
            '.branches[] | select(.name==$n and .primary==false and .protected==false) | .id' \
            /tmp/neon-branches.json | head -n1)

          # 3) Genuinely-absent branch = the ONLY tolerated no-op (PR had no preview, or already pruned).
          if [ -z "${BRANCH_ID}" ] || [ "${BRANCH_ID}" = "null" ]; then
            echo "No deletable branch named '${TARGET}' (already gone or never created). Nothing to do."; exit 0
          fi

          # 4) Delete. 404 = already gone; anything else non-2xx = HARD FAIL.
          echo "Deleting '${TARGET}' (id ${BRANCH_ID}) from ${PID}..."
          DCODE=$(curl -sS -o /tmp/neon-del.json -w "%{http_code}" -X DELETE \
                    -H "Authorization: Bearer ${KEY}" "${API}/${BRANCH_ID}" || echo "000")
          case "${DCODE}" in
            200|201|202) echo "Deleted '${TARGET}'." ;;
            404)         echo "Branch vanished before delete (404) — already gone." ;;
            *)           echo "::error::Delete returned HTTP ${DCODE} — failing (not masking)."; exit 1 ;;
          esac
