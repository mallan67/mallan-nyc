name: Auto-retry runner-pool flakes

# Watches selected workflows for `failure` conclusions caused by GitHub's
# hosted-runner pool failing to acquire a machine (annotation:
# "The job was not acquired by Runner of type hosted ..."). When that
# specific infra flake is detected, this workflow re-runs only the failed
# jobs once. Real test/check failures are left untouched so they still
# surface notifications.
#
# Heuristic for "runner-pool flake": the failed run has zero job steps
# whose conclusion is `failure`. A real failure always has at least one
# step that ran and reported a non-success conclusion. A runner-pool
# flake never starts any step at all — the job is marked failed by
# GitHub directly when allocation times out.
#
# Bounded to one auto-retry per run via the `run_attempt < 2` gate. If
# the second attempt also can't acquire a runner, we let it stay failed
# rather than spinning indefinitely.

on:
  workflow_run:
    workflows:
      - Live Site Smoke (cron)
    types:
      - completed

permissions:
  actions: write   # gh run rerun
  contents: read

jobs:
  maybe-retry:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}

    steps:
      - name: Classify failure
        id: classify
        run: |
          set -eu
          # Fetch jobs once and parse locally so we can distinguish
          # "API returned 0 failed steps" from "API call failed".
          # The previous `|| echo "0"` pattern coerced any API error
          # (auth, rate limit, transient outage) into "0 failed steps",
          # which downstream interpreted as a runner-pool flake — and
          # would have triggered an auto-rerun on real failures during
          # any infra hiccup. Fail closed: unknown state -> no rerun.
          if ! jobs_json=$(gh api \
              "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs" 2>jobs_err); then
            echo "WARN: jobs API call failed; leaving the run alone"
            cat jobs_err >&2 || true
            echo "is_flake=false" >> "$GITHUB_OUTPUT"
            echo "classify_skipped=api_error" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! failed_steps=$(echo "$jobs_json" | \
              jq -r '[.jobs[]?.steps[]? | select(.conclusion == "failure")] | length' 2>/dev/null) \
              || ! [ "$failed_steps" -eq "$failed_steps" ] 2>/dev/null; then
            echo "WARN: could not parse failed_steps count; leaving the run alone"
            echo "is_flake=false" >> "$GITHUB_OUTPUT"
            echo "classify_skipped=parse_error" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          job_ids=$(echo "$jobs_json" | jq -r '.jobs[]?.id' 2>/dev/null || true)
          annotations_file=$(mktemp)
          for j in $job_ids; do
            gh api "repos/${GH_REPO}/check-runs/${j}/annotations" \
              --jq '.[]?.message' >>"$annotations_file" 2>/dev/null || true
          done

          echo "failed_steps=${failed_steps}"
          echo "annotations follow:"
          cat "$annotations_file" || true

          is_flake="false"
          if [ "${failed_steps}" = "0" ]; then
            is_flake="true"
            echo "reason: zero failed steps (runner never acquired)"
          elif grep -qiE "not acquired by Runner|runner.*not.*available" "$annotations_file"; then
            is_flake="true"
            echo "reason: runner-pool annotation matched"
          else
            echo "reason: real failure — has failed steps and no runner-pool annotation"
          fi
          rm -f "$annotations_file"
          echo "is_flake=${is_flake}" >> "$GITHUB_OUTPUT"

      - name: Skipped — classifier could not safely decide
        if: steps.classify.outputs.classify_skipped != ''
        run: |
          echo "Classifier skipped (${{ steps.classify.outputs.classify_skipped }})."
          echo "Failing closed: leaving run ${RUN_ID} alone, no auto-rerun issued."

      - name: Re-run failed jobs (flake only)
        if: steps.classify.outputs.is_flake == 'true'
        run: |
          # gh run rerun has no $GITHUB_REPOSITORY checkout to infer from
          # in workflow_run jobs (we don't actions/checkout). Pass repo
          # context explicitly via --repo (or GH_REPO env, set above).
          gh run rerun "${RUN_ID}" --failed --repo "${GH_REPO}"
          echo "Re-ran failed jobs in run ${RUN_ID} (${WORKFLOW_NAME})"

      - name: Skipped — real failure
        if: steps.classify.outputs.is_flake != 'true' && steps.classify.outputs.classify_skipped == ''
        run: |
          echo "Run ${RUN_ID} (${WORKFLOW_NAME}) failed with executed steps —"
          echo "leaving it alone so the FAIL notification reaches a human."

      - name: Job summary
        if: always()
        run: |
          if [ "${{ steps.classify.outputs.classify_skipped }}" != "" ]; then
            verdict="classifier error (${{ steps.classify.outputs.classify_skipped }}) — failed closed, no rerun"
          elif [ "${{ steps.classify.outputs.is_flake }}" = "true" ]; then
            verdict="flake — re-run triggered"
          else
            verdict="real failure — left alone"
          fi
          {
            echo "## Auto-retry runner-pool flakes"
            echo ""
            echo "- Watched run: \`${RUN_ID}\` (${WORKFLOW_NAME})"
            echo "- Run attempt: ${{ github.event.workflow_run.run_attempt }}"
            echo "- Conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo "- Verdict: ${verdict}"
          } >> "$GITHUB_STEP_SUMMARY"
