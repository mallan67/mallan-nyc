name: Release Truth

# Runs the unified release-truth aggregator (validator framework §17) on
# every push to main. Cross-references UCBA + workflow + migration + deploy
# layers and posts the final verdict (PROD_PROVEN / CODE_VALID / PARTIAL /
# DEPLOY_INVALID / UNVERIFIED / CLAIM_OVERSTATED / REGRESSION) as a commit
# status, so the next reviewer can see at a glance whether the merged
# state is actually proven.
#
# Also runs on PR review-ready as a non-blocking advisory (the PR's existing
# checks remain authoritative for merge gating). Manual dispatch supported
# for retrospective audits.

on:
  push:
    branches: [main]
  pull_request:
    # Advisory: posts the release-truth verdict as a commit status on the PR
    # head SHA (no PR comment / email). opened+synchronize keep it updated.
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to audit (defaults to current HEAD)'
        required: false
        type: string
      pr:
        description: 'PR number to audit (alternative to sha)'
        required: false
        type: string

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  release-truth:
    runs-on: ubuntu-latest
    # 15 (was 10): the armed push-to-main path WAITS for the production Vercel
    # deployment to become READY (the verifier's bounded ~5 min poll) and then
    # runs the smoke + aggregation, so the job needs some headroom beyond npm ci.
    # This is only a CEILING — the job ends as soon as proof completes (ordinarily
    # 6–8 min); GitHub does not sit idle for the rest. Non-armed / PR runs finish
    # well inside it.
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://stub:stub@localhost:5432/stub?schema=public
      DATABASE_URL_UNPOOLED: postgresql://stub:stub@localhost:5432/stub?schema=public
      SESSION_SECRET: ci-stub-session-secret-not-real
      NEXT_TELEMETRY_DISABLED: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Single source of truth for the revision under audit. Resolved BEFORE
      # checkout so the checkout, the aggregator (--sha), and the published
      # commit status ALL target the SAME commit:
      #   pull_request      -> PR head sha (never the synthetic merge ref)
      #   push              -> github.sha
      #   workflow_dispatch -> inputs.sha, or the head sha of inputs.pr
      - name: Resolve target
        id: target
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            sha="${{ inputs.sha }}"; args="--sha ${{ inputs.sha }}"; label="SHA ${{ inputs.sha }}"
          elif [ -n "${{ inputs.pr }}" ]; then
            sha=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr }}" --jq '.head.sha')
            args="--pr ${{ inputs.pr }}"; label="PR #${{ inputs.pr }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # P2: checkout + status publication use the PR HEAD sha, but the
            # aggregator is invoked with --pr so the deploy validator takes
            # the DEPLOY_PREVIEW path (a PR's Vercel deployment is a preview;
            # PREVIEW_PROVEN is its cap — it can never become PROD_PROVEN).
            sha="${{ github.event.pull_request.head.sha }}"; args="--pr ${{ github.event.pull_request.number }}"; label="PR #${{ github.event.pull_request.number }}"
          else
            sha="${{ github.sha }}"; args="--sha $sha"; label="SHA $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Same revision the verdict is audited + published for (steps.target.sha):
          # PR head sha on pull_request, github.sha on push, inputs sha/pr otherwise.
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        run: npm ci

      # Phase 1 — TOKEN-FREE production identity proof. Asks mallan.nyc ITSELF
      # (GET /api/release-identity) which commit + deployment it is serving; a
      # MATCH proves alias ownership BY CONSTRUCTION (the workflow queried the
      # alias directly). No Vercel API token, no VERCEL_TEAM_ID, no
      # RELEASE_TRUTH_REQUIRE_DEPLOY_PROOF variable, no secret at all.
      #
      # PUSH-TO-MAIN ONLY. A push to main IS the current production revision, so
      # mallan.nyc will serve it once deployed. workflow_dispatch is deliberately
      # EXCLUDED: a manual/retrospective audit can target an arbitrary inputs.sha
      # / inputs.pr (a preview or an older SHA) that mallan.nyc will never serve,
      # which would exhaust the poll and fail the enforce gate — regressing the
      # advisory manual-audit path. Dispatch stays advisory (aggregator runs, no
      # production proof). To re-prove a main commit, RE-RUN its push job.
      - name: Verify production identity — phase 1 (public proof, no token)
        id: verify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set +e
          # --json: stdout is EXACTLY one JSON document; progress → stderr. The
          # verifier's DEFAULT bounded poll (10 × 30s ≈ 5 min) WAITS for the
          # pushed deploy to become the one serving mallan.nyc — a push-to-main
          # fires this concurrently with the Vercel build, which normally
          # finishes inside that window. FAIL-CLOSED: still non-MATCH after ~5
          # min → status pending/failure, retriable (do NOT raise the poll to
          # mask a slow/missing deploy).
          node scripts/release-safety/verify-release-identity.js --expected-sha "$TARGET_SHA" --base-url https://mallan.nyc --json > deploy-proof.json 2> deploy-proof.stderr
          rc=$?
          cat deploy-proof.stderr >&2
          # STRICT proof validation — accept ONLY a MATCH whose every identity
          # field checks out: dpl_ deployment id, deployed_sha === target,
          # target_env === production, alias host mallan.nyc. Anything else
          # discards the proof and fails closed.
          node -e '
            const fs = require("fs");
            const target = (process.env.TARGET_SHA || "").toLowerCase();
            const d = JSON.parse(fs.readFileSync("deploy-proof.json", "utf8"));
            const problems = [];
            if (d.verdict !== "MATCH") problems.push("verdict=" + d.verdict);
            if (!/^dpl_[A-Za-z0-9]+$/.test(d.deployment_id || "")) problems.push("deployment_id not a dpl_ id");
            if ((d.expected_sha || "").toLowerCase() !== target) problems.push("expected_sha mismatch");
            if ((d.deployed_sha || "").toLowerCase() !== target) problems.push("deployed_sha mismatch");
            if (d.target_env !== "production") problems.push("target_env=" + d.target_env);
            if (d.alias_host !== "mallan.nyc") problems.push("alias_host=" + d.alias_host);
            if (!Array.isArray(d.aliases) || !d.aliases.includes("mallan.nyc")) problems.push("aliases lack mallan.nyc");
            if (problems.length > 0) { console.error("proof rejected: " + problems.join("; ")); process.exit(1); }
            console.log("identity proof accepted: " + d.deployment_id + " @ " + d.deployed_sha + " (" + d.target_env + ")");
          '
          check_rc=$?
          if [ $rc -ne 0 ] || [ $check_rc -ne 0 ]; then
            echo "identity proof invalid (verifier rc=$rc, check rc=$check_rc) — discarding deploy-proof.json" >&2
            rm -f deploy-proof.json
            [ $rc -eq 0 ] && rc=4
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # Gate enforcement happens in the final step so the aggregator,
          # status post, and summary still run and stay honest.
          exit 0

      # Runtime smoke evidence. PROD_PROVEN requires BOTH a deploy proof AND
      # runtime smoke — this supplies the smoke the workflow previously never
      # ran. Runs ONLY when phase 1 produced a VALIDATED deploy-proof.json (rc=0
      # ⇒ mallan.nyc serves the target SHA in production); probes mallan.nyc via
      # listing-smoke.js bound to the SAME SHA and the deployment_id phase 1
      # matched. No token needed. Non-fatal: a failing smoke still writes
      # smoke.json (passed:false) so the aggregator returns an honest not-proven
      # verdict and the status stays pending/failure — never a false green.
      - name: Run listing smoke against production
        # Event-gated FIRST (a skipped verify leaves outputs.rc = '' and GitHub
        # coerces '' == '0' to a numeric 0 == 0 = TRUE, which would wrongly run
        # this on PRs). Production proof only runs on push-to-main / dispatch.
        id: smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.verify.outputs.rc == '0'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set +e
          if [ ! -f deploy-proof.json ]; then
            echo "no validated deploy-proof.json — skipping smoke (aggregator stays UNVERIFIED)" >&2
            exit 0
          fi
          DEPLOYMENT_ID=$(jq -r '.deployment_id // empty' deploy-proof.json)
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "deploy-proof.json has no deployment_id — cannot bind smoke; skipping" >&2
            exit 0
          fi
          # stdout is EXACTLY one JSON document (the evidence); progress → stderr.
          node scripts/release-safety/listing-smoke.js \
            --base-url https://mallan.nyc \
            --expected-sha "$TARGET_SHA" \
            --deployment-id "$DEPLOYMENT_ID" \
            > smoke.json 2> smoke.stderr
          srr=$?
          cat smoke.stderr >&2
          echo "smoke_rc=$srr" >> "$GITHUB_OUTPUT"
          # Keep smoke.json regardless of pass/fail so the aggregator's smoke
          # layer decides honestly (PROD_PROVEN needs passed===true, bound to the
          # deploy proof's SHA + deployment). This step never fails the run.
          exit 0

      # Phase 2 — reconfirm the SAME deployment STILL serves the alias AFTER the
      # smoke. listing-smoke records --deployment-id verbatim, so without this an
      # A→B alias switch DURING the smoke window could bind B's responses to A's
      # id and publish a FALSE PROD_PROVEN (Codex TOCTOU finding on #565). Re-GET
      # /api/release-identity and REQUIRE the same sha + deployment id + still
      # production; ANY change discards BOTH proofs so the aggregator cannot reach
      # PROD_PROVEN (fail closed) and the gate step below fails the run.
      - name: Reconfirm production identity — phase 2 (post-smoke)
        # Event-gated (same '' == '0' coercion guard as the smoke step).
        id: reconfirm
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.verify.outputs.rc == '0'
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set +e
          node scripts/release-safety/verify-release-identity.js --expected-sha "$TARGET_SHA" --base-url https://mallan.nyc --json --reconfirm deploy-proof.json > reconfirm.json 2> reconfirm.stderr
          rrc=$?
          cat reconfirm.stderr >&2
          if [ $rrc -ne 0 ]; then
            echo "post-smoke reconfirm FAILED — alias identity changed during the smoke window; discarding proofs (fail closed)" >&2
            rm -f deploy-proof.json smoke.json
          fi
          echo "reconfirm_rc=$rrc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run release-truth aggregator
        id: aggregator
        run: |
          set +e
          # Feed the aggregator BOTH proofs when they survived: the phase-1
          # deploy-proof.json (mallan.nyc serves the target SHA in production)
          # AND smoke.json (listing-smoke bound to that exact SHA + deployment).
          # Phase 2 DELETES both if the alias identity changed during the smoke
          # window, so an absent file here is itself the fail-closed signal.
          # PROD_PROVEN requires BOTH present + bound; with either missing the
          # verdict stays UNVERIFIED (status pending). Previously the workflow
          # passed only --deploy-proof and never ran the smoke, so it could never
          # reach PROD_PROVEN — this wires the missing evidence. PR events are
          # NEVER production-gated (advisory only; --pr caps at PREVIEW_PROVEN).
          extra=""
          if [ -f deploy-proof.json ]; then
            extra="$extra --deploy-proof deploy-proof.json"
          fi
          if [ -f smoke.json ]; then
            extra="$extra --smoke-evidence smoke.json"
          fi
          # Single aggregator execution: one JSON, stderr preserved. Logs,
          # status, and summary all render from this SAME JSON.
          node scripts/release-truth-check.js ${{ steps.target.outputs.args }} $extra --json > release-truth.json 2> release-truth.stderr
          rc=$?
          cat release-truth.stderr >&2
          node -e '
            const fs = require("fs");
            let d;
            try { d = JSON.parse(fs.readFileSync("release-truth.json", "utf8")); }
            catch (e) { console.error("release-truth.json missing/invalid: " + e.message); process.exit(1); }
            const known = ["PROD_PROVEN","PREVIEW_PROVEN","CODE_VALID","PARTIAL","UNVERIFIED","REGRESSION","DEPLOY_INVALID","CLAIM_OVERSTATED"];
            if (!known.includes(d.verdict)) { console.error("unknown verdict: " + d.verdict); process.exit(1); }
            fs.writeFileSync("release-truth-verdict.txt", d.verdict);
            fs.writeFileSync("release-truth-reasons.txt", (d.reasons || []).join(" | ") || "(no reasons)");
            console.log("Verdict: " + d.verdict);
            for (const r of d.reasons || []) console.log("  - " + r);
            for (const [k, v] of Object.entries(d.layers || {})) console.log("  layer " + k + ": " + JSON.stringify(v).slice(0, 300));
          '
          parse_rc=$?
          if [ $parse_rc -ne 0 ]; then
            # Invalid/missing JSON or unrecognized verdict => the run FAILS and
            # the status step (always()) posts a failure/error status.
            echo "verdict=ERROR" >> "$GITHUB_OUTPUT"
            echo "aggregator output invalid or verdict unrecognized" > release-truth-reasons.txt
            exit 1
          fi
          echo "verdict=$(cat release-truth-verdict.txt)" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0  # Advisory mode: the commit status carries the verdict;
                  # the production gate (if armed) is enforced in the final step

      - name: Post commit status
        # Posts the advisory release-truth verdict as a commit status
        # (context "release-truth") on BOTH push (github.sha) and pull_request
        # (the PR HEAD sha, so it is visible ON the PR). No PR comment / email.
        # The workflow never fails on the verdict — the aggregator exits 0; this
        # step only sets a status (PARTIAL/UNVERIFIED => pending, advisory).
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && always()
        run: |
          # P2 fail-closed default: an empty/unrecognized verdict posts
          # "error", never "success". Reasons are read from the file the
          # aggregator step wrote — NEVER passed through GitHub expression
          # interpolation into shell quoting (reason text is arbitrary and
          # must not touch the shell as code).
          verdict="${{ steps.aggregator.outputs.verdict }}"
          state="error"
          case "$verdict" in
            PROD_PROVEN|PREVIEW_PROVEN|CODE_VALID) state="success" ;;
            PARTIAL|UNVERIFIED) state="pending" ;;
            DEPLOY_INVALID|REGRESSION|CLAIM_OVERSTATED) state="failure" ;;
            ERROR|'') verdict="ERROR"; state="error" ;;
          esac
          reasons="$(head -c 120 release-truth-reasons.txt 2>/dev/null || echo 'no reasons captured')"
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.target.outputs.sha }}" \
            -f state="$state" \
            -f context="release-truth" \
            -f description="$verdict: $reasons" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Comment on PR
        # DISABLED (anti-spam): the Release-Truth verdict still posts as a commit
        # status + Job Summary — no PR comment / email. Step preserved for a
        # one-line re-enable: flip back to `github.event_name == 'pull_request'`.
        if: ${{ false }}
        run: |
          cat > /tmp/comment.md <<EOF
          ## Release Truth Audit — ${{ steps.target.outputs.label }}

          **Verdict:** \`${{ steps.aggregator.outputs.verdict }}\`

          **Reasons:**
          ${{ steps.aggregator.outputs.reasons }}

          <details>
          <summary>Layer-by-layer JSON</summary>

          \`\`\`json
          $(cat release-truth.json | jq '.layers')
          \`\`\`

          </details>

          *This is an advisory check — the PR's existing required checks remain authoritative for merge gating.*
          EOF
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Release Truth — ${{ steps.target.outputs.label }}"
            echo ""
            echo "**Verdict:** \`${{ steps.aggregator.outputs.verdict || 'ERROR' }}\`"
            echo ""
            echo "**Reasons:** $(cat release-truth-reasons.txt 2>/dev/null || echo 'no reasons captured')"
            echo ""
            echo '```json'
            jq '.layers' release-truth.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce production gate
        # Runs LAST so the aggregator verdict, commit status, and summary are
        # always published first. Fails the run when phase-1 identity did not
        # MATCH, OR the phase-2 post-smoke reconfirm rejected (alias identity
        # changed during the smoke window). Either way the proofs were discarded
        # and the status is pending/failure — this makes the RUN fail-closed too,
        # so a slow/missing/switched deploy is visible and retriable.
        # Event-gated so PR / non-main events never reach the fail branch (they
        # skip the production-proof steps entirely and stay advisory/pending).
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') &&
          ((steps.verify.outputs.rc != '' && steps.verify.outputs.rc != '0') ||
           (steps.reconfirm.outputs.reconfirm_rc != '' && steps.reconfirm.outputs.reconfirm_rc != '0'))
        run: |
          echo "Production identity gate FAILED (phase-1 rc='${{ steps.verify.outputs.rc }}', phase-2 reconfirm rc='${{ steps.reconfirm.outputs.reconfirm_rc }}') — failing the run"
          exit 1
