name: Release Truth

# Runs the unified release-truth aggregator (validator framework §17) on
# every push to main. Cross-references UCBA + workflow + migration + deploy
# layers and posts the final verdict (PROD_PROVEN / CODE_VALID / PARTIAL /
# DEPLOY_INVALID / UNVERIFIED / CLAIM_OVERSTATED / REGRESSION) as a commit
# status, so the next reviewer can see at a glance whether the merged
# state is actually proven.
#
# Also runs on PR review-ready as a non-blocking advisory (the PR's existing
# checks remain authoritative for merge gating). Manual dispatch supported
# for retrospective audits.

on:
  push:
    branches: [main]
  pull_request:
    # Advisory: posts the release-truth verdict as a commit status on the PR
    # head SHA (no PR comment / email). opened+synchronize keep it updated.
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to audit (defaults to current HEAD)'
        required: false
        type: string
      pr:
        description: 'PR number to audit (alternative to sha)'
        required: false
        type: string

permissions:
  contents: read
  statuses: write
  pull-requests: write

jobs:
  release-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://stub:stub@localhost:5432/stub?schema=public
      DATABASE_URL_UNPOOLED: postgresql://stub:stub@localhost:5432/stub?schema=public
      SESSION_SECRET: ci-stub-session-secret-not-real
      NEXT_TELEMETRY_DISABLED: '1'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Single source of truth for the revision under audit. Resolved BEFORE
      # checkout so the checkout, the aggregator (--sha), and the published
      # commit status ALL target the SAME commit:
      #   pull_request      -> PR head sha (never the synthetic merge ref)
      #   push              -> github.sha
      #   workflow_dispatch -> inputs.sha, or the head sha of inputs.pr
      - name: Resolve target
        id: target
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            sha="${{ inputs.sha }}"; args="--sha ${{ inputs.sha }}"; label="SHA ${{ inputs.sha }}"
          elif [ -n "${{ inputs.pr }}" ]; then
            sha=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr }}" --jq '.head.sha')
            args="--pr ${{ inputs.pr }}"; label="PR #${{ inputs.pr }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            sha="${{ github.event.pull_request.head.sha }}"; args="--sha $sha"; label="SHA $sha"
          else
            sha="${{ github.sha }}"; args="--sha $sha"; label="SHA $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Same revision the verdict is audited + published for (steps.target.sha):
          # PR head sha on pull_request, github.sha on push, inputs sha/pr otherwise.
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Run release-truth aggregator
        id: aggregator
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          # P2 production hard gate — OFF until the repo variable
          # RELEASE_TRUTH_REQUIRE_DEPLOY_PROOF is 'true' (Maya's decision).
          # When ON, and ONLY for non-PR targets (push to main / dispatched
          # production audits), the gate:
          #   1. runs the alias-aware production verifier
          #      (scripts/release-safety/verify-deployment-sha.js): mallan.nyc
          #      must be served by a READY deployment built from the target
          #      SHA, with alias ownership proven — the gate FAILS otherwise;
          #   2. feeds that proof to the aggregator (--deploy-proof), whose
          #      verdict stays honest: PROD_PROVEN additionally requires
          #      runtime smoke evidence (--smoke-evidence, runbook-supplied),
          #      so the advisory verdict here reads UNVERIFIED until then.
          # PR events are NEVER production-gated (advisory only, and cap at
          # PREVIEW_PROVEN by design).
          extra=""
          gate_rc=0
          if [ "${{ vars.RELEASE_TRUTH_REQUIRE_DEPLOY_PROOF }}" = "true" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            node scripts/release-safety/verify-deployment-sha.js --expected-sha "${{ steps.target.outputs.sha }}" > deploy-proof.json
            gate_rc=$?
            extra="--deploy-proof deploy-proof.json"
          fi
          # Single aggregator execution: one JSON, stderr preserved. Logs,
          # status, and summary all render from this SAME JSON.
          node scripts/release-truth-check.js ${{ steps.target.outputs.args }} $extra --json > release-truth.json 2> release-truth.stderr
          rc=$?
          cat release-truth.stderr >&2
          node -e '
            const fs = require("fs");
            let d;
            try { d = JSON.parse(fs.readFileSync("release-truth.json", "utf8")); }
            catch (e) { console.error("release-truth.json missing/invalid: " + e.message); process.exit(1); }
            const known = ["PROD_PROVEN","PREVIEW_PROVEN","CODE_VALID","PARTIAL","UNVERIFIED","REGRESSION","DEPLOY_INVALID","CLAIM_OVERSTATED"];
            if (!known.includes(d.verdict)) { console.error("unknown verdict: " + d.verdict); process.exit(1); }
            fs.writeFileSync("release-truth-verdict.txt", d.verdict);
            fs.writeFileSync("release-truth-reasons.txt", (d.reasons || []).join(" | ") || "(no reasons)");
            console.log("Verdict: " + d.verdict);
            for (const r of d.reasons || []) console.log("  - " + r);
            for (const [k, v] of Object.entries(d.layers || {})) console.log("  layer " + k + ": " + JSON.stringify(v).slice(0, 300));
          '
          parse_rc=$?
          if [ $parse_rc -ne 0 ]; then
            # Invalid/missing JSON or unrecognized verdict => the run FAILS and
            # the status step (always()) posts a failure/error status.
            echo "verdict=ERROR" >> "$GITHUB_OUTPUT"
            echo "aggregator output invalid or verdict unrecognized" > release-truth-reasons.txt
            exit 1
          fi
          echo "verdict=$(cat release-truth-verdict.txt)" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ $gate_rc -ne 0 ]; then
            echo "Production alias verification FAILED (exit $gate_rc) — failing the gated run" >&2
            exit $gate_rc
          fi
          exit 0  # Advisory mode: the commit status carries the verdict

      - name: Post commit status
        # Posts the advisory release-truth verdict as a commit status
        # (context "release-truth") on BOTH push (github.sha) and pull_request
        # (the PR HEAD sha, so it is visible ON the PR). No PR comment / email.
        # The workflow never fails on the verdict — the aggregator exits 0; this
        # step only sets a status (PARTIAL/UNVERIFIED => pending, advisory).
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && always()
        run: |
          # P2 fail-closed default: an empty/unrecognized verdict posts
          # "error", never "success". Reasons are read from the file the
          # aggregator step wrote — NEVER passed through GitHub expression
          # interpolation into shell quoting (reason text is arbitrary and
          # must not touch the shell as code).
          verdict="${{ steps.aggregator.outputs.verdict }}"
          state="error"
          case "$verdict" in
            PROD_PROVEN|PREVIEW_PROVEN|CODE_VALID) state="success" ;;
            PARTIAL|UNVERIFIED) state="pending" ;;
            DEPLOY_INVALID|REGRESSION|CLAIM_OVERSTATED) state="failure" ;;
            ERROR|'') verdict="ERROR"; state="error" ;;
          esac
          reasons="$(head -c 120 release-truth-reasons.txt 2>/dev/null || echo 'no reasons captured')"
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.target.outputs.sha }}" \
            -f state="$state" \
            -f context="release-truth" \
            -f description="$verdict: $reasons" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Comment on PR
        # DISABLED (anti-spam, per the PR #266 Sentinel precedent): the Release-Truth
        # verdict still posts as a commit status + Job Summary — no PR comment / email.
        # Step preserved for a one-line re-enable: flip back to
        # `github.event_name == 'pull_request'`.
        if: ${{ false }}
        run: |
          cat > /tmp/comment.md <<EOF
          ## Release Truth Audit — ${{ steps.target.outputs.label }}

          **Verdict:** \`${{ steps.aggregator.outputs.verdict }}\`

          **Reasons:**
          ${{ steps.aggregator.outputs.reasons }}

          <details>
          <summary>Layer-by-layer JSON</summary>

          \`\`\`json
          $(cat release-truth.json | jq '.layers')
          \`\`\`

          </details>

          *This is an advisory check — the PR's existing required checks remain authoritative for merge gating.*
          EOF
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Release Truth — ${{ steps.target.outputs.label }}"
            echo ""
            echo "**Verdict:** \`${{ steps.aggregator.outputs.verdict || 'ERROR' }}\`"
            echo ""
            echo "**Reasons:** $(cat release-truth-reasons.txt 2>/dev/null || echo 'no reasons captured')"
            echo ""
            echo '```json'
            jq '.layers' release-truth.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
