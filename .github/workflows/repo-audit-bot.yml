name: Mallan Sentinel — Repo Audit Bot (report-only)

# STRICT REPORT-ONLY recurring auditor for mallan.nyc.
#
# Absolute restrictions (also enforced in .claude/agents/repo-audit-bot.md):
#   - Do not patch code. Do not auto-fix anything.
#   - Do not edit any file except the dated audit report under memory/audits/.
#   - Do not open / merge / close / reopen PRs except the draft audit PR this
#     workflow itself creates. Specifically: do not reopen PR #104.
#   - Do not trigger production crons. Do not run `prisma migrate deploy`.
#   - Do not delete R2 objects. Do not change schema/migrations.
#   - Do not change Neon / Vercel / Cloudflare / REBNY / Trestle / Cotality settings.
#   - Do not release the external-inventory hold. Do not remove `media-backfill`.
#   - Do not start JSON-drop work. Do not alter production data.
#   - Do not merge any PR — including the audit PR. Maya merges manually.

on:
  schedule:
    # 8:00 AM America/New_York fires twice (DST gate inside the job picks the
    # right one). GitHub cron is UTC and does not follow DST.
    - cron: '0 12 * * *'   # 12:00 UTC = 08:00 EDT (Mar–Nov)
    - cron: '0 13 * * *'   # 13:00 UTC = 08:00 EST (Nov–Mar)
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass DST/cadence gate (manual run only)'
        type: boolean
        default: true

permissions:
  contents: write       # write only to audits/auto-* branch
  pull-requests: write  # open the draft audit PR (cannot merge)
  issues: write         # fallback alert if email send fails
  id-token: write       # required by anthropics/claude-code-action

concurrency:
  group: repo-audit-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. DST + cadence gate. Both schedule fires arrive every day; only the one
  #    that matches 08:00 America/New_York proceeds. Cadence is controlled by
  #    repo variable AUDIT_CADENCE ('daily' default | 'weekly' = Mon only).
  # ---------------------------------------------------------------------------
  dst-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      cadence: ${{ steps.check.outputs.cadence }}
    steps:
      - name: Decide whether this fire proceeds
        id: check
        env:
          AUDIT_CADENCE: ${{ vars.AUDIT_CADENCE }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          cadence="${AUDIT_CADENCE:-daily}"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "Manual dispatch with force=true. Bypassing gate."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "cadence=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ny_hour=$(TZ=America/New_York date +%H)
          ny_dow=$(TZ=America/New_York date +%u)   # 1=Mon..7=Sun
          if [ "$ny_hour" != "08" ]; then
            echo "DST gate: NY hour is $ny_hour (need 08). Exiting cleanly."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$cadence" = "weekly" ] && [ "$ny_dow" != "1" ]; then
            echo "Weekly cadence: today dow=$ny_dow (need 1=Mon). Exiting cleanly."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Proceeding. cadence=$cadence ny_hour=$ny_hour ny_dow=$ny_dow"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "cadence=$cadence" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Run repo-audit-bot under Claude Code Action with a strict tool allow-list.
  #    Claude can ONLY write under memory/audits/. All other Edit/Write paths
  #    are denied by --allowed-tools. Push, commit, merge, prisma migrate,
  #    destructive scripts are not in the allow-list → cannot be invoked.
  # ---------------------------------------------------------------------------
  audit:
    needs: dst-gate
    if: needs.dst-gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      report_path: ${{ steps.paths.outputs.report_path }}
      branch:      ${{ steps.paths.outputs.branch }}
      report_date: ${{ steps.paths.outputs.report_date }}
      no_report:   ${{ steps.guard.outputs.no_report }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Compute branch + report path (Eastern date)
        id: paths
        run: |
          set -euo pipefail
          ny_date=$(TZ=America/New_York date +%Y-%m-%d)
          ny_hhmm=$(TZ=America/New_York date +%H%M)
          branch="audits/auto-${ny_date}"
          base_path="memory/audits/AUDIT-${ny_date}.md"
          if [ -e "$base_path" ]; then
            report_path="memory/audits/AUDIT-${ny_date}-${ny_hhmm}.md"
          else
            report_path="$base_path"
          fi
          echo "branch=$branch"             >> "$GITHUB_OUTPUT"
          echo "report_path=$report_path"   >> "$GITHUB_OUTPUT"
          echo "report_date=$ny_date"       >> "$GITHUB_OUTPUT"

      - name: Create or check out audit branch
        run: |
          set -euo pipefail
          git config user.name  "mallan-audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "${{ steps.paths.outputs.branch }}" >/dev/null 2>&1; then
            git fetch origin "${{ steps.paths.outputs.branch }}":"${{ steps.paths.outputs.branch }}"
            git checkout "${{ steps.paths.outputs.branch }}"
          else
            git checkout -b "${{ steps.paths.outputs.branch }}"
          fi
          mkdir -p memory/audits

      - name: Install dependencies (read-only validators only)
        run: npm ci

      # -----------------------------------------------------------------------
      # PRE-CREATE the audit report skeleton.
      #
      # Why this exists: the post-PR-#118 smoke test (run 25871550958) failed
      # red because Claude finished its 20-minute investigation without ever
      # calling the Write tool on memory/audits/AUDIT-YYYY-MM-DD.md. The
      # fail-red guard correctly turned the workflow red, but no audit content
      # was produced.
      #
      # The fix is to remove the "create the file" requirement from Claude
      # entirely. The workflow now guarantees the file exists with the right
      # structure before Claude starts. Claude only has to UPDATE the
      # existing file as findings are collected, then replace every
      # `IN PROGRESS` marker and add the literal closing line at the end.
      #
      # If Claude fails to update the file (same failure mode as before),
      # the guard fires on Gate 3 (IN PROGRESS still present) instead of
      # Gate 1 (no file). Either way the run turns red — but now a skeleton
      # always exists, which makes the failure auditable and the draft PR
      # creatable on partial-completion runs.
      # -----------------------------------------------------------------------
      - name: Create audit report skeleton
        id: skeleton
        run: |
          set -euo pipefail
          report="${{ steps.paths.outputs.report_path }}"
          ny_iso=$(TZ=America/New_York date +"%Y-%m-%dT%H:%M:%S%z")
          utc_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p "$(dirname "$report")"
          cat > "$report" <<EOF
          # Mallan Sentinel Audit — ${{ steps.paths.outputs.report_date }}

          timestamp_eastern: $ny_iso
          timestamp_utc:     $utc_iso
          run_url:           ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          status:            IN PROGRESS

          Overall status: IN PROGRESS — audit running.

          ---

          ## Coverage Matrix

          | #  | Area                                                                 | Status      | Evidence | Notes |
          |----|----------------------------------------------------------------------|-------------|----------|-------|
          | 1  | REBNY / RLS / UCBA 2026 compliance                                   | IN PROGRESS | —        | —     |
          | 2  | Trestle / Cotality IDX Plus requirements                             | IN PROGRESS | —        | —     |
          | 3  | RESO mapping and field parity                                        | IN PROGRESS | —        | —     |
          | 4  | IDX display permissions and suppression                              | IN PROGRESS | —        | —     |
          | 5  | REBNY attribution on public listing surfaces                         | IN PROGRESS | —        | —     |
          | 6  | Fair Housing / protected-class language                              | IN PROGRESS | —        | —     |
          | 7  | NY real estate advertising compliance (19 NYCRR 175.25, RPL)         | IN PROGRESS | —        | —     |
          | 8  | NYC rental disclosures (FARE Act, lead paint, bedbug, sprinkler)     | IN PROGRESS | —        | —     |
          | 9  | Search functionality (public IDX + 6 CRM search modes)               | IN PROGRESS | —        | —     |
          | 10 | Listing detail functionality (sale + rental + commercial paths)      | IN PROGRESS | —        | —     |
          | 11 | Photos / media / R2 / listing_media parity                           | IN PROGRESS | —        | —     |
          | 12 | Map / geolocation / address display + suppression                    | IN PROGRESS | —        | —     |
          | 13 | Portal flows (buyer / tenant / seller / landlord)                    | IN PROGRESS | —        | —     |
          | 14 | CRM and agent workflows (broker admin, agent admin, deal forms)      | IN PROGRESS | —        | —     |
          | 15 | Forms and lead capture + consent_captured_at (TCPA/CAN-SPAM)         | IN PROGRESS | —        | —     |
          | 16 | UI/UX/accessibility (WCAG 2.1 AA, responsive across breakpoints)     | IN PROGRESS | —        | —     |
          | 17 | SEO / sitemap / robots / canonical / structured data (JSON-LD)       | IN PROGRESS | —        | —     |
          | 18 | Security / privacy / PII / auth / session (cookie-only, MFA, TTLs)   | IN PROGRESS | —        | —     |
          | 19 | Vercel / Neon / cron / build / deploy / storage health               | IN PROGRESS | —        | —     |
          | 20 | Open PRs / stale branches / repo drift                               | IN PROGRESS | —        | —     |
          | 21 | External rule changes (REBNY / RLS / Trestle / Cotality / FH / NY)   | IN PROGRESS | —        | —     |

          ---

          ## A. Date / time

          _TODO_

          ## B. Overall status: Green / Yellow / Red

          _TODO_

          ## C. Top 5 risks (ranked) — derived from Coverage Matrix

          _TODO_

          ## D. New since last audit

          _TODO_

          ## E. Fixed since last audit

          _TODO_

          ## F. Still open

          _TODO_

          ## G. Compliance findings (REBNY / RLS / UCBA / Trestle / RESO / Fair Housing / NY DOS / FARE)

          _TODO_

          ## H. Functionality findings

          _TODO_

          ## I. UI/UX findings

          _TODO_

          ## J. Media / photo findings

          _TODO_

          ## K. Search / listing / map findings

          _TODO_

          ## L. Portal / CRM findings

          _TODO_

          ## M. Security / privacy findings

          _TODO_

          ## N. Infra / cron / DB findings

          _TODO_

          ## O. External rule-change findings

          _TODO_

          ## P. Recommended fix order

          _TODO_

          ## Q. Blockers

          _TODO_

          ## R. Do-not-touch guardrail confirmation

          _TODO_

          ## S. Appendix — commands run, evidence excerpts, URLs consulted, file paths, line numbers, counts

          _TODO_
          EOF
          echo "Created skeleton at $report ($(wc -l < "$report") lines, $(grep -c 'IN PROGRESS' "$report") IN PROGRESS markers)"
          # Sanity check — the literal closing line MUST NOT be in the skeleton.
          # Claude is responsible for adding it when the report is complete.
          if grep -Fq 'Report-only: no changes made.' "$report"; then
            echo "::error::Skeleton accidentally contains the literal closing line — this is a workflow bug."
            exit 1
          fi
          # Capture skeleton baseline measurements for the post-Claude diagnostic
          # guard added in PR Sentinel-A. The SHA-256 hash (NOT bytes) is the
          # canonical zero-Write signal: a perfectly-completed audit MAY be
          # smaller than the skeleton (e.g., terse "PASS" replaces "IN PROGRESS",
          # short evidence lines replace `_TODO_`), so byte-growth is unreliable
          # and can falsely fail a valid completed report (Codex finding 1 on
          # PR Sentinel-A). Same SHA == same content == Write was never called.
          # The byte count is kept for diagnostic logging only.
          skeleton_bytes=$(wc -c < "$report")
          skeleton_sha=$(sha256sum "$report" | awk '{print $1}')
          skeleton_matrix_ip=$(grep -c '| IN PROGRESS |' "$report" || true)
          skeleton_todo=$(grep -c '^_TODO_$' "$report" || true)
          {
            echo "skeleton_bytes=$skeleton_bytes"
            echo "skeleton_sha=$skeleton_sha"
            echo "skeleton_matrix_ip=$skeleton_matrix_ip"
            echo "skeleton_todo=$skeleton_todo"
          } >> "$GITHUB_OUTPUT"
          echo "Skeleton baseline: ${skeleton_bytes} bytes (diagnostic only), sha256=${skeleton_sha:0:12}…, ${skeleton_matrix_ip} matrix IN PROGRESS rows, ${skeleton_todo} _TODO_ section blocks."
          echo "Skeleton OK — Claude will update IN PROGRESS markers and add the closing line."

      - name: Invoke Claude repo-audit-bot
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PR Sentinel-A — show_full_output exposes permission_denials by name
          # so we can diagnose which tools Claude tried to call. Run 26332734778
          # had `permission_denials_count: 10` with the affected tools hidden,
          # which is what motivated this PR. Output remains GitHub-Actions-log
          # only (not posted as a PR comment), so no secrets are exposed beyond
          # the existing runner log audience.
          show_full_output: true
          # Allow-list: Claude can read freely, run npm validators / curl / read-only
          # scripts, and write ONLY under memory/audits/. No Edit, no general Write,
          # no Bash for git/gh/prisma/destructive commands.
          # NOTE: `npm run build` and `npx jest --ci --forceExit` are intentionally
          # NOT in this allow-list. Those are already gated by `pr-check.yml` and
          # `guardrails.yml` on every PR; running them inside the scheduled audit
          # is duplicative and burns the 35-minute Claude job budget. The audit
          # focuses on compliance, RESO/IDX mapping, production behavior, and
          # report synthesis — not build/test correctness.
          # PR Sentinel-A — allow-list INTENTIONALLY LEFT UNCHANGED from
          # pre-Sentinel-A. Read / Glob / Grep already cover safe inspection,
          # and broad shell-utility patterns (find / sed / awk especially) open
          # a write/exec/redirect surface even when "read-only" in intent:
          # `find -exec`, `find -delete`, `sed -i`, redirects (`> >> | tee`),
          # `awk` system()/getline-write, etc. (Codex finding 2 on PR Sentinel-A.)
          # show_full_output: true above will surface the actual denied tools
          # on the next run; only then will we add precisely those (and only in
          # the safest narrow forms — never the broad `<cmd> *` patterns).
          #
          # PR Sentinel-A.2 (2026-05-24) — root-cause fix for run 26361375109.
          # The 2026-05-24 audit failed with the Sentinel-A post-Claude guard
          # citing zero-Write. show_full_output revealed Claude DID try
          # `Write(/home/runner/work/mallan-nyc/mallan-nyc/memory/audits/
          # AUDIT-2026-05-24.md)` with the exact early-write content the
          # Sentinel-A prompt requested. The Write was DENIED because the
          # allow-list pattern `Write(memory/audits/**)` is a relative-path
          # glob that does NOT match the absolute path Claude SDK supplies.
          # Sentinel-A.2 added `Write(/home/runner/work/**/memory/audits/**)`
          # but the verification run (26369571083) showed Write was STILL
          # denied — the matcher does not honor `**` in non-terminal
          # position of an absolute Write pattern.
          #
          # PR Sentinel-A.3 (2026-05-24) — replace the mid-path `**` variant
          # with the exact repo workspace prefix and only trailing `**`.
          # Hardcoding `mallan-nyc/mallan-nyc` is acceptable because the
          # repo name is already hardcoded in vercel.json, CLAUDE.md, and
          # several workflow headers; this workflow itself is repo-specific.
          # Write surface is still anchored to `/memory/audits/` ONLY.
          # No Edit, no Bash-write, no Write outside memory/audits.
          #
          # PR Sentinel-A.4 (2026-05-24) — official Claude Code permission
          # syntax fix. The Sentinel-A.3 verification run also failed RED for
          # the same root cause as A.2: the matcher interprets a single
          # leading `/` as PROJECT-ROOT-RELATIVE, not filesystem-absolute,
          # per the gitignore-spec documented at
          # https://code.claude.com/docs/en/permissions :
          #
          #   //path  → filesystem absolute (e.g. Read(//Users/alice/secrets/**))
          #   /path   → relative to project root
          #   ~/path  → relative to home directory
          #   path    → relative to current directory
          #
          # The docs warn explicitly: "A pattern like /Users/alice/file is
          # NOT an absolute path. It's relative to the project root. Use
          # //Users/alice/file for absolute paths." Our prior entry
          # `Write(/home/runner/.../memory/audits/**)` was therefore being
          # matched against `<project-root>/home/runner/...` (which does
          # not exist) instead of the absolute path Claude SDK supplies.
          # Fix: prepend a second leading slash → `Write(//home/runner/...)`.
          # Write surface remains anchored to `/memory/audits/` ONLY.
          # No Edit, no Bash-write, no Write outside memory/audits.
          claude_args: >-
            --allowed-tools "Read,Glob,Grep,WebFetch,WebSearch,Bash(npm run type-check),Bash(npm run lint),Bash(npm run compliance-check),Bash(npm run idx:validate),Bash(npm run rls:validate),Bash(npm run ucba:audit),Bash(npm run crm:check-build),Bash(npm run repo:hygiene),Bash(npm run ops:health),Bash(npm run ops:system-audit),Bash(curl -fsSL *),Bash(curl -sS *),Bash(node scripts/*),Bash(git status),Bash(git diff),Bash(git log *),Bash(gh pr list*),Bash(gh issue list*),Write(memory/audits/**),Write(//home/runner/work/mallan-nyc/mallan-nyc/memory/audits/**)"
          prompt: |
            STRICT REPORT-ONLY MODE.

            Follow `.claude/agents/repo-audit-bot.md` exactly. All 21 absolute
            restrictions in that file apply, plus these extra workflow-level rules:

              - You may NOT push, commit, merge, open/close/reopen PRs, run
                `prisma migrate`, trigger crons, delete media, change Neon/Vercel/
                Cloudflare/REBNY/Trestle settings, release the external-inventory
                hold, remove media-backfill, reopen PR #104, start JSON-drop work,
                or alter production data.
              - You may write EXACTLY ONE file: ${{ steps.paths.outputs.report_path }}
              - The workflow handles git + PR creation. Do not attempt either.

            ### UPDATE-SKELETON RULE (NO Write-to-create — skeleton already exists)

            The workflow has ALREADY created the report file at
            ${{ steps.paths.outputs.report_path }} BEFORE invoking you. The
            skeleton contains: the timestamp header, `status: IN PROGRESS`,
            the literal placeholder line `Overall status: IN PROGRESS — audit
            running.`, the `## Coverage Matrix` table with all 21 audit-area
            rows initialized to `IN PROGRESS`, and all A–S section headers
            each with a `_TODO_` placeholder. The literal closing line
            `Report-only: no changes made.` is intentionally NOT in the
            skeleton — you add it last.

            Your job is to UPDATE this existing file as you investigate. The
            workflow tools allow-list grants you `Write(memory/audits/**)`.
            Each Write call overwrites the whole file with the new content;
            do NOT lose the structural elements the skeleton already set up.

            ### EARLY-WRITE REQUIREMENT (mandatory — diagnostic + smoke test)

            Run `26332734778` (the failure this PR fixes) showed Claude finish
            with SDK `success` after 24 min / 90 turns and `permission_denials
            _count: 10` while making ZERO Write calls. The skeleton stayed
            byte-identical. The workflow now has a post-Claude diagnostic guard
            that fails RED if Write was never invoked.

            You MUST follow this ordered procedure:

              1. **First action — Read the skeleton.** Call Read on the path
                 ${{ steps.paths.outputs.report_path }} so you have the exact
                 structure (headers, table layout, area names, A–S sections)
                 loaded.

              2. **Second action — Early Write (PROVE Write works).** BEFORE
                 any investigation, call Write on the same path with the
                 skeleton content plus a confirmation marker. Replace the
                 placeholder line `Overall status: IN PROGRESS — audit
                 running.` with:
                   `Overall status: IN PROGRESS — Sentinel started; first
                   write confirmed at <UTC ISO timestamp>.`
                 Keep `status: IN PROGRESS` in the header. This second Write
                 proves the Write tool functions in this runner / for this
                 path. If Write is denied, STOP and document the denial in
                 your final synthesis — do not waste the runtime budget on
                 investigation that cannot be reported.

              3. **Then begin investigation.**

            ### WRITE-AFTER-EACH-AREA REQUIREMENT (mandatory)

            After EACH audit area (not batched, not at the end), call Write
            with the file's updated full contents:

              - Replace that area's Coverage Matrix row `IN PROGRESS` with
                `PASS / FAIL / LIMITED / NOT VERIFIED / BLOCKED`, plus the
                cited evidence path and a one-line note.
              - Replace that area's A–S section `_TODO_` with the actual
                findings + evidence excerpts.
              - Save immediately. Do not hold multiple areas in memory before
                saving — a runner timeout, network blip, or tool denial
                would lose all unsaved progress. The post-Claude guard
                requires measurable progress (at least one Matrix row not
                `IN PROGRESS` AND at least one section not `_TODO_`); the
                existing Gate 3 still fails on any remaining `IN PROGRESS`.

            If a verification approach hits a permission denial, IMMEDIATELY
            mark that area `LIMITED` or `NOT VERIFIED` in the next Write with
            a one-line evidence-gap note — do not keep retrying denied tools.

            ### POST-CLAUDE GUARD (workflow enforces — for your awareness)

            After your invocation returns, the workflow runs a diagnostic
            guard BEFORE the existing 3-gate guard:

              1. Report file SHA-256 must differ from the captured skeleton
                 baseline SHA-256. If identical (= the file is byte-for-byte
                 unchanged), the guard fires with: "Claude returned success
                 but did not update the audit file." Rerunning the workflow
                 without changing this prompt will reproduce the same
                 failure — fix the underlying tool denial first.
                 (Note: this is content-hash, NOT byte-growth — a perfectly
                 complete terse audit may legitimately be SHORTER than the
                 skeleton, so we compare content identity, not file size.)
              2. At least one Coverage Matrix row must no longer be
                 `IN PROGRESS` AND at least one A–S section must no longer
                 be `_TODO_` (proves real audit-area progress beyond the
                 early-write smoke test).

            The existing Gate 3 then fails RED if ANY `IN PROGRESS` remains
            (so the new guard is more permissive than Gate 3 by design —
            it catches the catastrophic zero-Write case earlier with a
            clearer error message).

            ### COVERAGE STANDARD — NOT A SPOT-CHECK

            Every one of the 21 audit areas listed in the agent definition
            MUST be evaluated in every report using the Minimum Evidence
            Standard (next section). If full verification is not possible
            within the 35-minute runtime, the area MUST be labeled `LIMITED`
            or `NOT VERIFIED` in the Coverage Matrix, with the exact evidence
            gaps stated in the area's body section (which files / which
            checks were skipped, and why).

            Do NOT imply full coverage when only sample probing was performed.
            A "spot-check that found nothing" labeled `PASS` is a guardrail
            failure. The honest label for sampled-without-full-verification
            is `LIMITED`. The honest label for not-checked-at-all is
            `NOT VERIFIED`.

            When an area has many artifacts (all listing display surfaces,
            all search code paths, all CRM HTML, all API routes), enumerate
            them with Glob/Grep, then verify a defined subset. The Coverage
            Matrix row MUST say `LIMITED` and the body section MUST list what
            was sampled versus what was not.

            ### MINIMUM EVIDENCE STANDARD

            Every finding AND every Coverage Matrix row must cite at least ONE
            of: file path + line number(s), command + output excerpt (exact
            command, not a paraphrase), or external URL + retrieval timestamp.
            A finding without evidence is a draft, not a finding.

            ### RUNTIME BUDGET POLICY (35-minute job timeout)

            If runtime tightens:
              - **Reduce prose first**, not evidence. Bullets > paragraphs.
              - Mark unfinished areas as `LIMITED` in the Coverage Matrix and
                explain in the area's section what was and was not checked.
              - Do NOT skip writing the file. A partial-coverage report with
                clearly marked LIMITED rows is acceptable; a missing report
                is a fail-red workflow outcome.

            ### COMPARE AGAINST PRIORS

            Compare findings against the most recent prior `memory/audits/AUDIT-*.md`,
            and against pre-existing `memory/AUDIT-*.md`, `memory/BACKEND-AUDIT-*.md`,
            and `memory/RESO-COMPLIANCE-AUDIT-*.md`. Cite deltas in section D (New
            since last audit) and section E (Fixed since last audit).

            ### FINISH STATE (REQUIRED — workflow verifies)

            Before your final Write call:
              - Replace the header line `status: IN PROGRESS` with
                `status: COMPLETE`.
              - Replace `Overall status: IN PROGRESS — audit running.` with
                the final `Overall status: Green` / `Yellow` / `Red` line.
              - Confirm NO `IN PROGRESS` strings remain anywhere in the file
                (Coverage Matrix included). If an area genuinely could not be
                verified, change that row's status to `LIMITED` or
                `NOT VERIFIED` — never leave it as `IN PROGRESS`.
              - Append the literal closing line at the very end:
                `Report-only: no changes made.`

            The workflow's guard + final-verification steps fail RED if any of:
            file missing (should not happen — skeleton was pre-created), any
            `IN PROGRESS` string still present, missing `Overall status:
            Green|Yellow|Red`, missing `Coverage Matrix`, or missing the
            `Report-only: no changes made.` closing line.

            Use the A–S section format from the agent definition. Cite file paths,
            line numbers, command excerpts, and external URLs as evidence for every
            finding. End with the literal line:

              Report-only: no changes made.

            If a finding requires action, record it as a recommendation in section P.
            Never auto-fix anything. Never invent commands not in your allow-list.

      - name: Revert validator-output side effects
        if: always()
        run: |
          # These tracked files are written as a normal side effect of allow-listed
          # validator commands (e.g. `npm run idx:validate` writes its run summary to
          # public/crm/data/validator-results.json + .idx-validate/history.json for
          # the CRM System Health dashboard, per CLAUDE.md). They are NOT Claude
          # editing app code. Revert them before the guardrail check so the audit
          # cleanly produces only memory/audits/** changes. The Claude tool
          # allow-list is unchanged — Claude still cannot Write to these paths.
          set +e
          git checkout -- public/crm/data/validator-results.json 2>/dev/null
          git checkout -- .idx-validate/history.json 2>/dev/null
          set -e
          echo "Reverted any validator-output side effects (if present)."

      # ---------------------------------------------------------------------
      # PR Sentinel-A — POST-CLAUDE DIAGNOSTIC GUARD
      #
      # Why this exists: Run 26332734778 (2026-05-23T12:31:04Z) failed with
      # Claude SDK returning `success` after 24m / 90 turns / 10 permission
      # denials and ZERO Write calls. The skeleton stayed byte-identical
      # (1510-byte artifact == 1510-byte skeleton). Existing Gate 3 fired on
      # "IN PROGRESS still present" — correct, but a misleading error
      # message because the actual defect was "Claude never wrote anything."
      #
      # This guard runs BEFORE the existing 3-gate guard so the operator
      # sees the clearer diagnostic first:
      #   - File SHA == skeleton SHA  -> zero-Write failure (content
      #     unchanged regardless of byte count; addresses Codex finding 1
      #     on PR Sentinel-A that byte-growth falsely flags terse complete
      #     audits that happen to be shorter than the skeleton)
      #   - All Matrix rows still IN PROGRESS AND all sections still _TODO_
      #     -> Claude wrote but made no audit progress (e.g. early-write
      #        succeeded but investigation phase stalled)
      # The existing Gate 3 still enforces full completion afterward.
      # ---------------------------------------------------------------------
      - name: Verify Claude actually updated the report (post-invocation diagnostic)
        id: postclaude
        run: |
          set -euo pipefail
          report="${{ steps.paths.outputs.report_path }}"
          skeleton_bytes="${{ steps.skeleton.outputs.skeleton_bytes }}"
          skeleton_sha="${{ steps.skeleton.outputs.skeleton_sha }}"
          skeleton_matrix_ip="${{ steps.skeleton.outputs.skeleton_matrix_ip }}"
          skeleton_todo="${{ steps.skeleton.outputs.skeleton_todo }}"

          if [ ! -f "$report" ]; then
            echo "::error::Report file missing after Claude invocation: $report"
            echo "::error::Skeleton-create step ran (we have a baseline) but the file is gone."
            exit 1
          fi

          current_bytes=$(wc -c < "$report")
          current_sha=$(sha256sum "$report" | awk '{print $1}')
          # `|| true` keeps grep -c from exit-1ing on zero matches under set -e.
          current_matrix_ip=$(grep -c '| IN PROGRESS |' "$report" || true)
          current_todo=$(grep -c '^_TODO_$' "$report" || true)

          echo "Post-Claude diagnostic:"
          echo "  bytes:           $current_bytes (skeleton baseline: $skeleton_bytes, diagnostic only — NOT a gate)"
          echo "  sha256:          ${current_sha:0:12}… (skeleton baseline: ${skeleton_sha:0:12}…)"
          echo "  matrix IP rows:  $current_matrix_ip (skeleton baseline: $skeleton_matrix_ip)"
          echo "  _TODO_ blocks:   $current_todo (skeleton baseline: $skeleton_todo)"

          # Check 1 — Did Claude call Write at all? Use content HASH, not bytes:
          # a perfectly-completed audit may legitimately be SHORTER than the
          # skeleton (e.g., "PASS" replacing "IN PROGRESS", terse evidence lines
          # replacing `_TODO_` blocks). Same SHA = same content = Write was
          # never called, regardless of file size. (Addresses Codex finding 1.)
          if [ "$current_sha" = "$skeleton_sha" ]; then
            echo "::error::Claude returned success but did not update the audit file."
            echo "::error::Current SHA-256 == skeleton baseline SHA-256 ($current_sha)."
            echo "::error::File is byte-for-byte identical to the pre-Claude skeleton."
            echo "::error::This is the same failure mode as run 26332734778."
            echo "::error::Inspect the full Claude action output above (show_full_output: true)"
            echo "::error::for the list of permission-denied tools and address those before rerunning."
            exit 1
          fi

          # Check 2 — Did Claude make measurable audit-area progress?
          #
          # Claude is required (per prompt) to do an early-write that proves
          # Write works but does not necessarily clear a Matrix row. So a
          # changed SHA alone is consistent with an early-write-then-stall.
          # We require that at least one Matrix row OR at least one A-S
          # section actually transitioned away from its initial placeholder.
          if [ "$current_matrix_ip" -ge "$skeleton_matrix_ip" ] && [ "$current_todo" -ge "$skeleton_todo" ]; then
            echo "::error::Claude wrote to the report but made no audit-area progress."
            echo "::error::Every Coverage Matrix row is still IN PROGRESS AND every A-S section is still _TODO_."
            echo "::error::Likely cause: early-write succeeded but the investigation phase stalled or hit tool denials."
            echo "::error::Inspect the full Claude action output above (show_full_output: true) and adjust the allow-list."
            exit 1
          fi

          echo "Post-Claude diagnostic passed — Claude wrote AND made measurable audit-area progress."
          echo "Handing off to the existing 3-gate guard for full-completion enforcement."

      - name: Verify audit report exists, is in scope, and is complete
        id: guard
        run: |
          set -euo pipefail
          report="${{ steps.paths.outputs.report_path }}"

          # ---------------------------------------------------------------
          # GATE 1 — Report file MUST exist on disk. Missing report = FAIL RED.
          # No more silent green runs.
          # ---------------------------------------------------------------
          if [ ! -f "$report" ]; then
            echo "::error::Claude produced no audit report at $report."
            echo "::error::Sentinel must produce a durable report file every run."
            echo "::error::Check the workflow's Claude invocation log for why Write was never called."
            echo "no_report=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # ---------------------------------------------------------------
          # GATE 2 — Working-tree changes MUST be limited to memory/audits/**.
          # Anything outside that path is a guardrail violation = FAIL RED.
          # ---------------------------------------------------------------
          changed=$(git status --porcelain | awk '{print $2}')
          if [ -z "$changed" ]; then
            echo "::error::Report file exists at $report but git sees no working-tree change."
            echo "::error::Either the file is identical to HEAD or staging failed."
            exit 1
          fi
          unexpected=$(echo "$changed" | grep -v -E "^memory/audits/" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Audit bot modified files outside memory/audits/** (guardrail violation):"
            echo "$unexpected"
            exit 1
          fi

          # ---------------------------------------------------------------
          # GATE 3 — Report must NOT still be marked IN PROGRESS.
          # An unfinished audit = FAIL RED. We do not commit/PR partial drafts.
          # ---------------------------------------------------------------
          if grep -q 'IN PROGRESS' "$report"; then
            echo "::error::Report still contains 'IN PROGRESS' marker — audit did not finish cleanly."
            echo "::error::Either Claude ran out of turns mid-audit or the finish-state step was skipped."
            grep -n 'IN PROGRESS' "$report" | head -10 || true
            exit 1
          fi

          echo "All 3 gates passed. Proceeding to commit + PR."
          echo "no_report=false" >> "$GITHUB_OUTPUT"

      - name: Commit + push audit report
        if: steps.guard.outputs.no_report == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add "${{ steps.paths.outputs.report_path }}"
          git commit -m "audit: report-only run ${{ steps.paths.outputs.report_date }}" \
                     -m "Generated by .github/workflows/repo-audit-bot.yml. Report-only — no other files changed."
          git push --set-upstream origin "${{ steps.paths.outputs.branch }}"

      - name: Open draft PR (never merge)
        if: steps.guard.outputs.no_report == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --head "${{ steps.paths.outputs.branch }}" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ]; then
            echo "PR already exists for ${{ steps.paths.outputs.branch }}: #$existing — appending commit instead."
            exit 0
          fi
          gh pr create \
            --draft \
            --base main \
            --head "${{ steps.paths.outputs.branch }}" \
            --title "Mallan Sentinel audit(report-only): ${{ steps.paths.outputs.report_date }}" \
            --body "$(cat <<EOF
          Auto-generated by \`.github/workflows/repo-audit-bot.yml\`.

          - Branch: \`${{ steps.paths.outputs.branch }}\`
          - Report: \`${{ steps.paths.outputs.report_path }}\`
          - Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **Report-only.** This PR exists for review history. **Do not merge.**
          EOF
          )"

      # -----------------------------------------------------------------------
      # FINAL VERIFICATION — structural fingerprint of the committed report.
      # The guard above already enforced existence + scope + no-IN-PROGRESS.
      # This step is a defense-in-depth check that the report is structurally
      # complete (has Overall status / Coverage Matrix / required closing line).
      # If anything is missing, fail the run RED so the draft PR is visibly
      # broken and Maya knows not to trust it.
      # -----------------------------------------------------------------------
      - name: Final report verification
        if: steps.guard.outputs.no_report == 'false'
        run: |
          set -euo pipefail
          report="${{ steps.paths.outputs.report_path }}"
          missing=0

          if [ ! -f "$report" ]; then
            echo "::error::Report file disappeared between guard and final verification: $report"
            exit 1
          fi

          if ! grep -Eqi '^Overall status:[[:space:]]*(Green|Yellow|Red)' "$report"; then
            echo "::error::Report missing 'Overall status: Green|Yellow|Red' line."
            missing=1
          fi

          if ! grep -Eq 'Coverage Matrix' "$report"; then
            echo "::error::Report missing 'Coverage Matrix' section."
            missing=1
          fi

          if ! grep -Eq '^Report-only: no changes made\.$' "$report"; then
            echo "::error::Report missing literal closing line 'Report-only: no changes made.'"
            missing=1
          fi

          if grep -q 'IN PROGRESS' "$report"; then
            echo "::error::Report still contains 'IN PROGRESS' — audit incomplete."
            missing=1
          fi

          if [ "$missing" = "1" ]; then
            echo "::error::Final verification failed — report is structurally incomplete."
            echo "::error::See errors above. The draft PR exists but should be treated as broken."
            exit 1
          fi

          echo "Final verification passed: report has all required structural markers."

      - name: Upload report artifact (always, when report exists)
        # Run even when an earlier step (e.g. the guardrail) failed, so the
        # report is recoverable for debugging instead of being lost on the
        # ephemeral runner. `if-no-files-found: warn` keeps it non-fatal when
        # Claude produced no report.
        if: always() && steps.paths.outputs.report_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ steps.paths.outputs.report_date }}
          path: ${{ steps.paths.outputs.report_path }}
          retention-days: 30
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. Email Maya only when the report contains a trigger phrase. This job has
  #    NO repo checkout — it only sees the report artifact + SMTP creds.
  # ---------------------------------------------------------------------------
  alert:
    needs: audit
    if: needs.audit.result == 'success' && needs.audit.outputs.no_report == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: none
      issues: write
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: audit-report-${{ needs.audit.outputs.report_date }}
          path: report

      - name: Scan for severity trigger
        id: scan
        run: |
          set -euo pipefail
          file=$(find report -type f -name '*.md' | head -1)
          if [ -z "$file" ]; then
            echo "No report file found. Skipping alert."
            echo "should_alert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sev=""
          if   grep -Eqi '^Overall status:[[:space:]]*Red'    "$file"; then sev="RED"
          elif grep -Eqi '^Overall status:[[:space:]]*Yellow' "$file"; then sev="YELLOW"
          elif grep -Eqi '\bCritical:'                         "$file"; then sev="CRITICAL"
          elif grep -Eqi '\bHigh:'                             "$file"; then sev="HIGH"
          elif grep -Eqi '\bRegression:'                       "$file"; then sev="REGRESSION"
          elif grep -Eqi '\bCompliance risk:'                  "$file"; then sev="COMPLIANCE"
          elif grep -Eqi '\bSecurity risk:'                    "$file"; then sev="SECURITY"
          elif grep -Eqi '\bProduction failure:'               "$file"; then sev="PRODUCTION"
          fi
          if [ -z "$sev" ]; then
            echo "Clean Green report — no email."
            echo "should_alert=false" >> "$GITHUB_OUTPUT"
          else
            echo "Trigger matched: $sev"
            echo "should_alert=true" >> "$GITHUB_OUTPUT"
            echo "severity=$sev"     >> "$GITHUB_OUTPUT"
            echo "report_file=$file" >> "$GITHUB_OUTPUT"
          fi

      - name: Build email body from report sections
        if: steps.scan.outputs.should_alert == 'true'
        run: |
          set -euo pipefail
          file="${{ steps.scan.outputs.report_file }}"
          {
            echo "Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Report: ${{ needs.audit.outputs.report_path }}"
            echo "Branch: ${{ needs.audit.outputs.branch }}"
            echo "PRs:    ${{ github.server_url }}/${{ github.repository }}/pulls?q=head%3A${{ needs.audit.outputs.branch }}"
            echo
            echo "=== A. Date / Time ==="
            awk '/^A\./,/^B\./'   "$file" | sed '$d' || true
            echo
            echo "=== B. Overall Status ==="
            awk '/^B\./,/^C\./'   "$file" | sed '$d' || true
            echo
            echo "=== C. Top 5 Risks ==="
            awk '/^C\./,/^D\./'   "$file" | sed '$d' || true
            echo
            echo "=== P. Recommended Fix Order ==="
            awk '/^P\./,/^Q\./'   "$file" | sed '$d' || true
            echo
            echo "=== R. Guardrail Confirmation ==="
            awk '/^R\./,/^S\./'   "$file" | sed '$d' || true
          } > body.txt
          # Cap at 60 KB so we stay well under M365's per-message size sanity bound.
          head -c 61440 body.txt > body.trimmed.txt
          mv body.trimmed.txt body.txt
          echo "--- email preview (head) ---"
          head -40 body.txt

      - name: Send email alert
        if: steps.scan.outputs.should_alert == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.AUDIT_SMTP_HOST }}
          server_port:    ${{ vars.AUDIT_SMTP_PORT }}
          secure:         false
          username:       ${{ secrets.SMTP_USER }}
          password:       ${{ secrets.SMTP_PASS }}
          subject: "Mallan Sentinel alert — ${{ steps.scan.outputs.severity }} — mallan.nyc — ${{ needs.audit.outputs.report_date }}"
          to:   ${{ vars.AUDIT_ALERT_EMAIL }}
          from: "Mallan Sentinel <${{ secrets.SMTP_USER }}>"
          body: file://body.txt

      - name: Fallback issue if email send failed
        if: failure() && steps.scan.outputs.should_alert == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create audit-alert --color B60205 \
            --description "Auto-opened by repo-audit-bot when email failed" 2>/dev/null || true
          gh issue create \
            --title "Audit alert ${{ steps.scan.outputs.severity }} — ${{ needs.audit.outputs.report_date }} (email send failed)" \
            --label audit-alert \
            --body "Email delivery failed. Report at \`${{ needs.audit.outputs.report_path }}\`. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
