+++ b/.github/workflows/rotate-db-keys.yml
@@ -0,0 +1,111 @@
+name: Rotate Neon DB Credentials
+
+on:
+  schedule:
+    - cron: "0 5 1,15 * *" # Every 1st and 15th at 5AM UTC
+  workflow_dispatch:
+
+jobs:
+  rotate:
+    runs-on: ubuntu-latest
+    permissions:
+      contents: write
+      actions: write
+      id-token: write
+
+    env:
+      GH_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
+      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
+      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
+      VERCEL_PROJECT_ID: "prj_gcdTm2kBRm7oPdGScHZpnHRPc2gW"
+      SMTP_USER: ${{ secrets.SMTP_USER }}
+      SMTP_PASS: ${{ secrets.SMTP_PASS }}
+      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
+      PROJECT_ID: "morning-bread-68708332"
+      BRANCH_ID: "br-old-tree-admdlb9z"
+      ROLE: "authenticator"
+      REPO: "mallan67/mallan-nyc"
+
+    steps:
+      - name: Checkout repo
+        uses: actions/checkout@v4
+
+
+      - name: Rotate Neon password
+        id: rotate
+        run: |
+          echo "≡ƒöä Rotating Neon DB password..."
+          echo "Generating new Neon password..."
+
+          NEW_PASS=$(curl -s -X POST \
+            -H "Authorization: Bearer $NEON_API_KEY" \
+            -H "Content-Type: application/json" \
+            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID/roles/$ROLE/reset_password" \
+            | jq -r '.role.password')
+
+          if [ -z "$NEW_PASS" ] || [ "$NEW_PASS" = "null" ]; then
+            echo "Γ¥î Neon password rotation failed."
+            echo "$(date -u) Γ¥î Rotation failed." >> rotation-history.log
+            exit 1
+          fi
+
+          echo "Γ£à New password generated."
+          NEW_CONN="postgresql://$ROLE:$NEW_PASS@ep-royal-dawn-ad6eh8t2-pooler.c-2.us-east-1.aws.neon.tech:5432/neondb?sslmode=require&channel_binding=require"
+
+          echo "≡ƒöÉ Updating GitHub secrets..."
+          echo "$NEW_CONN" | gh secret set DATABASE_URL --repo "$REPO" --app actions
+          echo "$NEW_CONN" | gh secret set ASSISTANT_DATABASE_URL --repo "$REPO" --app actions
+
+          echo "Γ£à Updated secrets successfully."
+          echo "$(date -u) Γ£à Rotation successful." >> rotation-history.log
+
+      - name: Trigger Vercel redeploy
+        run: |
+          echo "≡ƒÜÇ Triggering redeploy..."
+          curl -X POST "https://api.vercel.com/v13/deployments" \
+            -H "Authorization: Bearer $VERCEL_TOKEN" \
+            -H "Content-Type: application/json" \
+            -d "{\"projectId\":\"$VERCEL_PROJECT_ID\"}"
+
+      - name: Send Slack notification
+        if: always()
+        run: |
+          if [ -n "$SLACK_WEBHOOK_URL" ]; then
+            STATUS="${{ job.status }}"
+            MSG="≡ƒîÇ *Neon Rotation ($REPO)* completed with status: *$STATUS*"
+            curl -X POST -H 'Content-type: application/json' \
+              --data "{\"text\": \"$MSG\"}" "$SLACK_WEBHOOK_URL"
+          else
+            echo "No Slack webhook configured."
+          fi
+
+      - name: Send email notification
+        if: always()
+        uses: dawidd6/action-send-mail@v3
+        with:
+          server_address: smtp.gmail.com
+          server_port: 587
+          username: ${{ secrets.SMTP_USER }}
+          password: ${{ secrets.SMTP_PASS }}
+          subject: "Neon DB Rotation (${{ job.status }})"
+          to: "maya@mallannyhomes.com"
+          from: "Neon Rotation Bot <${{ secrets.SMTP_USER }}>"
+          body: |
+            Hi Maya ≡ƒæï,
+
+            The Neon database credentials for mallan-nyc were rotated on $(date -u).
+            Status: ${{ job.status }}
+
+            View logs:
+            https://github.com/mallan67/mallan-nyc/actions
+
+      - name: Commit audit log
+        if: always()
+        run: |
+          git config --global user.name "Rotation Bot"
+          git config --global user.email "bot@users.noreply.github.com"
+          
+          # Force-add ignored log file
+          git add -f rotation-history.log
+          git commit -m "≡ƒ¬╡ Rotation log update ($(date -u))" || echo "No changes to commit"
+          git push || echo "No push needed"
