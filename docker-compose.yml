$yml = @'
version: "3.8"
services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PORT=8000

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
    environment:
      - PORT=3000
'@

$yml | Out-File -FilePath docker-compose.yml -Encoding utf8
Write-Host "Created docker-compose.yml"
